// ========== CHARACTER FUNCTIONS ==========
function cap(r, h, seg = 32) {
  const p = [], n = 14;
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI / 2;
    p.push(new THREE.Vector2(Math.sin(a) * r, -Math.cos(a) * r));
  }
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI / 2;
    p.push(new THREE.Vector2(Math.cos(a) * r, h + Math.sin(a) * r));
  }
  return new THREE.LatheGeometry(p, seg);
}

const shadowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 2, 32, 32, 32);
  g.addColorStop(0, 'rgba(0,0,0,.35)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

function makeChar(color, s = 1, crowd = false, name = "") {
  const g = new THREE.Group();

      roughness: 0.6

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 24), skin);
    head.position.y = 1.72;
    g.add(head);

    hat.position.y = 1.78;

    b.position.y = 1.02;

  const arms = [];

    const p = new THREE.Group();
    p.position.set(d * (crowd ? 0.4 : 0.5), 1.2, 0);
    const a = new THREE.Mesh(cap(0.1, 0.36), m);
    a.position.y = -0.52;
    p.add(a);
    p.rotation.z = d * 0.1;
    g.add(p);
    arms.push(p);

  g.scale.setScalar(s);
  g.userData = { arms, legs, ph: Math.random() * 6, name: name, playerId: playerId };

    labelCanvas.height = 64;

      depthTest: false 
    }));
    label.scale.set(1.5, 0.4, 1);
    label.position.y = 2.2;
    g.add(label);
  }
  
  return g;
}

centralCol.position.y = 0.6;
centralCol.castShadow = true;

tableFelt.rotation.x = -Math.PI / 2;
tableFelt.position.y = 1.37;

// Chairs
chairPositions.forEach(pos => {
  const chairGroup = new THREE.Group();
  const angle = pos.angle;
  const x = Math.sin(angle) * pos.radius;

// Score board
const bc = document.createElement('canvas');
bc.width = 1024;
bc.height = 512;
const bx = bc.getContext('2d');
let rv = 0;
const bt = new THREE.CanvasTexture(bc);

function drawBoard() {
  bx.fillStyle = '#1b2a8f';
  bx.fillRect(0, 0, 1024, 512);
  bx.strokeStyle = '#ffb300';
  bx.lineWidth = 14;
  bx.strokeRect(7, 7, 1010, 498);
  bx.fillStyle = '#fff';
  bx.font = 'bold 38px Arial';
  bx.textAlign = 'center';
  bx.fillText(QUESTION, 512, 70);
  
  ANSWERS.forEach((a, i) => {
    const y = 110 + i * 76;
    const on = i < rv;
    bx.fillStyle = on ? '#ffb300' : '#0d1560';
    bx.fillRect(80, y, 864, 62);
    bx.fillStyle = on ? '#1b1b1b' : '#7f8cff';
    bx.font = 'bold 38px Arial';
    bx.textAlign = 'left';
    bx.fillText(on ? a[0] : String(i + 1), 110, y + 44);
    if (on) {
      bx.textAlign = 'right';
      bx.fillText(String(a[1]), 914, y + 44);
    }
  });
  bt.needsUpdate = true;
}

drawBoard();

);

// ========== FIREBASE FUNCTIONS ==========
let mode = 'lobby';

// Create a new room
function createRoom() {
  roomId = Math.random().toString(36).substr(2, 6).toUpperCase();
  isHost = true;
  
  // Save room in Firebase
  database.ref('rooms/' + roomId).set({
    host: playerId,
    hostName: playerName,
    players: { [playerId]: { name: playerName, ready: false } },
    started: false,
    revealed: 0,
    createdAt: firebase.database.ServerValue.TIMESTAMP
  });
  
  // Show room code
  document.getElementById('roomCode').textContent = roomId;
  document.getElementById('roomPanel').style.display = 'block';
  document.getElementById('startBtn').style.display = 'block';
  document.getElementById('b').style.display = 'block';
}

// Join a room
function joinRoom(roomCode) {
  roomId = roomCode.toUpperCase();
  isHost = false;
  
  // Add player to room
  database.ref('rooms/' + roomId + '/players/' + playerId).set({
    name: playerName,
    ready: false
  });
  
  document.getElementById('roomCode').textContent = roomId;
  document.getElementById('roomPanel').style.display = 'none';
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('b').style.display = 'block';
}

// Leave room
function leaveRoom() {
  if (roomId) {
    database.ref('rooms/' + roomId + '/players/' + playerId).remove();
    
    // If host leaves, delete room
    if (isHost) {
      database.ref('rooms/' + roomId).remove();
    }
  }
  roomId = null;
  isHost = false;
  
  // Reset UI
  document.getElementById('roomPanel').style.display = 'block';
  document.getElementById('roomCode').textContent = '';
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('b').style.display = 'none';
  setMode('lobby');
}

// Start the game
function startGame() {
  if (!isHost || !roomId) return;
  
  database.ref('rooms/' + roomId).update({
    started: true,
    revealed: 0
  });
  
  document.getElementById('startBtn').style.display = 'none';
}

// Reveal answer
function reveal() {
  if (!roomId || !isHost) return;
  
  const roomRef = database.ref('rooms/' + roomId);
  roomRef.transaction(function(room) {
    if (room) {
      room.revealed = (room.revealed || 0) + 1;
      if (room.revealed > ANSWERS.length) {
        room.revealed = 0;
      }
    }
    return room;
  });
}

// ========== LISTEN TO FIREBASE ==========
// Listen for room changes
database.ref('rooms').on('child_added', function(snapshot) {
  const room = snapshot.val();
  if (roomId === snapshot.key) {
    updatePlayersList(room.players);
    updatePlayerCount(Object.keys(room.players).length);
    
    if (room.started) {
      setMode('table');
    }
  }
});

database.ref('rooms').on('child_changed', function(snapshot) {
  const room = snapshot.val();
  if (roomId === snapshot.key) {
    updatePlayersList(room.players);
    updatePlayerCount(Object.keys(room.players).length);
    
    if (room.started) {
      setMode('table');
      rv = room.revealed || 0;
      drawBoard();
    } else {
      setMode('lobby');
      rv = 0;
      drawBoard();
    }
  }
});

database.ref('rooms').on('child_removed', function(snapshot) {
  if (roomId === snapshot.key) {
    leaveRoom();
    updatePlayerCount(0);
    updatePlayersList({});
  }
});

// Update players list UI
function updatePlayersList(playersObj) {
  const listHtml = Object.values(playersObj || {}).map(p => 
    `<div>${p.name}${p.ready ? ' ✓' : ''}</div>`
  ).join('');
  document.getElementById('playersList').innerHTML = `<h4>Joueurs:</h4>${listHtml}`;
}

// Update player count
function updatePlayerCount(count) {
  document.getElementById('c').textContent = count + '/' + MAX_PLAYERS;
}

// ========== MODE MANAGEMENT ==========
function setMode(m) {
  mode = m;
  const lb = m === 'lobby';
  
  // Move players
  Object.values(players).forEach(p => {
    if (lb) {
      // Move to lobby
      const lobbyIndex = Object.keys(players).indexOf(p.userData.playerId) % lobbyPositions.length;
      p.position.set(lobbyPositions[lobbyIndex][0], 0, lobbyPositions[lobbyIndex][1]);
      p.rotation.y = 0;
      if (p.parent) p.parent.remove(p);
      scene.add(p);
      p.visible = true;
    } else {
      // Move to table (first 6 players)
      const tableIndex = Object.keys(players).indexOf(p.userData.playerId);
      if (tableIndex < 6) {
        const pos = tablePlayerPositions[tableIndex];
        const angle = pos.angle;
        p.position.set(
          Math.sin(angle) * pos.radius,
          0,
          Math.cos(angle) * pos.radius
        );
        p.rotation.y = -angle + Math.PI;
        if (p.parent) p.parent.remove(p);
        tg.add(p);
        p.visible = true;
      } else {
        p.visible = false;
      }
    }
  });
  
  // Hide/show objects
  const lobbyObjs = scene.children.filter(o => !o.isLight && o !== tg);
  lobbyObjs.forEach(o => o.visible = lb);
  tg.visible = !lb;
  
  // Update background
  scene.background.set(lb ? 0x5fc8ff : 0x15195c);
  
  // Update UI
  document.getElementById('t').style.display = lb ? '' : 'none';
  document.getElementById('h').textContent = lb 
    ? 'En attente du lancement...' 
    : 'Cliquez pour révéler les réponses';
  document.getElementById('b1').className = lb ? 'on' : '';
  document.getElementById('b2').className = lb ? '' : 'on';
  
  // Update camera
  cam.position.set(0, lb ? 8 : 7, lb ? 12.5 : 11);
  cam.lookAt(0, lb ? 1.2 : 2, lb ? -2 : -1);
}

// ========== BUTTON HANDLERS ==========
document.getElementById('createBtn').onclick = createRoom;
document.getElementById('joinBtn').onclick = () => {
  const roomCode = document.getElementById('roomInput').value;
  if (roomCode) joinRoom(roomCode);
};
document.getElementById('startBtn').onclick = startGame;
document.getElementById('b1').onclick = leaveRoom;
document.getElementById('b2').onclick = () => setMode('table');

// ========== POINTER EVENTS ==========
let mx = 0;
addEventListener('pointermove', e => {
  mx = (e.clientX / innerWidth - 0.5) * 2;
});

addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('button')) return;
  if (mode === 'table' && isHost) {
    reveal();
  }
});

addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  ren.setSize(innerWidth, innerHeight);
});

// ========== INITIALIZE ==========
// Show room panel at start
document.getElementById('roomPanel').style.display = 'block';
document.getElementById('b').style.display = 'none';

// Animation loop
const clk = new THREE.Clock();
(function loop() {
  const t = clk.getElapsedTime();
  
  // Animate all players
  Object.values(players).forEach(p => {
    const u = p.userData;
    const s = Math.sin(t * 3 + u.ph);
    p.position.y = Math.abs(s) * 0.06;
    if (u.arms) {
      u.arms[0].rotation.x = s * 0.25;
      u.arms[1].rotation.x = -s * 0.25;
    }
    p.rotation.y = Math.sin(t * 0.8 + u.ph) * 0.12;
  });
  
  // Camera movement
  cam.position.x += ((mx * 3) - cam.position.x) * 0.05;
  if (mode === 'lobby') {
    cam.lookAt(0, 1.2, -2);
  } else {
    cam.lookAt(0, 2, -1);
  }
  
  ren.render(scene, cam);
  requestAnimationFrame(loop);
})();
