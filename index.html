<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>CREATOR — Epitech Bénin</title>
<meta name="description" content="Quiz 3D multijoueur en temps réel autour du développement web et mobile — CREATOR, Epitech Bénin." />
<meta name="theme-color" content="#0C1A4B" />
<style>
  :root{
    --blue:#0B35FE; --navy:#0C1A4B; --green:#00E472; --coral:#FF4E20; --coral-h:#E63C10;
    --orange:#FF7A00; --light:#2E85FF; --bg:#F4F6FC; --white:#FFFFFF; --gold:#ffcf5a;
    --glass:rgba(12,26,75,.82); --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #scene{position:fixed;inset:0;touch-action:manipulation}
  #scene:not(.host-3d){display:none!important}
  .panel{position:fixed;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.45);padding:18px;z-index:5}
  .hidden{display:none!important}
  h1{margin:0 0 4px;font-size:26px;letter-spacing:.5px} h1 b{color:var(--green)}
  h2{margin:0 0 10px;font-size:18px}
  p.sub{margin:0 0 14px;opacity:.75;font-size:14px}
  input{width:100%;padding:13px 14px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.1);
    color:var(--white);font-size:16px;outline:none;margin-bottom:10px}
  input:focus{border-color:var(--light)}
  input.code{text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:700}
  button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer;
    background:var(--coral);color:var(--white);transition:background .15s,transform .1s;width:100%}
  button:hover{background:var(--coral-h)} button:active{transform:scale(.97)}
  button.sec{background:var(--blue)} button.sec:hover{background:#0928c9}
  button.ghost{background:rgba(255,255,255,.1)} button.ghost:hover{background:rgba(255,255,255,.18)}
  button:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .sep{text-align:center;opacity:.5;font-size:13px;margin:12px 0}
  #home{left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,380px)}
  #help{position:fixed;top:calc(10px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:6;
    background:var(--glass);border-radius:999px;padding:8px 16px;font-size:14px;max-width:92vw;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #topbar{position:fixed;top:calc(70px + var(--safe-t));left:10px;right:10px;display:flex;justify-content:space-between;z-index:6;pointer-events:none}
  #topbar>*{pointer-events:auto}
  .chip{background:var(--glass);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
  .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}
  #leave{width:auto;padding:7px 12px;font-size:13px;border-radius:999px}
  #lobby{left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);width:min(94vw,420px);max-height:48vh;overflow:auto}
  .codebox{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .codebox .c{flex:1;font-size:30px;font-weight:800;letter-spacing:6px;text-align:center;background:rgba(255,255,255,.08);
    border-radius:12px;padding:8px;color:var(--green)}
  .codebox button{width:auto}
  ul.pl{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  ul.pl li{background:rgba(255,255,255,.08);border-radius:999px;padding:5px 10px 5px 6px;font-size:13px;display:flex;align-items:center;gap:6px}
  ul.pl li i{width:14px;height:14px;border-radius:50%;display:inline-block}
  ul.pl li.me{outline:2px solid var(--gold)}
  .tag{background:var(--orange);border-radius:6px;padding:1px 6px;font-size:10px;text-transform:uppercase;font-weight:800}
  #game{left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);width:min(94vw,520px)}
  #qnum{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--green);font-weight:800}
  #qtext{font-size:19px;font-weight:700;margin:6px 0 14px;line-height:1.3}
  #answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #answers button.picked{outline:3px solid var(--gold)}
  #answers button.good{background:var(--green);color:var(--navy)}
  #answers button.bad{background:#5a6385}
  #status{font-size:14px;opacity:.85;margin-top:10px;text-align:center}
  #hostctl .who{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  #hostctl .who span{font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);opacity:.55}
  #hostctl .who span.ok{opacity:1;background:var(--green);color:var(--navy);font-weight:700}
  #end{left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);max-height:80vh;overflow:auto}
  table.rank{width:100%;border-collapse:collapse;margin:8px 0 14px}
  table.rank td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px}
  table.rank tr.win td{background:rgba(255,207,90,.22);color:var(--gold);font-weight:800}
  table.rank tr.me td{outline:2px solid var(--light);outline-offset:-2px}
  table.rank td.s{text-align:right;font-weight:800}
  #toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:var(--coral);padding:12px 18px;border-radius:12px;
    font-weight:700;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity .3s;opacity:0;pointer-events:none;text-align:center;max-width:90vw}
  #toast.show{opacity:1}
  #reaction{position:fixed;inset:0;background:rgba(12,26,75,.92);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  #reaction.show{display:flex}
  #reaction .big{font-size:clamp(34px,10vw,72px);font-weight:900;line-height:1;letter-spacing:2px;margin:0 0 12px;text-transform:uppercase}
  #reaction .big.ok{color:#00E472;text-shadow:0 0 30px rgba(0,228,114,.6)}
  #reaction .big.bad{color:#FF4E20;text-shadow:0 0 30px rgba(255,78,32,.6)}
  #reaction .sub{font-size:clamp(14px,3vw,20px);opacity:.9}
  #reaction .sub.ok{color:#00E472}
  #reaction .sub.bad{color:#FF4E20}
  #reaction .pts{font-size:clamp(18px,4vw,28px);font-weight:800;margin-top:8px;color:#ffcf5a}
  #reaction .ring{position:absolute;inset:0;border:4px solid rgba(255,255,255,.15);border-radius:50%;animation:ring 1.2s ease-out infinite}
  #reaction .ring.ok{border-color:#00E472;box-shadow:0 0 40px rgba(0,228,114,.35)}
  #reaction .ring.bad{border-color:#FF4E20;box-shadow:0 0 40px rgba(255,78,32,.35)}
  @keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
  @media (max-width: 640px) {
    html { font-size: 14px !important; }
    body { font-size: 14px !important; overflow-x: hidden !important; }
    #scene { position: fixed !important; inset: 0 !important; z-index: 0 !important; width: 100vw !important; height: 100vh !important; pointer-events: none !important; }
    .panel { position: fixed !important; left: 50% !important; top: 50% !important; transform: translate(-50%, -50%) !important; width: min(96vw, 520px) !important; max-width: 96vw !important; padding: 16px !important; max-height: 92vh !important; overflow-y: auto !important; z-index: 10 !important; }
    h1 { font-size: 20px !important; } h2 { font-size: 16px !important; } p.sub { font-size: 13px !important; }
    button { min-height: 48px !important; padding: 12px 16px !important; font-size: 15px !important; width: 100% !important; }
    input { font-size: 16px !important; padding: 12px 14px !important; }
    #topbar { top: 10px !important; left: 8px !important; right: 8px !important; flex-direction: column !important; gap: 8px !important; z-index: 11 !important; }
    #topbar > * { width: 100% !important; text-align: center !important; }
    .chip { font-size: 12px !important; padding: 6px 10px !important; }
    #game { width: min(96vw, 560px) !important; bottom: 10px !important; left: 50% !important; transform: translateX(-50%) !important; }
    #end { width: min(96vw, 500px) !important; padding: 18px 14px !important; }
    table.rank td { padding: 8px 6px !important; font-size: 14px !important; }
    #answers { grid-template-columns: 1fr !important; gap: 8px !important; }
    #answers button { min-height: 44px !important; font-size: 15px !important; }
    #toast { font-size: 13px !important; padding: 10px 14px !important; max-width: 94vw !important; }
    #help { font-size: 13px !important; padding: 6px 12px !important; max-width: 92vw !important; }
  }

  /* ===== Design CREATOR v2 (surcouche) ===== */
  #intro{position:fixed;inset:0;z-index:100;background:#050B26;transition:opacity .6s;cursor:pointer}#intro.fade{opacity:0}
  #intro::after{content:'Toucher pour passer';position:absolute;bottom:calc(18px + var(--safe-b));left:0;right:0;text-align:center;font-size:12px;color:#fff;opacity:.55}
  body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:transparent}
  .panel{border-radius:22px;border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 80px rgba(3,8,35,.55)}
  .panel::after{content:"";position:absolute;left:22px;right:22px;top:0;height:4px;border-radius:0 0 6px 6px;
    background:transparent}
  h1{font-weight:800;letter-spacing:-.5px}
  #home h1::after{content:"";display:block;width:64px;height:5px;border-radius:3px;background:var(--green);margin-top:8px}
  h2{font-weight:800}
  button,input{font-family:inherit}
  button{border-radius:999px;box-shadow:0 8px 20px rgba(255,78,32,.32)}
  button.sec{box-shadow:0 8px 20px rgba(11,53,254,.42)}
  button.ghost,button:disabled{box-shadow:none}
  input{border-radius:16px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.1)}
  #answers button{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:18px;
    text-align:left;font-weight:600;line-height:1.3;padding:14px 18px;box-shadow:none}
  #answers button:hover:not(:disabled){border-color:var(--green);background:rgba(0,228,114,.14)}
  #answers button.picked{background:var(--blue);border-color:var(--blue);outline:none}
  #answers button.good{background:var(--green);border-color:var(--green);color:var(--navy)}
  #answers button.bad{background:rgba(255,78,32,.25);border-color:var(--coral);color:#fff}
  .chip{border:1px solid rgba(255,255,255,.14)}
  ul.pl li button.kick{width:22px!important;min-height:22px!important;height:22px;padding:0!important;font-size:14px!important;line-height:1;border-radius:50%;box-shadow:none;background:rgba(255,78,32,.8)}
  table.rank tr.win td{background:rgba(0,228,114,.18);color:var(--green)}
</style>

<body>
<div id="intro"></div>
<canvas id="scene"></canvas>

<div id="topbar" class="hidden">
  <div class="chip"><span class="dot"></span><span id="count">0</span> joueur(s) · <span id="roomchip"></span></div>
  <button id="leave" class="ghost" id="leaveBtn">Quitter la salle</button>
</div>
<div id="home" class="panel">
  <h1>CREATOR</h1>
  <p class="sub">Quiz multijoueur en temps réel · Epitech Bénin</p>
  <input id="pseudo" maxlength="16" placeholder="Ton pseudo" autocomplete="off" />
  <button id="btnCreate">Créer une salle</button>
  <div class="sep">— ou —</div>
  <div class="row">
    <input id="codeIn" class="code" maxlength="5" placeholder="CODE" autocomplete="off" style="margin:0" />
    <button id="btnJoin" class="sec" style="flex:.8">Rejoindre</button>

<div id="introBubble" class="panel" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:6;background:var(--glass);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px 20px;backdrop-filter:blur(14px);display:none;">
  <button id="btnIntroBubble" class="sec" style="width:100%;font-size:16px;">Afficher l'intro bubble</button>
</div>

<div id="lobby" class="panel hidden">
  <h2 id="lobbyTitle">Salle</h2>
  <div class="codebox"><div class="c" id="lobbyCode">-----</div><button id="btnCopy" class="sec">Copier le code</button></div>
  <div id="qrCode" class="hidden" style="margin-top:12px;text-align:center;">
    <img id="qrImg" src="" alt="QR Code salle" style="width:180px;height:180px;background:#fff;border-radius:8px;padding:6px;display:block;margin:0 auto;">
    <div class="sub" style="margin-top:8px;font-size:13px;">Scannez pour rejoindre</div>
  </div>

  <button id="btnStart" class="hidden">Lancer la partie</button>

</div>
<div id="game" class="panel hidden">

  <div id="hostctl" class="hidden">
    <div class="who" id="who"></div>

</div>

  <h2>🏆 Classement final</h2>

  <button id="btnHome" class="sec">Retour à l'accueil</button>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
"use strict";
/* ================= CONFIGURATION & CHARTE ================= */
const BROKER = "wss://broker.emqx.io:8084/mqtt";
const TOPIC = (code, t) => `creatorquiz3d/${code}/${t}`;
const PALETTE = ["#0B35FE", "#FF4E20", "#00E472", "#FF7A00", "#2E85FF", "#0C1A4B", "#F4F6FC"];
const OPTIONS = ["Oui", "Non"];
const POINTS = 10;
const MAX_PLAYERS = 20;
const GAME_Q = 10; // nombre de questions par partie (tirées au hasard dans la banque)
const curQ = (s) => QUESTIONS[s.qOrder ? s.qOrder[s.qIndex] : s.qIndex]; // question réellement posée (ordre mélangé)
const totalQ = (s) => (s && s.qOrder ? s.qOrder.length : Math.min(GAME_Q, QUESTIONS.length));

/* Sauvegarde/restauration de l'état hôte (reprise après refresh) */
function saveHostState() {
  if (isHost && state) {
    try { localStorage.setItem("cq_host_state", JSON.stringify(state)); } catch {}
  }
}
function loadHostState() {
  try {
    const raw = localStorage.getItem("cq_host_state");
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.code) return parsed;
    }
  } catch {}
  return null;
}
function clearHostState() {
  try { localStorage.removeItem("cq_host_state"); } catch {}
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sanitizeName = (s) => String(s || "").replace(/[\u0000-\u001f<>]/g, "").trim().slice(0, 16);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
function makeCode() {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = ""; for (let i = 0; i < 5; i++) c += A[Math.floor(Math.random() * A.length)];
  return c;
}
let toastT;
function toast(msg, ms = 2600) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms);
}
const show = (id, on = true) => $(id).classList.toggle("hidden", !on);

/* ================= SCÈNE 3D ================= */
const canvas = $("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Mode éco : limité à 1.5 pour préserver la batterie
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
const camPos = new THREE.Vector3(0, 7, 14), camLook = new THREE.Vector3(0, 1, 0);
const camTarget = { pos: camPos.clone(), look: camLook.clone() };

const hemi = new THREE.HemisphereLight(0xdfeaff, 0x3a3f60, 0.6); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffe2b8, 1.5);
key.position.set(6, 14, 8); key.castShadow = true; key.shadow.mapSize.set(512, 512); key.shadow.radius = 2; key.shadow.bias = -0.001;
Object.assign(key.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
scene.add(key);
const fill = new THREE.DirectionalLight(0x7fa6ff, 0.55); fill.position.set(-8, 6, 4); scene.add(fill);
const rim = new THREE.DirectionalLight(0xff8fc0, 0.7); rim.position.set(0, 7, -10); scene.add(rim);

function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
}
const shadowTex = canvasTex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  gr.addColorStop(0, "rgba(0,0,0,.55)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });

const common = new THREE.Group(); scene.add(common);
const standMat = new THREE.MeshStandardMaterial({ color: 0x1b2a66, roughness: 0.8 });
const crowdSpots = [];
for (let row = 0; row < 4; row++) {
  const r = 13 + row * 1.4, y = row * 0.7;
  const step = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.7, r + 0.7, 0.7, 64, 1, true, Math.PI * 0.62, Math.PI * 1.76), standMat);
  step.position.y = y; step.visible = false;
  common.add(step);
  const n = 18 + row * 3;
  for (let i = 0; i < n; i++) {
    const a = Math.PI * 0.14 + (Math.PI * 0.72) * (i + 0.5) / n;
    crowdSpots.push({ x: Math.cos(a) * r, z: -Math.sin(a) * r, y: y + 1.45, a });
  }
}

function buildFigureGeometry(d = 1) {
  const R = (x) => Math.max(6, Math.round(x * d));
  const parts = [], UPV = new THREE.Vector3(0, 1, 0);
  const add = (geo, pos, scale, quat) => {
    const m = new THREE.Matrix4().compose(pos || new THREE.Vector3(), quat || new THREE.Quaternion(), scale || new THREE.Vector3(1, 1, 1));
    const g = (geo.index ? geo.toNonIndexed() : geo.clone()); g.applyMatrix4(m); parts.push(g);
  };
  const limb = (a, b, ra, rb) => {
    const dir = new THREE.Vector3().subVectors(b, a), len = dir.length();
    const q = new THREE.Quaternion().setFromUnitVectors(UPV, dir.clone().normalize());
    add(new THREE.CylinderGeometry(rb, ra, len, R(20), 1, true), a.clone().add(b).multiplyScalar(0.5), null, q);
    add(new THREE.SphereGeometry(ra, R(18), R(12)), a); add(new THREE.SphereGeometry(rb, R(18), R(12)), b);
  };
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  [-1, 1].forEach((sd) => add(new THREE.SphereGeometry(0.18, R(22), R(14)), V(sd * 0.17, 0.09, 0.08), V(1, 0.6, 1.7)));
  [-1, 1].forEach((sd) => limb(V(sd * 0.12, 1.22, 0), V(sd * 0.17, 0.15, 0.0), 0.125, 0.1));
  const prof = [[0, 1.08], [0.2, 1.1], [0.255, 1.2], [0.25, 1.45], [0.265, 1.7], [0.25, 1.86], [0.18, 1.96], [0.11, 2.0], [0.1, 2.1], [0, 2.14]]
    .map(([x, y]) => new THREE.Vector2(x, y));
  add(new THREE.LatheGeometry(prof, R(36)), null, V(1, 1, 0.82));
  [-1, 1].forEach((sd) => limb(V(sd * 0.24, 1.84, 0), V(sd * 0.3, 1.56, 0.17), 0.08, 0.075));
  limb(V(0.3, 1.56, 0.17), V(-0.17, 1.7, 0.28), 0.075, 0.07);
  limb(V(-0.3, 1.56, 0.17), V(0.18, 1.66, 0.33), 0.075, 0.07);

      if (!p) {

  } else if (ev.type === "kick" && p && !p.host && ev.from === state.hostId && ev.target) {

  state.players.forEach((p) => {
    p.gain = 0;

  else if (wasIn) { wasIn = false; toast("Tu as été retiré de la salle."); leaveRoom(false); return; }
  const fresh = !state;
  state = s; lastStateAt = Date.now(); hostLostShown = false;

  if ($("topbar").classList.contains("hidden")) enterRoom();
  render();

}

  const O = letters[5];
  const bar = new T.Mesh(new T.PlaneGeometry(10.4, .14), new T.MeshBasicMaterial({ color: col('#00E472') }));
  bar.rotation.x = -Math.PI / 2; bar.position.set(0, .012, 1.1); bar.scale.x = 0.001; scene.add(bar);

  const hero = makeCharacter('#0B35FE'); hero.group.scale.setScalar(.8); scene.add(hero.group);
  const lamp = new T.PointLight(0xbcd0ff, 1.6, 9, 1.6); lamp.position.set(0, 2.3, 1); hero.group.add(lamp); // la "lampe" du perso

  const HOP = .55, DIST = 1.73, X0 = -9, JUMP_T = 6 * HOP, LAND_T = JUMP_T + .7, XJ = X0 + 6 * DIST, TOP = 1.62;
  let t = 0, last = performance.now(), done = false, raf = 0;

  const frame = (now) => {
    const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt; let s = t - LAND_T;
    let x, y = 0, sq = 1, ry = Math.PI / 2;
    if (t < JUMP_T) {                                  // petits sauts
      const i = Math.floor(t / HOP), u = (t - i * HOP) / HOP;
      x = X0 + (i + u) * DIST; y = 4 * .8 * u * (1 - u); sq = (u < .12 || u > .88) ? .86 : 1;
    } else if (t < LAND_T) {                           // grand saut sur le "O"
      const u = (t - JUMP_T) / .7; x = lerp(XJ, 3, u); y = TOP * u * 1 + 4 * 1.1 * u * (1 - u);
    } else {                                           // atterrissage : le "O" s'écrase puis rebondit
      const sy = s < .12 ? 1 - .55 * (s / .12) : 1 - .55 * Math.exp(-(s - .12) * 5) * Math.cos((s - .12) * 16);
      O.scale.set(1 + (1 - sy) * .45, sy, 1 + (1 - sy) * .45);
      x = 3; y = 1.5 * sy + .12; ry = lerp(Math.PI / 2, 0, ease(clamp((s - .3) / .6)));
      if (s > 1.6) y += Math.abs(Math.sin((s - 1.6) * 7)) * .35 * clamp(2.6 - s);
    }
    hero.group.position.set(x, y, 0); hero.group.rotation.y = ry; hero.rig.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
    const L = ease(clamp((s - .3) / 1.2));             // la lumière s'allume
    hemi.intensity = lerp(.05, .95, L); key.intensity = lerp(0, 1.05, L); lamp.intensity = lerp(1.6, 0, L);
    scene.background.copy(dark).lerp(light, L);
    bar.scale.x = Math.max(.001, ease(clamp((s - .8) / .9)));
    renderer.render(scene, camera);
    if (s > 2.7) return finish();
    raf = requestAnimationFrame(frame);
  };
  function finish() {
    if (done) return; done = true; cancelAnimationFrame(raf);
    root.classList.add('fade');
    setTimeout(() => { renderer.dispose(); root.remove(); onDone(); }, 600);
  }
  root.addEventListener('pointerdown', finish);
  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); fit(); });
  raf = requestAnimationFrame(frame);
}

window.playCreatorIntro = playIntro;
})();
(function(){
  var root=document.getElementById("intro");
  if(!window.THREE||/[?&]nointro/.test(location.search)){root.remove();return;}
  var kill=function(){root.classList.add("fade");setTimeout(function(){root.remove();},600);};
  var go=function(){try{window.playCreatorIntro(root,function(){});}catch(e){console.warn("intro",e);kill();}};
  setTimeout(function(){if(root.isConnected)kill();},16000); /* sécurité : l'intro ne bloque jamais le jeu */
  (document.fonts&&document.fonts.load?document.fonts.load("800 100px Poppins"):Promise.resolve()).catch(function(){}).then(go);
})();
</script>
