function getLobbyPos(i) {
  if (i === 0) return { x: 0, z: 0, rot: 0 };
  const angle = i * 2.39996323;
  const radius = 1.2 + Math.sqrt(i) * 1.1;
  return {
    x: Math.sin(angle) * radius,
    z: Math.cos(angle) * radius,
    rot: Math.atan2(-Math.sin(angle), -Math.cos(angle))
  };
}

function getTablePos(i) {
  if (i < 6) {
    const angle = i * Math.PI / 3;
    return { x: Math.sin(angle) * 5.5, z: Math.cos(angle) * 5.5, rot: -angle + Math.PI };
  }
  let idx = i - 6;
  let ring = 1;
  let spots = 10;
  while (idx >= spots) {
    idx -= spots;
    ring++;
    spots += 6;
  }
  const radius = 5.5 + ring * 2.2;
  const angleOffset = ring * 0.2;
  const angle = (idx / spots) * Math.PI * 2 + angleOffset;
  return { x: Math.sin(angle) * radius, z: Math.cos(angle) * radius, rot: -angle + Math.PI };
}

const CREATOR_PALETTE = [
  0x0B35FE,
  0x00E472,
  0xFF4E20,
  0xFF7A00,
  0x2E85FF,
  0x00B85C,
  0x7A5CFF,
  0xFF9A4D
];

function getDynamicColor(index) {
  return CREATOR_PALETTE[index % CREATOR_PALETTE.length];
}

function cap(r, h, seg = 24) {
  const p = [], n = 12;
  for (let i = 0; i <= n; i++) { const a = i / n * Math.PI / 2; p.push(new THREE.Vector2(Math.sin(a) * r, -Math.cos(a) * r)); }
  for (let i = 0; i <= n; i++) { const a = i / n * Math.PI / 2; p.push(new THREE.Vector2(Math.cos(a) * r, h + Math.sin(a) * r)); }
  return new THREE.LatheGeometry(p, seg);
}

let playerId = Math.random().toString(36).slice(2, 11);
let playerName = 'Joueur-' + playerId.slice(0, 4);
let roomId = null;

scene.background = new THREE.Color(0x080a18);
scene.fog = new THREE.Fog(0x080a18, 26, 60);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
ren.setSize(innerWidth, innerHeight);
ren.shadowMap.enabled = true;
ren.shadowMap.type = THREE.PCFSoftShadowMap;
ren.outputEncoding = THREE.sRGBEncoding;

ren.toneMappingExposure = 1.12;

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}

const woodTex = canvasTex(512, 512, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, w, 0);
  g.addColorStop(0, '#8a5c34'); g.addColorStop(0.5, '#a5713f'); g.addColorStop(1, '#7e5230');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 110; i++) {
    const y0 = Math.random() * h;
    x.strokeStyle = `rgba(58,34,16,${0.04 + Math.random() * 0.1})`;
    x.lineWidth = 0.6 + Math.random() * 2.4;
    x.beginPath(); x.moveTo(0, y0);
    for (let px = 0; px <= w; px += 28) x.lineTo(px, y0 + Math.sin(px * 0.02 + i * 1.7) * (1.5 + Math.random() * 4));
    x.stroke();
  }
});
woodTex.repeat.set(2, 2);

const feltTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#233a86'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) {
    x.fillStyle = `rgba(${150 + Math.random() * 60 | 0},${165 + Math.random() * 60 | 0},${220},${0.04 + Math.random() * 0.07})`;
    x.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5);
  }
});
feltTex.repeat.set(6, 6);

const floorTex = canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = '#20242e'; x.fillRect(0, 0, w, h);
  const tile = 256;
  for (let ty = 0; ty < 2; ty++) {
    for (let tx = 0; tx < 2; tx++) {
      const ox = tx * tile, oy = ty * tile;
      x.fillStyle = (tx + ty) % 2 ? '#262b36' : '#1d2129';
      x.fillRect(ox + 4, oy + 4, tile - 8, tile - 8);
    }
  }
});
floorTex.repeat.set(10, 8);

const leatherTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#4a2418'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 1400; i++) {
    x.fillStyle = `rgba(255,190,140,${Math.random() * 0.05})`;
    x.beginPath(); x.arc(Math.random() * w, Math.random() * h, 1 + Math.random() * 2.5, 0, 7); x.fill();
  }
});

const glowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 8, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,200,110,.55)');
  g.addColorStop(0.5, 'rgba(120,140,255,.18)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();

const metalChrome = new THREE.MeshPhysicalMaterial({ color: 0x9aa4b2, roughness: 0.22, metalness: 1 });

const leather = new THREE.MeshPhysicalMaterial({ map: leatherTex, roughness: 0.62, metalness: 0.02, clearcoat: 0.18 });

const wallMat2 = new THREE.MeshStandardMaterial({ color: 0x101528, roughness: 0.92 });

const hemi = new THREE.HemisphereLight(0x8a7ff0, 0x1a1430, 0.55);

const key = new THREE.SpotLight(0xffefe0, 1.7, 50, 0.6, 0.55, 1);

  bulb.position.set(tx, 7.32, -0.92);

const crowdColors = [0x3a4356, 0x565f6e, 0x6e4638, 0x753d3d, 0x2e4260, 0x4d4d5e, 0x6b5a41, 0x37414f];
function makeCrowdChar(color, s) {
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.9 });
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.26 * s, 0.3 * s, 0.55 * s, 12), m);
  b.position.y = 0.275 * s;
  g.add(b);
  const skin = new THREE.MeshStandardMaterial({ color: [0xf2c9a0, 0xd9a273, 0x8d5a3b, 0xf7e0c8, 0xc68e63][Math.random() * 5 | 0], roughness: 0.6 });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22 * s, 14, 12), skin);
  head.position.y = 0.65 * s;
  g.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.235 * s, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2.2), new THREE.MeshStandardMaterial({ color: [0x1d1712, 0x3a2a1a, 0x5c4326, 0x2a2a2e][Math.random() * 4 | 0], roughness: 0.85 }));
  hair.position.y = 0.67 * s;
  g.add(hair);
  return g;
}

function makeLabel(text, isMe) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  x.font = 'bold 30px Arial';
  x.textAlign = 'center';
  x.strokeStyle = 'rgba(0,0,0,0.65)';
  x.lineWidth = 5;
  x.strokeText(text, 128, 40);
  x.fillStyle = isMe ? '#ffcf5a' : '#f2f4fa';
  x.fillText(text, 128, 40);

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBoard() {
  const qi = (state && state.questionIndex) || 0;
  const q  = QUESTIONS[qi] || { q: 'Bienvenue !', ans: 0 };
  const closed  = !!(state && state.roundClosed);
  const answers = (state && state.answers) || {};
  const yes = Object.values(answers).filter(a => a === 0).length;
  const no  = Object.values(answers).filter(a => a === 1).length;
  const total = state && state.players ? state.players.length : 0;
  const answeredCount = yes + no;

  const bg = bx.createLinearGradient(0, 0, 0, 512);
  bg.addColorStop(0, '#101a3c'); bg.addColorStop(1, '#0a0f24');
  bx.fillStyle = bg; bx.fillRect(0, 0, 1024, 512);
  bx.strokeStyle = '#c99b3f'; bx.lineWidth = 6;
  rr(bx, 8, 8, 1008, 496, 18); bx.stroke();

  bx.fillStyle = '#c99b3f';
  rr(bx, 60, 22, 904, 66, 12); bx.fill();
  bx.fillStyle = '#171204';
  bx.font = 'bold 32px Arial'; bx.textAlign = 'center';
  bx.fillText('Question ' + (qi + 1) + ' / ' + QUESTIONS.length, 512, 66);

  bx.fillStyle = '#ffffff';
  bx.font = 'bold 34px Arial';
  bx.fillText(q.q, 512, 165);

  bx.font = 'bold 88px Arial';
  bx.fillStyle = '#54d98c'; bx.fillText('Oui ' + yes, 300, 330);
  bx.fillStyle = '#ff6b6b'; bx.fillText('Non ' + no, 724, 330);

  bx.font = 'bold 22px Arial'; bx.fillStyle = '#9fb0ff';
  bx.fillText(answeredCount + ' / ' + total + ' ont répondu', 512, 400);

  if (closed) {
    bx.font = 'bold 30px Arial'; bx.fillStyle = '#ffb300';
    bx.fillText('Bonne réponse : ' + OPTIONS[q.ans], 512, 465);
  }
  bt.needsUpdate = true;
}

const playerObjs = {};

function syncPlayerObjects(list) {
  const ids = new Set(list.map((p) => p.id));
  Object.keys(playerObjs).forEach((id) => {
    if (!ids.has(id)) {
      const g = playerObjs[id].group;
      if (g.parent) g.parent.remove(g);
      delete playerObjs[id];
    }
  });
  list.forEach((p) => {
    let o = playerObjs[p.id];
    const isMe = p.id === playerId;
    if (!o) {
      const dynamicColor = getDynamicColor(p.colorIndex);
      const g = makeChar(dynamicColor, p.name, isMe);
      scene.add(g);
      o = playerObjs[p.id] = { group: g, name: p.name };
    }
    if (o.name !== p.name) {
      o.name = p.name;
      const old = o.group.getObjectByName('nameLabel');
      if (old) o.group.remove(old);
      o.group.add(makeLabel(p.name, isMe));
    }
  });
  layoutPlayers(list);
}

function layoutPlayers(list) {
  list.forEach((p, i) => {
    const o = playerObjs[p.id];
    if (!o) return;
    const g = o.group;
    if (mode === 'lobby') {
      if (g.parent !== scene) scene.add(g);
      const pos = getLobbyPos(i);
      g.position.set(pos.x, 0, pos.z);
      g.userData.baseRot = pos.rot;
      g.visible = true;
    } else {
      if (g.parent !== tg) tg.add(g);
      const pos = getTablePos(i);
      g.position.set(pos.x, 0, pos.z);
      g.userData.baseRot = pos.rot;
      g.visible = true;
    }
  });
}

function showQuestion() {
  const panel = $('quizPanel');
  const revealBtn = $('revealBtn');
  if (!state || !state.started) {
    panel.style.display = 'none';
    revealBtn.style.display = 'none';
    return;
  }
  const qi = state.questionIndex || 0;
  const q = QUESTIONS[qi];
  if (!q) {
    panel.style.display = 'none';
    revealBtn.style.display = 'none';
    $('qStatus').textContent = 'Partie terminée !';
    return;
  }
  const already = state.answers && state.answers[playerId] !== undefined;
  answered = already;
  myAnswer = already ? state.answers[playerId] : null;
  $('qTitle').textContent = 'Question ' + (qi + 1) + ' / ' + QUESTIONS.length;
  $('qText').textContent = q.q;
  $('qAnswers').innerHTML = '';
  OPTIONS.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.className = already && myAnswer === i ? 'selected' : '';
    btn.disabled = already || isHost || state.roundClosed;
    btn.onclick = () => answer(i);
    $('qAnswers').appendChild(btn);
  });
  if (state.roundClosed) {
    panel.style.display = 'block';
    const yes = Object.values(state.answers || {}).filter((a) => a === 0).length;
    const no = Object.values(state.answers || {}).filter((a) => a === 1).length;
    $('qStatus').textContent = 'Résultats : Oui ' + yes + ' / Non ' + no;
    $('qAnswers').innerHTML = '';
  } else {
    panel.style.display = 'block';
    if (isHost) {
      $('qStatus').textContent = "Tu es l'hôte - les joueurs répondent...";
    } else {
      $('qStatus').textContent = already ? 'Votre réponse est enregistrée.' : 'Choisissez votre réponse.';
    }
  }
  if (isHost && state.started) {
    revealBtn.style.display = 'block';
    revealBtn.textContent = state.roundClosed ? 'Question suivante ▶' : 'Révéler les résultats';
  } else {
    revealBtn.style.display = 'none';
  }
}

}

function sanitizeName(v) {
  const n = (v || '').trim().replace(/\s+/g, ' ').slice(0, 16);
  return n || 'Joueur';
}

function genRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 5; i++) s += chars[Math.random() * chars.length | 0];
  return s;
}

let client = null;
let connected = false;
let busy = false;
let joinTimer = null;
let heartbeatTimer = null;
let watchdogTimer = null;
let lastStateTs = 0;

function stateTopic() { return TOPIC_BASE + roomId + '/state'; }
function eventsTopic() { return TOPIC_BASE + roomId + '/events'; }

function publishState() {
  if (!client || !connected || !state) return;
  state.ts = Date.now();
  client.publish(stateTopic(), JSON.stringify(state), { qos: 0, retain: true });
}

function publishEvent(ev) {
  if (!client || !connected) return;
  client.publish(eventsTopic(), JSON.stringify(ev), { qos: 0 });
}

function mqttConnect(onReady) {
  if (typeof mqtt === 'undefined') {
    busy = false;
    setStatus('Impossible de charger la librairie réseau. Vérifie ta connexion.', true);
    return;
  }
  if (client) {
    if (connected) { onReady(); return; }
    try { client.end(true); } catch (e) {}
    client = null;
    connected = false;
  }
  setStatus('Connexion au serveur...');
  const myClient = mqtt.connect(MQTT_URL, {
    clientId: 'cq3d_' + Math.random().toString(16).slice(2, 12),
    connectTimeout: 12000,
    reconnectPeriod: 3000,
    clean: true,
    protocolVersion: 4
  });
  client = myClient;
  myClient.on('connect', () => {
    if (client !== myClient) return;
    connected = true;
    onReady();
  });
  myClient.on('close', () => { if (client === myClient) connected = false; });
  myClient.on('error', (e) => {
    if (client !== myClient) return;
    busy = false;
    setStatus('Erreur réseau : ' + (e && e.message ? e.message : 'connexion impossible'), true);
  });
  myClient.on('message', (topic, payload) => {
    if (client !== myClient) return;
    onMessage(topic, payload);
  });
}

function onMessage(topic, payload) {
  let msg;
  try { msg = JSON.parse(payload.toString()); } catch (e) { return; }
  if (!msg || !roomId) return;
  if (topic === stateTopic()) {
    if (!isHost) handleIncomingState(msg);
  } else if (topic === eventsTopic()) {
    if (isHost) {
      handleEvent(msg);
    } else if (msg.type === 'closed') {
      setStatus("L'hôte a fermé la salle.", true);
      leaveRoom();
    }
  }
}

function handleEvent(msg) {
  if (!state) return;
  if (msg.type === 'join') {
    const existing = state.players.find((p) => p.id === msg.id);
    if (existing) {
      existing.name = sanitizeName(msg.name);
    } else {
      state.players.push({ id: msg.id, name: sanitizeName(msg.name), colorIndex: state.players.length, score: 0 });
    }
    publishState();
    applyState(state);
  } else if (msg.type === 'leave') {
    state.players = state.players.filter((p) => p.id !== msg.id);
    state.players.forEach((p, i) => p.colorIndex = i);
    publishState();
    applyState(state);
  } else if (msg.type === 'ping') {
    publishState();
  } else if (msg.type === 'answer') {
    if (!state.roundClosed && (msg.qi || 0) === (state.questionIndex || 0)) {
      state.answers = state.answers || {};
      state.answers[msg.id] = msg.ans;
      const q = QUESTIONS[state.questionIndex || 0];
      if (q && msg.ans === q.ans) {
        const p = state.players.find((pl) => pl.id === msg.id);
        if (p) p.score = (p.score || 0) + 10;
      }
      publishState();
      applyState(state);
    }
  }
}

function handleIncomingState(msg) {
  if (!msg.players) return;
  if (msg.ts && Date.now() - msg.ts > 60000) {
    setStatus('Salle expirée ou hôte hors ligne.', true);
    return;
  }
  lastStateTs = Date.now();
  applyState(msg);
  if (joinTimer && msg.players.some((p) => p.id === playerId)) {
    clearInterval(joinTimer);
    joinTimer = null;
  }
  setStatus('Connecté — salle ' + roomId);
}

function enterRoomUI() {
  $('roomPanel').style.display = 'none';
  $('roomInfo').style.display = 'block';
  $('playersList').style.display = 'block';
  $('leaveBtn').style.display = 'block';
  $('roomCodeLabel').textContent = roomId;
}

function createRoom() {
  if (busy) return;
  playerName = sanitizeName($('nameInput').value);
  localStorage.setItem('cq3d_name', playerName);
  busy = true;
  setStatus('Création de la salle...');
  mqttConnect(() => {
    busy = false;
    isHost = true;
    roomId = genRoomCode();
    state = {
      hostId: playerId,
      hostName: playerName,
      players: [{ id: playerId, name: playerName, colorIndex: 0, score: 0 }],
      started: false,
      questionIndex: 0,
      answers: {},
      roundClosed: false,
      ts: Date.now()
    };
    client.subscribe(eventsTopic(), { qos: 0 }, () => {
      publishState();
      startHeartbeat();
      startWatchdog();
    });
    enterRoomUI();
    setStatus('Salle créée. Partage le code ' + roomId + '.');
    applyState(state);
    history.replaceState(null, '', '?room=' + roomId);
  });
}

function joinRoom(code) {
  if (busy) return;
  const clean = (code || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (clean.length < 4) { setStatus('Entre un code de salle valide.', true); return; }
  playerName = sanitizeName($('nameInput').value);
  localStorage.setItem('cq3d_name', playerName);
  busy = true;
  setStatus('Connexion à la salle ' + clean + '...');
  mqttConnect(() => {
    busy = false;
    isHost = false;
    roomId = clean;
    client.subscribe([stateTopic(), eventsTopic()], { qos: 0 }, () => {
      sendJoin();
      joinTimer = setInterval(sendJoin, 2500);
      startWatchdog();
    });
    enterRoomUI();
    history.replaceState(null, '', '?room=' + roomId);
    setTimeout(() => {
      if (!state) {
        setStatus('Salle introuvable ou hôte hors ligne. Vérifie le code.', true);
        if (joinTimer) { clearInterval(joinTimer); joinTimer = null; }
      }
    }, 9000);
  });
}

function sendJoin() {
  publishEvent({ type: 'join', id: playerId, name: playerName });
}

function startGame() {
  if (!isHost || !state) return;
  state.started = true;
  state.questionIndex = 0;
  state.answers = {};
  state.roundClosed = false;
  state.players.forEach((p) => p.score = 0);
  publishState();
  applyState(state);
}

function reveal() {
  if (!isHost || !state || !state.started) return;
  if (state.roundClosed) {
    const qi = (state.questionIndex || 0) + 1;
    if (qi >= QUESTIONS.length) {
      state.started = false;
      state.questionIndex = 0;
      state.answers = {};
      state.roundClosed = false;
      publishState();
      applyState(state);
      setTimeout(() => showLeaderboard(), 800);
      return;
    }
    state.questionIndex = qi;
    state.answers = {};
    state.roundClosed = false;
    publishState();
    applyState(state);
  } else {
    state.roundClosed = true;
    publishState();
    applyState(state);
  }
}

function startHeartbeat() {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(() => { if (isHost) publishState(); }, 3000);
}

function startWatchdog() {
  if (watchdogTimer) clearInterval(watchdogTimer);
  watchdogTimer = setInterval(() => {
    if (!isHost && roomId && lastStateTs && Date.now() - lastStateTs > 12000) {
      setStatus('Hôte déconnecté.', true);
    }
  }, 4000);
}

function leaveRoom() {
  const oldClient = client;
  const oldRoom = roomId;
  const oldHost = isHost;
  const wasConnected = connected;
  if (joinTimer) { clearInterval(joinTimer); joinTimer = null; }
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
  if (watchdogTimer) { clearInterval(watchdogTimer); watchdogTimer = null; }
  client = null;
  connected = false;
  if (oldClient && wasConnected && oldRoom) {
    let ended = false;
    const finish = () => {
      if (ended) return;
      ended = true;
      try { oldClient.end(true); } catch (e) {}
    };
    if (oldHost) {
      oldClient.publish(TOPIC_BASE + oldRoom + '/state', '', { qos: 1, retain: true }, finish);
      oldClient.publish(TOPIC_BASE + oldRoom + '/events', JSON.stringify({ type: 'closed' }), { qos: 0 });
    } else {
      oldClient.publish(TOPIC_BASE + oldRoom + '/events', JSON.stringify({ type: 'leave', id: playerId }), { qos: 1 }, finish);
    }
    setTimeout(finish, 1500);
  }
  isHost = false;
  roomId = null;
  state = null;
  Object.keys(playerObjs).forEach((id) => {
    const g = playerObjs[id].group;
    if (g.parent) g.parent.remove(g);
    delete playerObjs[id];
  });
  $('roomPanel').style.display = 'block';
  $('roomInfo').style.display = 'none';
  $('playersList').style.display = 'none';
  $('leaveBtn').style.display = 'none';
  $('startBtn').style.display = 'none';
  $('quizPanel').style.display = 'none';
  $('leaderboard').style.display = 'none';
  myAnswer = null;
  answered = false;
  $('playersItems').innerHTML = '';
  $('c').textContent = '0 joueur';
  setStatus('');
  drawBoard();
  setMode('lobby');
  history.replaceState(null, '', location.pathname);
}

$('createBtn').onclick = createRoom;
$('joinBtn').onclick = () => joinRoom($('roomInput').value);
$('roomInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom($('roomInput').value); });
$('nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') createRoom(); });
$('startBtn').onclick = startGame;
$('leaveBtn').onclick = leaveRoom;
$('revealBtn').onclick = reveal;
$('lbClose').onclick = hideLeaderboard;

$('copyBtn').onclick = () => {
  if (!roomId) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(roomId).then(() => setStatus('Code copié : ' + roomId)).catch(() => setStatus('Code : ' + roomId));
  } else {
    setStatus('Code : ' + roomId);
  }
};

let mx = 0;
addEventListener('pointermove', (e) => {
  mx = (e.clientX / innerWidth - 0.5) * 2;
});
addEventListener('pointerdown', (e) => {
  if (e.target.closest && e.target.closest('button,input,.panel,#playersList,#roomInfo,#leaderboard')) return;
  if (mode === 'table' && isHost && state && state.started) reveal();
});
addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  ren.setSize(innerWidth, innerHeight);
});
addEventListener('pagehide', () => {
  if (client && connected && roomId) {
    if (!isHost) publishEvent({ type: 'leave', id: playerId });
  }
});

const savedName = localStorage.getItem('cq3d_name');
if (savedName) $('nameInput').value = savedName;
const params = new URLSearchParams(location.search);
if (params.get('room')) $('roomInput').value = params.get('room').toUpperCase();

$('roomPanel').style.display = 'block';
setMode('lobby');

const clk = new THREE.Clock();
(function loop() {
  const t = clk.getElapsedTime();
  Object.values(playerObjs).forEach((o) => {
    const p = o.group;
    const u = p.userData;
    p.position.y = Math.abs(Math.sin(t * 1.5 + u.ph)) * 0.015;
    p.rotation.z = Math.sin(t * 0.55 + u.ph) * 0.015;
    p.rotation.y = (u.baseRot || 0) + Math.sin(t * 0.5 + u.ph) * 0.05;
  });
  cam.position.x += ((mx * 2.5) - cam.position.x) * 0.05;
  if (mode === 'lobby') cam.lookAt(0, 1.2, -2);
  else cam.lookAt(0, 2, -1);
  ren.render(scene, cam);
  requestAnimationFrame(loop);
})();
</script></body></html>
