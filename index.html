<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e15">
<title>NEON DOORS — Obby Quiz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2218%22 y=%2210%22 width=%2228%22 height=%2280%22 rx=%226%22 fill=%22%2300ffa3%22/><rect x=%2254%22 y=%2210%22 width=%2228%22 height=%2280%22 rx=%226%22 fill=%22%23ff3355%22/></svg>">
<style>
:root{
  --bg:#0d0e15;
  --bg-deep:#06070c;
  --panel:#10131f;
  --text:#eaf6ff;
  --muted:#7f8aa3;
  --green:#00ffa3;
  --green-soft:rgba(0,255,163,.55);
  --red:#ff3355;
  --red-soft:rgba(255,51,85,.55);
  --gold:#ffd166;
  --cyan:#38e8ff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI",Inter,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  overflow:hidden;
  background:
    radial-gradient(1100px 600px at 50% -15%,rgba(56,232,255,.12),transparent 60%),
    radial-gradient(900px 520px at 50% 115%,rgba(255,51,85,.10),transparent 62%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit}
[hidden]{display:none!important}

.scene{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100dvh;
  padding:clamp(14px,3vh,34px) clamp(14px,4vw,40px);
  isolation:isolate;
  perspective:1200px;
}

.stars,
.grid-floor,
.horizon,
.vignette,
.scanlines{position:fixed;inset:0;pointer-events:none}

.stars{
  z-index:0;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 18%,rgba(255,255,255,.75),transparent 60%),
    radial-gradient(1.2px 1.2px at 78% 12%,rgba(56,232,255,.8),transparent 60%),
    radial-gradient(1.6px 1.6px at 42% 8%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(1.1px 1.1px at 88% 34%,rgba(255,51,85,.7),transparent 60%),
    radial-gradient(1.3px 1.3px at 22% 40%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(1.1px 1.1px at 62% 30%,rgba(0,255,163,.6),transparent 60%);
  background-size:520px 420px;
  opacity:.8;
  animation:twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.45}to{opacity:.95}}

.grid-floor{
  z-index:1;
  top:auto;
  bottom:-14vh;
  left:-60vw;
  right:-60vw;
  height:78vh;
  background-image:
    linear-gradient(rgba(56,232,255,.22) 1px,transparent 1px),
    linear-gradient(90deg,rgba(56,232,255,.22) 1px,transparent 1px);
  background-size:64px 64px;
  transform:perspective(460px) rotateX(69deg);
  transform-origin:center bottom;
  -webkit-mask-image:linear-gradient(to top,#000 4%,rgba(0,0,0,.75) 38%,transparent 88%);
  mask-image:linear-gradient(to top,#000 4%,rgba(0,0,0,.75) 38%,transparent 88%);
  animation:gridMove 2.4s linear infinite;
  transition:filter .4s ease;
}
@keyframes gridMove{from{background-position:0 0,0 0}to{background-position:0 64px,0 0}}

.horizon{
  z-index:1;
  top:auto;
  bottom:22vh;
  height:2px;
  background:linear-gradient(90deg,transparent,rgba(56,232,255,.65),rgba(255,255,255,.9),rgba(255,51,85,.65),transparent);
  box-shadow:0 0 24px rgba(56,232,255,.65),0 0 70px rgba(56,232,255,.35);
  opacity:.6;
  transition:opacity .4s,box-shadow .4s;
}

.vignette{
  z-index:10;
  background:radial-gradient(ellipse at 50% 45%,transparent 38%,rgba(4,5,9,.55) 82%,rgba(3,4,7,.92) 100%);
  transition:background .35s ease;
}

.scanlines{
  z-index:11;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;
  opacity:.5;
}

.game{
  position:relative;
  z-index:5;
  width:min(1040px,100%);
  display:flex;
  flex-direction:column;
  align-items:center;
}

.hud{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  width:100%;
}
.hud-label{
  display:block;
  font:700 10px/1 var(--mono);
  letter-spacing:.42em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:10px;
}
.stage-num{
  display:block;
  font:900 clamp(2.6rem,8vw,4.8rem)/.85 var(--mono);
  letter-spacing:-.04em;
  color:#fff;
  text-shadow:0 0 14px rgba(56,232,255,.7),0 0 44px rgba(56,232,255,.35);
  transition:color .3s;
}
.stage-num.bump{animation:bump .38s var(--ease)}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}

.stats{display:flex;gap:10px}
.stat{
  min-width:96px;
  padding:9px 13px;
  border:1px solid rgba(56,232,255,.22);
  border-radius:12px;
  background:linear-gradient(180deg,rgba(15,19,32,.85),rgba(8,10,17,.85));
  box-shadow:inset 0 0 18px rgba(56,232,255,.05);
  text-align:right;
}
.stat span{
  display:block;
  font:700 9px/1 var(--mono);
  letter-spacing:.26em;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:7px;
}
.stat b{
  font:900 1.35rem/1 var(--mono);
  color:var(--cyan);
  text-shadow:0 0 12px rgba(56,232,255,.55);
}
.stat.best b{color:var(--gold);text-shadow:0 0 12px rgba(255,209,102,.55)}

.timer-row{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  margin-top:16px;
}
.timer-track{
  position:relative;
  flex:1;
  height:14px;
  border-radius:99px;
  border:1px solid rgba(255,51,85,.35);
  background:#070910;
  box-shadow:inset 0 0 14px #000,0 0 18px rgba(255,51,85,.12);
  overflow:hidden;
}
.timer-fill{
  width:100%;
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#ff9a5c,#ff3355);
  box-shadow:0 0 14px #ff3355,0 0 34px rgba(255,51,85,.7);
  transition:width .09s linear;
}
.timer-num{
  min-width:2.2ch;
  font:900 1.5rem/1 var(--mono);
  color:#ff8ba0;
  text-align:right;
  text-shadow:0 0 12px #ff3355;
  transition:color .2s;
}
.timer-row.danger .timer-fill{animation:timerPulse .5s ease-in-out infinite alternate}
.timer-row.danger .timer-num{color:#fff;animation:numBlink .5s steps(2,end) infinite}
@keyframes timerPulse{from{filter:brightness(1)}to{filter:brightness(1.55)}}
@keyframes numBlink{50%{opacity:.45}}

.stage-view{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  transform-origin:50% 100%;
  transition:transform .45s var(--ease),opacity .45s ease,filter .45s ease;
}
.stage-view.leaving{animation:roomDown .6s cubic-bezier(.55,0,.85,.35) forwards}
.stage-view.entering{animation:roomIn .6s var(--ease)}
.stage-view.fall{transform:translateY(34vh) rotateX(42deg) scale(.82);opacity:0;filter:blur(4px)}
@keyframes roomDown{
  0%{transform:none;opacity:1}
  100%{transform:translateY(78vh) rotateX(-34deg) scale(.86);opacity:0;filter:blur(3px)}
}
@keyframes roomIn{
  0%{transform:translateY(-64vh) rotateX(30deg) scale(.9);opacity:0;filter:blur(5px)}
  100%{transform:none;opacity:1;filter:blur(0)}
}

.question-area{
  text-align:center;
  margin:clamp(18px,4.4vh,46px) 0 clamp(14px,2.6vh,28px);
}
.category{
  display:inline-block;
  padding:6px 15px;
  border:1px solid rgba(56,232,255,.35);
  border-radius:99px;
  background:rgba(56,232,255,.06);
  box-shadow:0 0 22px rgba(56,232,255,.12);
  font:800 10px/1 var(--mono);
  letter-spacing:.4em;
  color:var(--cyan);
  text-transform:uppercase;
}
.question{
  max-width:23ch;
  margin:16px auto 0;
  font-size:clamp(1.35rem,3.4vw,2.5rem);
  font-weight:800;
  line-height:1.14;
  letter-spacing:-.01em;
  color:#fff;
  text-shadow:0 0 34px rgba(56,232,255,.18);
}
.question::first-letter{text-transform:uppercase}

.doors{
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:clamp(22px,6vw,84px);
  width:100%;
  perspective:1600px;
  perspective-origin:50% 40%;
}

.door{
  position:relative;
  width:clamp(122px,23vw,222px);
  height:clamp(200px,35vh,330px);
  padding:0;
  border:0;
  background:none;
  cursor:pointer;
  outline:none;
  transform-style:preserve-3d;
  transition:transform .2s var(--ease),opacity .3s ease,filter .3s ease;
  touch-action:manipulation;
}
.door-yes{--edge:var(--green);--glow:var(--green-soft);--glow2:rgba(0,255,163,.18)}
.door-no{--edge:var(--red);--glow:var(--red-soft);--glow2:rgba(255,51,85,.18)}

.door-light{
  position:absolute;
  inset:4% 8%;
  border-radius:50% 50% 18px 18px;
  background:radial-gradient(ellipse at 50% 62%,var(--edge),transparent 68%);
  opacity:0;
  filter:blur(22px);
  transform:translateZ(-10px) scale(.9);
  transition:opacity .45s ease,transform .6s ease;
}
.door.open .door-light{opacity:.95;transform:translateZ(-10px) scale(1.18);animation:lightFlicker .7s ease-in-out infinite alternate}
@keyframes lightFlicker{from{filter:blur(20px) brightness(.9)}to{filter:blur(26px) brightness(1.3)}}

.door-frame{
  position:absolute;
  inset:0;
  padding:9px;
  border-radius:18px 18px 7px 7px;
  border:2px solid var(--edge);
  background:linear-gradient(180deg,#1a2034,#080a12 68%);
  box-shadow:
    0 0 14px var(--glow),
    0 0 46px var(--glow2),
    inset 0 0 26px rgba(0,0,0,.92),
    inset 0 0 22px var(--glow2);
  transform-style:preserve-3d;
  transition:transform .22s var(--ease),box-shadow .22s ease,border-color .22s ease;
}

.door-frame::before{
  content:"";
  position:absolute;
  inset:4px;
  border-radius:14px 14px 4px 4px;
  border:1px solid rgba(255,255,255,.06);
  pointer-events:none;
}
.door-frame::after{
  content:"";
  position:absolute;
  top:0;
  left:10%;
  right:10%;
  height:2px;
  border-radius:2px;
  background:var(--edge);
  box-shadow:0 0 14px var(--edge),0 0 34px var(--glow);
  opacity:.9;
  pointer-events:none;
}

.door-panel{
  position:absolute;
  inset:9px;
  border-radius:11px 11px 3px 3px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.026) 0 1px,transparent 1px 23px),
    linear-gradient(158deg,#252d48 0%,#0c0f1b 58%,#171d31 100%);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:inset 0 0 46px rgba(0,0,0,.85),inset 0 0 24px var(--glow2);
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.19,1,.22,1),box-shadow .4s ease;
  overflow:hidden;
}
.door-no .door-panel{transform-origin:right center}

.door-panel::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 12%,rgba(255,255,255,.5) 0 1.5px,transparent 2px),
    radial-gradient(circle at 80% 12%,rgba(255,255,255,.5) 0 1.5px,transparent 2px),
    radial-gradient(circle at 20% 88%,rgba(255,255,255,.35) 0 1.5px,transparent 2px),
    radial-gradient(circle at 80% 88%,rgba(255,255,255,.35) 0 1.5px,transparent 2px);
  opacity:.65;
}
.door-panel::after{
  content:"";
  position:absolute;
  top:-40%;
  left:-70%;
  width:45%;
  height:190%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
  transform:rotate(18deg);
  animation:sheen 6s ease-in-out infinite;
}
@keyframes sheen{
  0%,72%{left:-70%}
  88%,100%{left:150%}
}

.door-label{
  position:absolute;
  top:19%;
  left:0;
  right:0;
  text-align:center;
  font:900 clamp(1.5rem,4.3vw,2.5rem)/1 var(--sans);
  letter-spacing:.14em;
  color:var(--edge);
  text-shadow:0 0 10px var(--edge),0 0 30px var(--glow);
  user-select:none;
}
.door-code{
  position:absolute;
  bottom:13px;
  left:0;
  right:0;
  text-align:center;
  font:700 9px/1 var(--mono);
  letter-spacing:.38em;
  color:rgba(255,255,255,.28);
  user-select:none;
}

.door-plate{
  position:absolute;
  top:50%;
  left:50%;
  width:46px;
  height:46px;
  border-radius:50%;
  border:1px solid rgba(255,209,102,.38);
  background:radial-gradient(circle at 50% 40%,rgba(255,209,102,.14),transparent 70%);
  box-shadow:0 0 20px rgba(255,209,102,.18),inset 0 0 12px rgba(0,0,0,.55);
  transform:translate(-50%,-50%);
  pointer-events:none;
}
.door-handle{
  position:absolute;
  top:50%;
  left:50%;
  width:15px;
  height:40px;
  border-radius:9px;
  background:linear-gradient(180deg,#fff4c2 0%,var(--gold) 42%,#a97400 100%);
  box-shadow:
    0 0 10px rgba(255,209,102,.9),
    0 0 26px rgba(255,209,102,.5),
    inset 0 0 5px #fff8d6;
  transform:translate(-50%,-50%);
  pointer-events:none;
}
.door-handle::after{
  content:"";
  position:absolute;
  inset:5px 4px;
  border-radius:6px;
  border:1px solid rgba(120,74,0,.45);
}

.door.dim{opacity:.22;filter:grayscale(.55) brightness(.7)}
.door.dim .door-frame{transform:none}
.door.wrong .door-frame{border-color:#fff;box-shadow:0 0 22px var(--red),0 0 70px var(--red-soft),inset 0 0 30px rgba(255,51,85,.35)}
.door.wrong{animation:doorWrong .35s ease-in-out 2}

.door.open{z-index:4}
.door.open .door-panel{transform:rotateY(-116deg)}
.door-no.open .door-panel{transform:rotateY(116deg)}
.door.open .door-frame{box-shadow:0 0 26px var(--edge),0 0 90px var(--glow),inset 0 0 20px var(--glow2)}

@keyframes doorWrong{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}
}

.door:focus-visible .door-frame{outline:2px solid #fff;outline-offset:4px}

@media (hover:hover){
  .door:hover:not(:disabled){transform:translateY(5px) scale(.995)}
  .door:hover:not(:disabled) .door-frame{
    border-color:#fff;
    box-shadow:0 0 24px var(--edge),0 0 80px var(--glow),inset 0 0 30px var(--glow2);
  }
  .door:hover:not(:disabled) .door-label{text-shadow:0 0 14px var(--edge),0 0 44px var(--edge),0 0 70px var(--glow)}
}
.door:active:not(:disabled){transform:translateY(9px) scale(.985)}

.hint{
  min-height:1.5em;
  margin:clamp(16px,3.2vh,32px) 0 0;
  font:700 11px/1.5 var(--mono);
  letter-spacing:.3em;
  text-align:center;
  text-transform:uppercase;
  color:var(--muted);
  transition:color .25s,text-shadow .25s;
}
.hint.ok{color:var(--green);text-shadow:0 0 16px rgba(0,255,163,.65)}
.hint.bad{color:var(--red);text-shadow:0 0 16px rgba(255,51,85,.65)}

.game.success .stage-num{color:var(--green);text-shadow:0 0 16px rgba(0,255,163,.8),0 0 50px rgba(0,255,163,.4)}
.game.success .horizon{opacity:1;box-shadow:0 0 26px var(--green),0 0 80px rgba(0,255,163,.45)}

.game.shake{animation:shake .46s ease-in-out}
@keyframes shake{
  0%,100%{transform:translate(0,0) rotate(0)}
  12%{transform:translate(-9px,3px) rotate(-.35deg)}
  28%{transform:translate(8px,-4px) rotate(.35deg)}
  44%{transform:translate(-7px,5px) rotate(-.3deg)}
  60%{transform:translate(6px,-3px) rotate(.25deg)}
  78%{transform:translate(-4px,2px) rotate(-.15deg)}
}

.scene.dead .grid-floor{filter:hue-rotate(-55deg) brightness(.85);animation:gridMove 2.4s linear infinite,deadGrid .5s ease-in-out}
@keyframes deadGrid{
  0%,100%{transform:perspective(460px) rotateX(69deg) translateX(0)}
  30%{transform:perspective(460px) rotateX(69deg) translateX(-16px)}
  65%{transform:perspective(460px) rotateX(69deg) translateX(14px)}
}
.scene.dead .horizon{opacity:1;background:linear-gradient(90deg,transparent,var(--red),#fff,var(--red),transparent);box-shadow:0 0 26px var(--red),0 0 90px var(--red-soft)}
.scene.dead .vignette{background:radial-gradient(ellipse at 50% 55%,transparent 20%,rgba(80,0,14,.45) 70%,rgba(45,0,8,.95) 100%)}

.flash{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  opacity:0;
}
.flash.green{background:radial-gradient(circle at 50% 55%,rgba(0,255,163,.7),rgba(0,255,163,.16) 42%,transparent 72%);animation:flashOut .85s ease-out}
.flash.red{background:radial-gradient(circle at 50% 55%,rgba(255,51,85,.82),rgba(255,51,85,.28) 45%,rgba(90,0,16,.35) 78%,transparent 100%);animation:flashOut .85s ease-out}
@keyframes flashOut{
  0%{opacity:0}
  10%{opacity:1}
  100%{opacity:0}
}

.overlay{
  position:fixed;
  inset:0;
  z-index:30;
  display:grid;
  place-items:center;
  padding:20px;
  background:rgba(4,5,9,.68);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  opacity:0;
  pointer-events:none;
  transition:opacity .32s ease;
}
.overlay.show{opacity:1;pointer-events:auto}
.overlay-card{
  width:min(460px,100%);
  padding:clamp(26px,5vw,42px);
  border-radius:22px;
  border:1px solid rgba(255,51,85,.55);
  background:linear-gradient(160deg,#1a0d15,#0a0b12 70%);
  box-shadow:0 0 0 1px rgba(255,255,255,.04),0 0 44px rgba(255,51,85,.32),inset 0 0 60px rgba(255,51,85,.08);
  text-align:center;
  transform:translateY(18px) scale(.97);
  transition:transform .35s var(--ease);
}
.overlay.show .overlay-card{transform:none}
.overlay-kicker{
  margin:0 0 10px;
  font:800 10px/1 var(--mono);
  letter-spacing:.44em;
  color:var(--red);
  text-transform:uppercase;
}
.overlay h2{
  position:relative;
  margin:0;
  font:900 clamp(2.3rem,10vw,4.2rem)/.95 var(--sans);
  letter-spacing:.02em;
  color:#fff;
  text-transform:uppercase;
  text-shadow:0 0 18px rgba(255,51,85,.85),0 0 60px rgba(255,51,85,.45);
  animation:glitch 3s steps(1,end) infinite;
}
@keyframes glitch{
  0%,92%,100%{transform:translate(0);text-shadow:0 0 18px rgba(255,51,85,.85),0 0 60px rgba(255,51,85,.45)}
  93%{transform:translate(-3px,1px);text-shadow:3px 0 var(--cyan),-3px 0 var(--red),0 0 30px var(--red)}
  95%{transform:translate(3px,-1px);text-shadow:-3px 0 var(--cyan),3px 0 var(--red),0 0 30px var(--red)}
  97%{transform:translate(-1px,0);text-shadow:2px 0 var(--red),-2px 0 var(--cyan)}
}
.overlay-reason{
  margin:16px 0 0;
  font:700 11px/1.7 var(--mono);
  letter-spacing:.2em;
  text-transform:uppercase;
  color:#ffb0bd;
}
.overlay-best{
  margin:20px 0 0;
  font:800 12px/1 var(--mono);
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
}
.overlay-best b{
  display:inline-block;
  margin-left:8px;
  color:var(--gold);
  font-size:1.4rem;
  text-shadow:0 0 14px rgba(255,209,102,.55);
}
.retry-btn{
  width:100%;
  margin-top:26px;
  padding:16px 20px;
  border:1px solid var(--red);
  border-radius:14px;
  background:linear-gradient(180deg,rgba(255,51,85,.24),rgba(255,51,85,.08));
  color:#fff;
  font:900 13px/1 var(--mono);
  letter-spacing:.3em;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 0 22px rgba(255,51,85,.28),inset 0 0 20px rgba(255,51,85,.12);
  transition:transform .15s var(--ease),box-shadow .2s,background .2s;
}
.retry-btn:hover{background:linear-gradient(180deg,rgba(255,51,85,.38),rgba(255,51,85,.14));box-shadow:0 0 34px rgba(255,51,85,.45),inset 0 0 24px rgba(255,51,85,.18)}
.retry-btn:active{transform:translateY(3px) scale(.99)}
.overlay-auto{
  margin:14px 0 0;
  font:700 9px/1 var(--mono);
  letter-spacing:.3em;
  color:rgba(255,255,255,.32);
  text-transform:uppercase;
}

@media (max-width:560px){
  .hud{align-items:center}
  .stat{min-width:76px;padding:8px 10px}
  .stat b{font-size:1.1rem}
  .stat span{font-size:8px;letter-spacing:.18em}
  .door{width:min(39vw,158px)}
  .hint{font-size:9px;letter-spacing:.24em}
}
@media (max-height:620px){
  .scene{padding-top:10px;padding-bottom:10px}
  .hud-label{margin-bottom:6px}
  .stage-num{font-size:clamp(2rem,6vw,3rem)}
  .timer-row{margin-top:8px}
  .question-area{margin:10px 0 8px}
  .question{margin-top:9px;font-size:clamp(1.05rem,2.8vw,1.7rem)}
  .door{height:clamp(150px,32vh,240px)}
  .hint{margin-top:10px}
  .category{padding:4px 11px;font-size:9px}
}
@media (prefers-reduced-motion:reduce){
  .stars,.grid-floor,.hint,.door-panel::after,.overlay h2{animation:none!important}
  .stage-view,.door,.door-frame,.door-panel{transition-duration:.001s!important}
}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="stars"></div>
  <div class="grid-floor"></div>
  <div class="horizon"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <main class="game" id="game">
    <header class="hud">
      <div>
        <span class="hud-label">Stage en cours</span>
        <span class="stage-num" id="stageNum">01</span>
      </div>
      <div class="stats">
        <div class="stat">
          <span>Score</span>
          <b id="score">00</b>
        </div>
        <div class="stat best">
          <span>Record</span>
          <b id="best">00</b>
        </div>
      </div>
    </header>

    <div class="timer-row" id="timerRow">
      <div class="timer-track">
        <div class="timer-fill" id="timerFill"></div>
      </div>
      <div class="timer-num" id="timerNum" aria-live="off">10</div>
    </div>

    <div class="stage-view" id="stageView">
      <div class="question-area">
        <span class="category" id="category">CULTURE</span>
        <h1 class="question" id="question" aria-live="polite"></h1>
      </div>

      <div class="doors" id="doors">
        <button class="door door-yes" id="doorYes" type="button" aria-label="Choisir la porte OUI">
          <span class="door-light"></span>
          <span class="door-frame">
            <span class="door-panel">
              <span class="door-label">OUI</span>
              <span class="door-plate"></span>
              <span class="door-handle"></span>
              <span class="door-code">PORTE A</span>
            </span>
          </span>
        </button>

        <button class="door door-no" id="doorNo" type="button" aria-label="Choisir la porte NON">
          <span class="door-light"></span>
          <span class="door-frame">
            <span class="door-panel">
              <span class="door-label">NON</span>
              <span class="door-plate"></span>
              <span class="door-handle"></span>
              <span class="door-code">PORTE B</span>
            </span>
          </span>
        </button>
      </div>

      <p class="hint" id="hint">Prédis la bonne porte avant la fin du chrono</p>
    </div>
  </main>

  <div class="flash" id="flash"></div>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overTitle">
    <div class="overlay-card">
      <p class="overlay-kicker">Piège activé</p>
      <h2 id="overTitle">Game Over</h2>
      <p class="overlay-reason" id="overlayReason">Mauvaise porte</p>
      <p class="overlay-best">Record<b id="overlayBest">00</b></p>
      <button class="retry-btn" id="retryBtn" type="button">Réessayer</button>
      <p class="overlay-auto">Retour au stage 01…</p>
    </div>
  </div>
</div>

<script>
(function () {
  var QUESTIONS = [
    { category: "Culture", question: "Le soleil se lève à l'Est.", answer: true },
    { category: "Tech", question: "HTML est un langage de programmation.", answer: false },
    { category: "Logique", question: "2 + 2 = 5.", answer: false },
    { category: "Tech", question: "Un octet contient 8 bits.", answer: true },
    { category: "Culture", question: "La Seine traverse Paris.", answer: true },
    { category: "Tech", question: "CSS sert à styliser une page web.", answer: true },
    { category: "Tech", question: "JavaScript et Java sont le même langage.", answer: false },
    { category: "Logique", question: "Un triangle possède quatre côtés.", answer: false },
    { category: "Culture", question: "La Lune est une étoile.", answer: false },
    { category: "Tech", question: "HTTP signifie HyperText Transfer Protocol.", answer: true },
    { category: "Logique", question: "10 est un nombre pair.", answer: true },
    { category: "Culture", question: "Un smartphone peut fonctionner sans batterie.", answer: false }
  ];

  var MAX_TIME = 10;
  var STORE_KEY = "neon-doors-best";

  var scene = document.getElementById("scene");
  var game = document.getElementById("game");
  var stageView = document.getElementById("stageView");
  var doorsEl = document.getElementById("doors");
  var doorYes = document.getElementById("doorYes");
  var doorNo = document.getElementById("doorNo");
  var categoryEl = document.getElementById("category");
  var questionEl = document.getElementById("question");
  var hintEl = document.getElementById("hint");
  var stageNumEl = document.getElementById("stageNum");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var timerRow = document.getElementById("timerRow");
  var timerFill = document.getElementById("timerFill");
  var timerNum = document.getElementById("timerNum");
  var flashEl = document.getElementById("flash");
  var overlay = document.getElementById("overlay");
  var overlayReason = document.getElementById("overlayReason");
  var overlayBest = document.getElementById("overlayBest");
  var retryBtn = document.getElementById("retryBtn");

  var deck = [];
  var stage = 0;
  var score = 0;
  var best = readBest();
  var locked = true;
  var active = false;
  var rafId = 0;
  var deathTimer = 0;
  var overlayTimer = 0;
  var autoTimer = 0;
  var flashTimer = 0;
  var enterTimer = 0;

  function readBest() {
    try {
      return parseInt(localStorage.getItem(STORE_KEY) || "0", 10) || 0;
    } catch (e) {
      return 0;
    }
  }

  function saveBest(value) {
    try {
      localStorage.setItem(STORE_KEY, String(value));
    } catch (e) {}
  }

  function pad(value) {
    return String(value).padStart(2, "0");
  }

  function shuffle(list) {
    var copy = list.slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = copy[i];
      copy[i] = copy[j];
      copy[j] = tmp;
    }
    return copy;
  }

  function currentQuestion() {
    return deck[stage % deck.length];
  }

  function updateHud() {
    stageNumEl.textContent = pad(stage + 1);
    scoreEl.textContent = pad(score);
    bestEl.textContent = pad(best);
  }

  function setTimer(remaining) {
    var ratio = Math.max(0, Math.min(1, remaining / MAX_TIME));
    timerFill.style.width = (ratio * 100).toFixed(2) + "%";
    timerNum.textContent = String(Math.ceil(remaining));
    timerRow.classList.toggle("danger", remaining <= 3.2 && remaining > 0);
  }

  function startTimer() {
    cancelAnimationFrame(rafId);
    timerRow.classList.remove("danger");
    setTimer(MAX_TIME);
    var startedAt = performance.now();

    function frame(now) {
      if (!active) return;
      var remaining = MAX_TIME - (now - startedAt) / 1000;
      if (remaining <= 0) {
        setTimer(0);
        handleTimeout();
        return;
      }
      setTimer(remaining);
      rafId = requestAnimationFrame(frame);
    }

    rafId = requestAnimationFrame(frame);
  }

  function showFlash(kind) {
    clearTimeout(flashTimer);
    flashEl.className = "flash";
    void flashEl.offsetWidth;
    flashEl.className = "flash " + kind;
    flashTimer = setTimeout(function () {
      flashEl.className = "flash";
    }, 900);
  }

  function resetDoors() {
    var doors = [doorYes, doorNo];
    doors.forEach(function (door) {
      door.disabled = false;
      door.classList.remove("open", "dim", "wrong");
    });
  }

  function renderStage(isFirst) {
    var q = currentQuestion();
    categoryEl.textContent = q.category;
    questionEl.textContent = q.question;
    hintEl.textContent = "Prédis la bonne porte avant la fin du chrono";
    hintEl.classList.remove("ok", "bad");

    resetDoors();
    updateHud();
    stageNumEl.classList.remove("bump");
    void stageNumEl.offsetWidth;
    stageNumEl.classList.add("bump");

    stageView.classList.remove("fall", "leaving");
    if (!isFirst) {
      clearTimeout(enterTimer);
      stageView.classList.remove("entering");
      void stageView.offsetWidth;
      stageView.classList.add("entering");
      enterTimer = setTimeout(function () {
        stageView.classList.remove("entering");
      }, 620);
    }

    locked = false;
    active = true;
    startTimer();
  }

  function choose(answer, button) {
    if (locked || !active) return;
    var q = currentQuestion();
    var isCorrect = answer === q.answer;

    locked = true;
    active = false;
    cancelAnimationFrame(rafId);

    [doorYes, doorNo].forEach(function (door) {
      door.disabled = true;
      if (door !== button) door.classList.add("dim");
    });

    if (isCorrect) {
      handleSuccess(button);
    } else {
      button.classList.add("wrong");
      handleFailure(button, "Mauvaise porte — la réponse était " + (q.answer ? "OUI" : "NON"));
    }
  }

  function handleSuccess(button) {
    button.classList.add("open");
    game.classList.add("success");
    showFlash("green");
    hintEl.textContent = "Porte franchie !";
    hintEl.classList.add("ok");

    score += 1;
    if (score > best) {
      best = score;
      saveBest(best);
    }
    updateHud();

    setTimeout(function () {
      stageView.classList.add("leaving");
    }, 880);

    setTimeout(function () {
      game.classList.remove("success");
      stage += 1;
      if (stage % deck.length === 0) deck = shuffle(QUESTIONS);
      renderStage(false);
    }, 1500);
  }

  function handleTimeout() {
    if (!active) return;
    active = false;
    locked = true;
    cancelAnimationFrame(rafId);
    setTimer(0);
    var q = currentQuestion();
    handleFailure(null, "Temps écoulé — la réponse était " + (q.answer ? "OUI" : "NON"));
  }

  function handleFailure(button, message) {
    active = false;
    locked = true;

    scene.classList.add("dead");
    game.classList.add("shake");
    showFlash("red");
    hintEl.textContent = message;
    hintEl.classList.add("bad");
    timerRow.classList.remove("danger");
    setTimer(0);

    if (button) button.classList.add("wrong");

    deathTimer = setTimeout(function () {
      stageView.classList.add("fall");
    }, 320);

    overlayTimer = setTimeout(function () {
      overlayReason.textContent = message;
      overlayBest.textContent = pad(best);
      overlay.classList.add("show");
    }, 680);

    autoTimer = setTimeout(function () {
      if (overlay.classList.contains("show")) startRun();
    }, 2600);
  }

  function startRun() {
    cancelAnimationFrame(rafId);
    clearTimeout(deathTimer);
    clearTimeout(overlayTimer);
    clearTimeout(autoTimer);
    clearTimeout(enterTimer);

    deck = shuffle(QUESTIONS);
    stage = 0;
    score = 0;
    locked = true;
    active = false;

    overlay.classList.remove("show");
    scene.classList.remove("dead");
    game.classList.remove("shake", "success");
    stageView.classList.remove("fall", "leaving", "entering");
    hintEl.classList.remove("ok", "bad");
    timerRow.classList.remove("danger");
    flashEl.className = "flash";

    renderStage(true);
  }

  doorYes.addEventListener("click", function () {
    choose(true, doorYes);
  });

  doorNo.addEventListener("click", function () {
    choose(false, doorNo);
  });

  retryBtn.addEventListener("click", startRun);

  document.addEventListener("keydown", function (event) {
    if (!active || locked) return;
    var key = event.key;
    if (key === "ArrowLeft" || key === "y" || key === "Y" || key === "o" || key === "O") {
      event.preventDefault();
      choose(true, doorYes);
    } else if (key === "ArrowRight" || key === "n" || key === "N") {
      event.preventDefault();
      choose(false, doorNo);
    }
  });

  startRun();
})();
</script>
</body>
</html>
