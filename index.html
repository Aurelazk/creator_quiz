<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Quiz 3D CREATOR — Epitech Bénin</title>
<meta name="description" content="Quiz 3D multijoueur en temps réel autour du développement web et mobile — CREATOR, Epitech Bénin." />
<meta name="theme-color" content="#0C1A4B" />
<style>
  /* ================= CHARTE CREATOR ================= */
  :root{
    --blue:#0B35FE; --navy:#0C1A4B; --green:#00E472; --coral:#FF4E20; --coral-h:#E63C10;
    --orange:#FF7A00; --light:#2E85FF; --bg:#F4F6FC; --white:#FFFFFF; --gold:#ffcf5a;
    --glass:rgba(12,26,75,.82); --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);color:var(--white);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #scene{position:fixed;inset:0;touch-action:manipulation}
  .panel{position:fixed;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.45);padding:18px;z-index:5}
  .hidden{display:none!important}
  h1{margin:0 0 4px;font-size:26px;letter-spacing:.5px} h1 b{color:var(--green)}
  h2{margin:0 0 10px;font-size:18px}
  p.sub{margin:0 0 14px;opacity:.75;font-size:14px}
  input{width:100%;padding:13px 14px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.1);
    color:var(--white);font-size:16px;outline:none;margin-bottom:10px}
  input:focus{border-color:var(--light)}
  input.code{text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:700}
  button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer;
    background:var(--coral);color:var(--white);transition:background .15s,transform .1s;width:100%}
  button:hover{background:var(--coral-h)} button:active{transform:scale(.97)}
  button.sec{background:var(--blue)} button.sec:hover{background:#0928c9}
  button.ghost{background:rgba(255,255,255,.1)} button.ghost:hover{background:rgba(255,255,255,.18)}
  button:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .sep{text-align:center;opacity:.5;font-size:13px;margin:12px 0}
  /* Accueil */
  #home{left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,380px)}
  /* Barre d'aide en haut */
  #help{position:fixed;top:calc(10px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:6;
    background:var(--glass);border-radius:999px;padding:8px 16px;font-size:14px;max-width:92vw;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #topbar{position:fixed;top:calc(70px + var(--safe-t));left:10px;right:10px;display:flex;justify-content:space-between;z-index:6;pointer-events:none}
  #topbar>*{pointer-events:auto}
  .chip{background:var(--glass);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
  .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}
  #leave{width:auto;padding:7px 12px;font-size:13px;border-radius:999px}
  /* Lobby */
  #lobby{left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);width:min(94vw,420px);max-height:48vh;overflow:auto}
  .codebox{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .codebox .c{flex:1;font-size:30px;font-weight:800;letter-spacing:6px;text-align:center;background:rgba(255,255,255,.08);
    border-radius:12px;padding:8px;color:var(--green)}
  .codebox button{width:auto}
  ul.pl{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  ul.pl li{background:rgba(255,255,255,.08);border-radius:999px;padding:5px 10px 5px 6px;font-size:13px;display:flex;align-items:center;gap:6px}
  ul.pl li i{width:14px;height:14px;border-radius:50%;display:inline-block}
  ul.pl li.me{outline:2px solid var(--gold)}
  .tag{background:var(--orange);border-radius:6px;padding:1px 6px;font-size:10px;text-transform:uppercase;font-weight:800}
  /* Jeu */
  #game{left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);width:min(94vw,520px)}
  #qnum{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--green);font-weight:800}
  #qtext{font-size:19px;font-weight:700;margin:6px 0 14px;line-height:1.3}
  #answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #answers button.picked{outline:3px solid var(--gold)}
  #answers button.good{background:var(--green);color:var(--navy)}
  #answers button.bad{background:#5a6385}
  #status{font-size:14px;opacity:.85;margin-top:10px;text-align:center}
  #hostctl .who{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  #hostctl .who span{font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);opacity:.55}
  #hostctl .who span.ok{opacity:1;background:var(--green);color:var(--navy);font-weight:700}
  /* Fin */
  #end{left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);max-height:80vh;overflow:auto}
  table.rank{width:100%;border-collapse:collapse;margin:8px 0 14px}
  table.rank td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px}
  table.rank tr.win td{background:rgba(255,207,90,.22);color:var(--gold);font-weight:800}
  table.rank tr.me td{outline:2px solid var(--light);outline-offset:-2px}
  table.rank td.s{text-align:right;font-weight:800}
  #toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:var(--coral);padding:12px 18px;border-radius:12px;
    font-weight:700;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity .3s;opacity:0;pointer-events:none;text-align:center;max-width:90vw}
  #toast.show{opacity:1}
  
/* ================= RESPONSIVE MOBILE FORCÉ ================= */
@media (max-width: 640px) {
  html { font-size: 14px !important; }
  body { font-size: 14px !important; }
  .panel { 
    width: min(98vw, 520px) !important; 
    padding: 16px !important; 
    left: 50% !important; 
    top: 50% !important; 
    transform: translate(-50%, -50%) !important; 
    max-height: 90vh !important; 
    overflow-y: auto !important;
  }
  h1 { font-size: 20px !important; }
  h2 { font-size: 16px !important; }
  p.sub { font-size: 13px !important; }
  button { 
    min-height: 48px !important; 
    padding: 12px 16px !important; 
    font-size: 15px !important; 
    width: 100% !important;
  }
  input { 
    font-size: 16px !important; /* évite le zoom iOS au focus */
    padding: 12px 14px !important;
  }
  #topbar { 
    top: 10px !important; 
    left: 8px !important; 
    right: 8px !important; 
    flex-direction: column !important; 
    gap: 8px !important;
  }
  #topbar > * { width: 100% !important; text-align: center !important; }
  .chip { font-size: 12px !important; padding: 6px 10px !important; }
  #game { width: min(98vw, 560px) !important; bottom: 10px !important; }
  #end { width: min(98vw, 500px) !important; padding: 18px 14px !important; }
  table.rank td { padding: 8px 6px !important; font-size: 14px !important; }
  #answers { grid-template-columns: 1fr !important; gap: 8px !important; }
  #answers button { min-height: 44px !important; font-size: 15px !important; }
  #toast { font-size: 13px !important; padding: 10px 14px !important; max-width: 94vw !important; }
  #scene { position: fixed !important; inset: 0 !important; z-index: 1 !important; pointer-events: none !important; }
}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="help" class="hidden"></div>
<div id="topbar" class="hidden">
  <div class="chip"><span class="dot"></span><span id="count">0</span> joueur(s) · <span id="roomchip"></span></div>
  <button id="leave" class="ghost">Quitter la salle</button>
</div>

<!-- Écran d'accueil -->
<div id="home" class="panel">
  <h1>QUIZ <b>3D</b> CREATOR</h1>
  <p class="sub">Web &amp; mobile pour débutants · Epitech Bénin</p>
  <input id="pseudo" maxlength="16" placeholder="Ton pseudo" autocomplete="off" />
  <button id="btnCreate">Créer une salle</button>
  <div class="sep">— ou —</div>
  <div class="row">
    <input id="codeIn" class="code" maxlength="5" placeholder="CODE" autocomplete="off" style="margin:0" />
    <button id="btnJoin" class="sec" style="flex:.8">Rejoindre</button>
  </div>
</div>

<!-- Lobby -->
<div id="lobby" class="panel hidden">
  <h2 id="lobbyTitle">Salle</h2>
  <div class="codebox"><div class="c" id="lobbyCode">-----</div><button id="btnCopy" class="sec">Copier le code</button></div>
  <ul class="pl" id="lobbyList"></ul>
  <button id="btnStart" class="hidden">Lancer la partie</button>
  <div id="lobbyWait" class="sub" style="text-align:center;margin:0">En attente du lancement par l'hôte…</div>
</div>

<!-- Partie -->
<div id="game" class="panel hidden">
  <div id="qnum"></div>
  <div id="qtext"></div>
  <div id="answers"></div>
  <div id="hostctl" class="hidden">
    <div class="who" id="who"></div>
    <button id="btnHost">Révéler les résultats</button>
  </div>
  <div id="status"></div>
</div>

<!-- Fin -->
<div id="end" class="panel hidden">
  <h2>🏆 Classement final</h2>
  <table class="rank" id="rank"></table>
  <button id="btnHome" class="sec">Retour à l'accueil</button>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
"use strict";
/* =====================================================================
   CONFIGURATION & CHARTE
   ===================================================================== */
const BROKER = "wss://broker.emqx.io:8084/mqtt";
const TOPIC = (code, t) => `creatorquiz3d/${code}/${t}`;
// Couleurs des joueurs : palette CREATOR, dans l'ordre d'arrivée
const PALETTE = ["#0B35FE", "#FF4E20", "#00E472", "#FF7A00", "#2E85FF", "#0C1A4B", "#F4F6FC"];
const OPTIONS = ["Oui", "Non"];
const POINTS = 10;

/* =====================================================================
   BANQUE DE QUESTIONS  —  { q, ans } avec ans = index dans options
   (ajouter un champ "options" pour passer en QCM plus tard)
   ===================================================================== */
const QUESTIONS = [
  { q: "Quel langage donne vie aux pages web (interactions, animations) ?", ans: 0 },
  { q: "Que signifie le \"H\" de HTML ?", ans: 0 },
  { q: "Quel langage colore et positionne les éléments d'une page ?", ans: 0 },
  { q: "Quel symbole ouvre un commentaire en JavaScript ?", ans: 0 },
  { q: "Quelle bibliothèque JS est créée par Meta (Facebook) ?", ans: 0 },
  { q: "Que signifie le sigle API ?", ans: 0 },
  { q: "Quel élément HTML crée un lien cliquable ?", ans: 0 },
  { q: "Que signifie le \"responsive design\" ?", ans: 0 },
  { q: "Quel langage sert à gérer les bases de données ?", ans: 0 },
  { q: "Quel langage développe les applications iPhone natives ?", ans: 0 }
];
const optsOf = (q) => q.options || OPTIONS;

/* =====================================================================
   OUTILS
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sanitizeName = (s) => String(s || "").replace(/[\u0000-\u001f<>]/g, "").trim().slice(0, 16);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
function makeCode() {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sans I, O, 0, 1
  let c = ""; for (let i = 0; i < 5; i++) c += A[Math.floor(Math.random() * A.length)];
  return c;
}
let toastT;
function toast(msg, ms = 2600) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms);
}
const show = (id, on = true) => $(id).classList.toggle("hidden", !on);

/* =====================================================================
   SCÈNE  —  rendu, lumières, décors
   ===================================================================== */
const canvas = $("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
const camPos = new THREE.Vector3(0, 7, 14), camLook = new THREE.Vector3(0, 1, 0);
const camTarget = { pos: camPos.clone(), look: camLook.clone() };

// Lumières cinéma
const hemi = new THREE.HemisphereLight(0xdfeaff, 0x3a3f60, 0.6); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffe2b8, 1.5);
key.position.set(6, 14, 8); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.radius = 4; key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
scene.add(key);
const fill = new THREE.DirectionalLight(0x7fa6ff, 0.55); fill.position.set(-8, 6, 4); scene.add(fill);
const rim = new THREE.DirectionalLight(0xff8fc0, 0.7); rim.position.set(0, 7, -10); scene.add(rim);

// Texture utilitaire canvas
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
}
// Ombre de contact douce (texture radiale)
const shadowTex = canvasTex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  gr.addColorStop(0, "rgba(0,0,0,.55)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });

/* ---------- Décor commun : gradins + foule (InstancedMesh pour la perf) ---------- */
const common = new THREE.Group(); scene.add(common);
const standMat = new THREE.MeshStandardMaterial({ color: 0x1b2a66, roughness: 0.8 });
const crowdSpots = [];
for (let row = 0; row < 4; row++) {
  const r = 13 + row * 1.4, y = row * 0.7;
  const step = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.7, r + 0.7, 0.7, 64, 1, true, Math.PI * 0.62, Math.PI * 1.76), standMat);
  // marches pleines : on dessine un anneau plat
  const ring = new THREE.Mesh(new THREE.RingGeometry(r - 0.7, r + 0.7, 64, 1, Math.PI * 1.12, Math.PI * 0.76 * 1.0 + Math.PI * 0.0), standMat);
  ring.rotation.x = -Math.PI / 2; ring.position.y = y + 0.35; ring.receiveShadow = true;
  // on garde un arc derrière la table (de -150° à -30° environ)
  ring.geometry.dispose();
  ring.geometry = new THREE.RingGeometry(r - 0.7, r + 0.7, 48, 1, Math.PI * 0.12, Math.PI * 0.76);
  step.position.y = y; step.visible = false;
  common.add(ring);
  const n = 18 + row * 3;
  for (let i = 0; i < n; i++) {
    const a = Math.PI * 0.14 + (Math.PI * 0.72) * (i + 0.5) / n;
    crowdSpots.push({ x: Math.cos(a) * r, z: -Math.sin(a) * r, y: y + 0.35, a });
  }
}
/* ---------- Silhouette de référence (géométrie fusionnée, partagée joueurs + foule) ----------
   Figurine claymation : tête en œuf, cou fin, torse droit, bras croisés haut sur la poitrine,
   longues jambes fines légèrement en "A", pieds bottes arrondis. */
function buildFigureGeometry(d = 1) {
  const R = (x) => Math.max(6, Math.round(x * d));
  const parts = [], UPV = new THREE.Vector3(0, 1, 0);
  const add = (geo, pos, scale, quat) => {
    const m = new THREE.Matrix4().compose(pos || new THREE.Vector3(), quat || new THREE.Quaternion(), scale || new THREE.Vector3(1, 1, 1));
    const g = (geo.index ? geo.toNonIndexed() : geo.clone()); g.applyMatrix4(m); parts.push(g);
  };
  // Capsule effilée entre a (rayon ra) et b (rayon rb)
  const limb = (a, b, ra, rb) => {
    const dir = new THREE.Vector3().subVectors(b, a), len = dir.length();
    const q = new THREE.Quaternion().setFromUnitVectors(UPV, dir.clone().normalize());
    add(new THREE.CylinderGeometry(rb, ra, len, R(20), 1, true), a.clone().add(b).multiplyScalar(0.5), null, q);
    add(new THREE.SphereGeometry(ra, R(18), R(12)), a); add(new THREE.SphereGeometry(rb, R(18), R(12)), b);
  };
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  // Pieds bottes
  [-1, 1].forEach((sd) => add(new THREE.SphereGeometry(0.18, R(22), R(14)), V(sd * 0.17, 0.09, 0.08), V(1, 0.6, 1.7)));
  // Jambes longues et fines, légèrement écartées
  [-1, 1].forEach((sd) => limb(V(sd * 0.12, 1.22, 0), V(sd * 0.17, 0.15, 0.0), 0.125, 0.1));
  // Torse monobloc (Lathe) : droit, épaules arrondies, cou fin
  const prof = [[0, 1.08], [0.2, 1.1], [0.255, 1.2], [0.25, 1.45], [0.265, 1.7], [0.25, 1.86], [0.18, 1.96], [0.11, 2.0], [0.1, 2.1], [0, 2.14]]
    .map(([x, y]) => new THREE.Vector2(x, y));
  add(new THREE.LatheGeometry(prof, R(36)), null, V(1, 1, 0.82));
  // Bras croisés haut sur la poitrine
  [-1, 1].forEach((sd) => limb(V(sd * 0.24, 1.84, 0), V(sd * 0.3, 1.56, 0.17), 0.08, 0.075));
  limb(V(0.3, 1.56, 0.17), V(-0.17, 1.7, 0.28), 0.075, 0.07);   // avant-bras droit (dessous)
  limb(V(-0.3, 1.56, 0.17), V(0.18, 1.66, 0.33), 0.075, 0.07);  // avant-bras gauche (dessus)
  add(new THREE.SphereGeometry(0.085, R(16), R(12)), V(-0.21, 1.72, 0.27), V(1, 0.85, 1.1));
  add(new THREE.SphereGeometry(0.085, R(16), R(12)), V(0.22, 1.68, 0.33), V(1, 0.85, 1.1));
  // Grosse tête lisse en forme d'œuf, sans visage
  add(new THREE.SphereGeometry(0.34, R(40), R(28)), V(0, 2.42, 0), V(0.95, 1.12, 0.97));
  // Fusion manuelle (pas de BufferGeometryUtils en r128 core)
  let n = 0; parts.forEach((g) => (n += g.attributes.position.count));
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3); let o = 0;
  parts.forEach((g) => { pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); o += g.attributes.position.count; g.dispose(); });
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", new THREE.BufferAttribute(pos, 3)); out.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
  out.computeBoundingSphere(); return out;
}
const FIGURE_GEO = buildFigureGeometry(1);
const CROWD_GEO = buildFigureGeometry(0.4); // version allégée pour la foule
const FIG_H = 2.8;

// Spectateurs : exactement la même silhouette, en plus petit, couleurs sobres (1 seul draw call)
const CROWD_COLORS = ["#3b4a7a", "#5b6b99", "#2E85FF", "#8a93b5", "#46557f", "#FF7A00", "#c9cfe3"];
const N = crowdSpots.length, CROWD_S = 0.62;
const crowdMesh = new THREE.InstancedMesh(CROWD_GEO, new THREE.MeshPhysicalMaterial({ roughness: 0.55, clearcoat: 0.2 }), N);
crowdMesh.castShadow = true; common.add(crowdMesh);
const crowdPhase = crowdSpots.map(() => Math.random() * Math.PI * 2);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(CROWD_S, CROWD_S, CROWD_S), _p = new THREE.Vector3(), _e = new THREE.Euler();
function updateCrowd(t) {
  crowdSpots.forEach((c, i) => {
    const bob = Math.max(0, Math.sin(t * 2.2 + crowdPhase[i])) * 0.1;
    _e.set(0, Math.atan2(-c.x, -c.z), Math.sin(t * 1.3 + crowdPhase[i]) * 0.03); _q.setFromEuler(_e);
    _m.compose(_p.set(c.x, c.y + bob, c.z), _q, _s); crowdMesh.setMatrixAt(i, _m);
  });
  crowdMesh.instanceMatrix.needsUpdate = true;
}
crowdSpots.forEach((c, i) => crowdMesh.setColorAt(i, new THREE.Color(CROWD_COLORS[i % CROWD_COLORS.length])));
crowdMesh.instanceColor.needsUpdate = true;

/* ---------- Mode LOBBY : ciel clair, sol à bandes ---------- */
const lobby = new THREE.Group(); scene.add(lobby);
const stripeTex = canvasTex(512, 512, (g, w, h) => {
  for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? "#DDE6FA" : "#F4F6FC"; g.fillRect(0, (h / 8) * i, w, h / 8); }
});
stripeTex.wrapS = stripeTex.wrapT = THREE.RepeatWrapping; stripeTex.repeat.set(4, 4);
const lobbyFloor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ map: stripeTex, roughness: 0.9 }));
lobbyFloor.rotation.x = -Math.PI / 2; lobbyFloor.receiveShadow = true; lobby.add(lobbyFloor);

/* =====================================================================
   RÉSEAU  —  MQTT over WebSocket, hôte autoritaire
   ===================================================================== */
const me = { id: localStorage.getItem("cq_id") || uid(), name: "" };
localStorage.setItem("cq_id", me.id);
let client = null, room = null, isHost = false, state = null;
let lastStateAt = 0, joinTimer = null, hbTimer = null, watchTimer = null, joinedAt = 0, hostLostShown = false;

function connect(onReady) {
  if (client) { client.end(true); client = null; }
  client = mqtt.connect(BROKER, { clientId: "cq_" + me.id + "_" + Math.random().toString(16).slice(2, 6), clean: true, reconnectPeriod: 2000, connectTimeout: 8000, keepalive: 20 });
  let first = true;
  client.on("connect", () => {
    client.subscribe([TOPIC(room, "state"), TOPIC(room, "events")], { qos: 1 }, () => { if (first) { first = false; onReady(); } else if (isHost) publishState(); });
  });
  client.on("reconnect", () => setHelp("Reconnexion au réseau…"));
  client.on("error", (e) => console.warn("MQTT", e && e.message));
  client.on("message", (topic, buf) => {
    const txt = buf.toString(); let msg = null;
    if (txt) { try { msg = JSON.parse(txt); } catch { return; } }
    if (topic.endsWith("/state")) onState(msg); else if (msg) onEvent(msg);
  });
}
const sendEvent = (ev) => client && client.connected && client.publish(TOPIC(room, "events"), JSON.stringify({ ...ev, from: me.id }), { qos: 1 });
function publishState() {
  if (!isHost || !client || !state) return;
  state.ts = Date.now();
  client.publish(TOPIC(room, "state"), JSON.stringify(state), { qos: 1, retain: true });
  render();
}

/* ---------- Côté HÔTE ---------- */
function createRoom() {
  room = makeCode(); isHost = true;
  state = { v: 1, code: room, hostId: me.id, phase: "lobby", qIndex: 0, answers: {}, players: [{ id: me.id, name: me.name, color: PALETTE[0], score: 0, host: true }] };
  history.replaceState(null, "", "?room=" + room);
  connect(() => { publishState(); enterRoom(); });
  hbTimer = setInterval(publishState, 3000); // heartbeat
}
function hostOnEvent(ev) {
  const p = state.players.find((x) => x.id === ev.from);
  if (ev.type === "join") {
    const name = sanitizeName(ev.name) || "Joueur";
    if (!p) {
      state.players.push({ id: ev.from, name, color: PALETTE[state.players.length % PALETTE.length], score: 0 });
      toast(name + " a rejoint la salle", 1500);
    } else p.name = name;
    publishState();
  } else if (ev.type === "leave" && p && !p.host) {
    state.players = state.players.filter((x) => x.id !== ev.from); delete state.answers[ev.from]; publishState();
  } else if (ev.type === "answer" && p && !p.host && state.phase === "question" && ev.q === state.qIndex) {
    const n = optsOf(QUESTIONS[state.qIndex]).length;
    if (Number.isInteger(ev.choice) && ev.choice >= 0 && ev.choice < n && !(ev.from in state.answers)) { state.answers[ev.from] = ev.choice; publishState(); }
  }
}
function hostStart() { state.phase = "question"; state.qIndex = 0; state.answers = {}; state.players.forEach((p) => (p.score = 0)); publishState(); }
function hostReveal() {
  const q = QUESTIONS[state.qIndex];
  state.players.forEach((p) => { if (state.answers[p.id] === q.ans) p.score += POINTS; });
  state.phase = "reveal"; publishState();
}
function hostNext() {
  if (state.qIndex + 1 >= QUESTIONS.length) state.phase = "end";
  else { state.qIndex++; state.phase = "question"; state.answers = {}; }
  publishState();
}
function hostAdvance() { if (!isHost || !state) return; if (state.phase === "question") hostReveal(); else if (state.phase === "reveal") hostNext(); }

/* ---------- Côté JOUEUR ---------- */
function joinRoom(code) {
  room = code; isHost = false; state = null; joinedAt = Date.now(); lastStateAt = 0; hostLostShown = false;
  history.replaceState(null, "", "?room=" + room);
  setHelp("Recherche de la salle " + room + "…");
  connect(() => {
    const sendJoin = () => {
      if (state && state.players.some((p) => p.id === me.id)) { clearInterval(joinTimer); joinTimer = null; return; }
      sendEvent({ type: "join", name: me.name });
    };
    sendJoin(); joinTimer = setInterval(sendJoin, 2500); // join répété jusqu'à confirmation
  });
  // Watchdog : hôte perdu après 12 s, salle expirée après 60 s
  watchTimer = setInterval(() => {
    const ref = lastStateAt || joinedAt, idle = Date.now() - ref;
    if (!lastStateAt && idle > 15000) { toast("Salle introuvable : vérifie le code."); leaveRoom(false); return; }
    if (idle > 60000) { toast("La salle a expiré."); leaveRoom(false); return; }
    if (lastStateAt && idle > 12000) { if (!hostLostShown) { hostLostShown = true; setHelp("⚠️ Hôte déconnecté… en attente de son retour"); } }
  }, 1000);
}

/* ---------- Réception ---------- */
function onState(s) {
  if (isHost) return; // l'hôte est la source de vérité
  if (!s) { if (state) { toast("L'hôte a fermé la salle."); leaveRoom(false); } return; }
  if (s.code !== room) return;
  const fresh = !state;
  state = s; lastStateAt = Date.now(); hostLostShown = false;
  if (fresh && Date.now() - s.ts > 60000) { toast("La salle a expiré."); leaveRoom(false); return; }
  if ($("topbar").classList.contains("hidden")) enterRoom();
  render();
}
function onEvent(ev) {
  if (isHost) { if (ev.from !== me.id) hostOnEvent(ev); return; }
  if (ev.type === "closed") { toast("L'hôte a fermé la salle."); leaveRoom(false); }
}

/* ---------- Quitter / fermeture propre ---------- */
function cleanupNetwork() {
  if (!client) return;
  try {
    if (isHost) { client.publish(TOPIC(room, "state"), "", { qos: 0, retain: true }); client.publish(TOPIC(room, "events"), JSON.stringify({ type: "closed", from: me.id })); }
    else sendEvent({ type: "leave" });
  } catch {}
  const c = client; client = null; setTimeout(() => c.end(true), 300);
}
function leaveRoom(notify = true) {
  if (notify) cleanupNetwork(); else if (client) { const c = client; client = null; c.end(true); }
  [joinTimer, hbTimer, watchTimer].forEach((t) => t && clearInterval(t));
  joinTimer = hbTimer = watchTimer = null; state = null; room = null; isHost = false;
  history.replaceState(null, "", location.pathname);
  chars.forEach((c) => scene.remove(c)); chars.clear();
  ["lobby", "game", "end", "help", "topbar"].forEach((id) => show(id, false)); show("home");
  setMode("lobby");
}

    } else {

/* ---------- Synchronisation des personnages 3D ---------- */
function seatPositions(n) {
  const out = []; let ring = 0, placed = 0;
  while (placed < n) {
    const cap = ring === 0 ? 6 : 6 + ring * 5, R = 3.9 + ring * 1.7, k = Math.min(cap, n - placed);
    for (let i = 0; i < k; i++) { const a = Math.PI / 2 + (i / k) * Math.PI * 2 + ring * 0.3; out.push({ x: Math.cos(a) * R, z: Math.sin(a) * R, ring }); }
    placed += k; ring++;
  }
  return out;
}
function syncCharacters() {
  const ids = new Set(state.players.map((p) => p.id));
  chars.forEach((c, id) => { if (!ids.has(id)) { scene.remove(c); chars.delete(id); } });
  const seats = seatPositions(state.players.length);
  // chaises
  while (chairs.length < seats.length) { const ch = makeChair(); studio.add(ch); chairs.push(ch); }
  chairs.forEach((ch, i) => { ch.visible = i < seats.length && seats[i].ring === 0; if (seats[i]) { const sp = seats[i], d = Math.hypot(sp.x, sp.z), f = (d + 0.75) / d; ch.position.set(sp.x * f, 0, sp.z * f); ch.lookAt(0, 0, 0); } });
  state.players.forEach((p, i) => {
    let c = chars.get(p.id);
    if (!c || c.userData.color !== p.color || c.userData.name !== p.name) {
      if (c) scene.remove(c);
      c = makeCharacter(p.color, p.name, p.id === me.id); chars.set(p.id, c);
    }
    const u = c.userData;
    if (mode === "lobby") { // spirale phyllotaxie
      const a = i * 2.39996, r = i === 0 ? 0 : 1.25 * Math.sqrt(i);
      u.target.set(Math.cos(a) * r, 0.15, Math.sin(a) * r); u.yaw = Math.atan2(camPos.x - u.target.x, camPos.z - u.target.z);
    } else {
      const sp = seats[i]; u.target.set(sp.x, 0, sp.z); u.yaw = Math.atan2(-sp.x, -sp.z);
    }
    // Pendant la révélation : sautille si bonne réponse
    u.happy = state.phase === "reveal" && state.answers[p.id] === QUESTIONS[state.qIndex].ans;
    u.answered = state.phase === "question" && p.id in (state.answers || {});
  });
}

/* ---------- Tableau de score géant ---------- */
function drawBoard() {
  const g = boardCanvas.getContext("2d"), W = 1024, H = 576, s = state;
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#0C1A4B"); gr.addColorStop(1, "#0B35FE");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "#00E472"; g.font = "800 38px system-ui,sans-serif";
  if (!s || s.phase === "lobby") { g.fillText("CREATOR QUIZ 3D", W / 2, H / 2); boardTex.needsUpdate = true; return; }
  const cs = contestants();
  if (s.phase === "end") {
    g.fillText("CLASSEMENT FINAL", W / 2, 60);
    [...cs].sort((a, b) => b.score - a.score).slice(0, 5).forEach((p, i) => {
      g.fillStyle = i === 0 ? "#ffcf5a" : "#ffffff"; g.font = `${i === 0 ? 800 : 600} 44px system-ui`;
      g.fillText(`${["🥇", "🥈", "🥉", "4.", "5."][i]} ${p.name} — ${p.score}`, W / 2, 150 + i * 80);
    });
    boardTex.needsUpdate = true; return;
  }
  const q = QUESTIONS[s.qIndex], opts = optsOf(q), counts = opts.map(() => 0);
  Object.values(s.answers || {}).forEach((c) => counts[c]++);
  g.fillText(`QUESTION ${s.qIndex + 1} / ${QUESTIONS.length}`, W / 2, 50);
  g.fillStyle = "#ffffff"; g.font = "700 40px system-ui";
  wrapText(g, q.q, W / 2, 130, W - 100, 50);
  const revealed = s.phase === "reveal";
  opts.forEach((o, i) => {
    const x = W / 2 + (i - (opts.length - 1) / 2) * 380, y = 360;
    g.fillStyle = revealed ? (i === q.ans ? "#00E472" : "rgba(255,255,255,.12)") : i === 0 ? "#FF4E20" : "#2E85FF";
    g.beginPath(); g.rect(x - 160, y - 70, 320, 140); g.fill();
    g.fillStyle = revealed && i === q.ans ? "#0C1A4B" : "#ffffff"; g.font = "800 46px system-ui"; g.fillText(o, x, y - 22);
    g.font = "800 54px system-ui"; g.fillText(revealed || isHost ? counts[i] : "?", x, y + 32);
  });
  g.fillStyle = "#ffffff"; g.font = "600 32px system-ui";
  g.fillText(revealed ? `Bonne réponse : ${opts[q.ans]}` : `${Object.keys(s.answers || {}).length} / ${cs.length} ont répondu`, W / 2, 510);
  boardTex.needsUpdate = true;
}
function wrapText(g, text, x, y, maxW, lh) {
  const words = text.split(" "); let line = "", lines = [];
  words.forEach((w) => { const t = line ? line + " " + w : w; if (g.measureText(t).width > maxW) { lines.push(line); line = w; } else line = t; });
  lines.push(line); lines.forEach((l, i) => g.fillText(l, x, y + i * lh));
}

/* =====================================================================
   BOUCLE D'ANIMATION
   ===================================================================== */
const clock = new THREE.Clock();
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); frameCamera();
}
window.addEventListener("resize", resize);
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  camPos.lerp(camTarget.pos, 1 - Math.exp(-3 * dt)); camLook.lerp(camTarget.look, 1 - Math.exp(-3 * dt));
  camPos.x = camTarget.pos.x + Math.sin(t * 0.15) * 0.6;
  camera.position.copy(camPos); camera.lookAt(camLook);
  chars.forEach((c) => {
    const u = c.userData;
    c.position.lerp(u.target, 1 - Math.exp(-4 * dt));
    c.scale.setScalar(THREE.MathUtils.lerp(c.scale.x, 1, 1 - Math.exp(-6 * dt)));
    c.rotation.y += (u.yaw - c.rotation.y) * (1 - Math.exp(-5 * dt));
    // Rebond léger + balancement doux
    const bob = u.happy ? Math.abs(Math.sin(t * 7 + u.phase)) * 0.35 : Math.abs(Math.sin(t * 2 + u.phase)) * 0.05;
    u.fig.position.y = bob; u.fig.rotation.z = Math.sin(t * 1.4 + u.phase) * 0.04;
    u.fig.rotation.x = u.answered ? 0.08 : 0;
    u.label.position.y = FIG_H + 0.35 + bob;
  });
  updateCrowd(t);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* =====================================================================
   ÉVÉNEMENTS UI
   ===================================================================== */
const pseudoIn = $("pseudo"), codeIn = $("codeIn");
pseudoIn.value = localStorage.getItem("cq_name") || "";
const params = new URLSearchParams(location.search);
if (params.get("room")) codeIn.value = params.get("room").toUpperCase().slice(0, 5);
codeIn.addEventListener("input", () => (codeIn.value = codeIn.value.toUpperCase().replace(/[^A-Z0-9]/g, "")));
function readName() {
  const n = sanitizeName(pseudoIn.value);
  if (!n) { toast("Choisis un pseudo 🙂"); pseudoIn.focus(); return null; }
  localStorage.setItem("cq_name", n); me.name = n; return n;
}
$("btnCreate").onclick = () => { if (readName()) createRoom(); };
$("btnJoin").onclick = () => {
  if (!readName()) return;
  const c = codeIn.value.trim().toUpperCase();
  if (!/^[A-HJ-NP-Z2-9]{5}$/.test(c)) { toast("Code invalide (5 caractères)"); return; }
  joinRoom(c);
};
[pseudoIn, codeIn].forEach((i) => i.addEventListener("keydown", (e) => { if (e.key === "Enter") (codeIn.value.length === 5 ? $("btnJoin") : $("btnCreate")).click(); }));
$("btnCopy").onclick = async () => {
  const url = location.origin + location.pathname + "?room=" + room;
  try { await navigator.clipboard.writeText(room); toast("Code copié : " + room); } catch { toast("Code : " + room + "\n" + url, 4000); }
};
$("btnStart").onclick = () => hostStart();
$("btnHost").onclick = () => hostAdvance();
$("answers").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]"); if (!b || isHost || !state || state.phase !== "question" || myPick !== null) return;
  myPick = +b.dataset.i; sendEvent({ type: "answer", q: state.qIndex, choice: myPick }); render();
});
$("leave").onclick = () => { if (!isHost || confirm("Fermer la salle pour tout le monde ?")) leaveRoom(true); };
$("btnHome").onclick = () => leaveRoom(true);
// Tap sur la scène = action hôte (sans glisser)
let downAt = null;
canvas.addEventListener("pointerdown", (e) => (downAt = { x: e.clientX, y: e.clientY }));
canvas.addEventListener("pointerup", (e) => { if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 10) hostAdvance(); downAt = null; });

/* ---------- Démarrage ---------- */
setMode("lobby"); resize(); drawBoard(); loop();
</script>
