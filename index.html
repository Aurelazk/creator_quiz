<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz 3D CREATOR</title>
<style>

.panel button.secondary{background:var(--creator-blue);color:var(--creator-white)}
.panel button:disabled{opacity:.55;cursor:default}
.panel .sep{margin:16px 0 6px;font-size:12px;opacity:.5;text-transform:uppercase;letter-spacing:1px}

#roomInfo{position:fixed;top:66px;right:12px;background:var(--panel-bg);color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;display:none;z-index:30;text-align:right}
#roomInfo b{color:var(--text-gold);font-size:17px;letter-spacing:2px}
#playersList{position:fixed;top:70px;left:12px;background:var(--panel-bg);padding:10px 12px;border-radius:10px;color:#fff;font-size:12px;max-width:210px;display:none;z-index:30;max-height:50vh;overflow:auto}
#playersList h4{margin:0 0 8px;color:var(--text-gold);font-size:13px}

#startBtn{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--btn-primary);color:var(--creator-white);border:none;padding:15px 30px;border-radius:25px;font-weight:bold;font-size:16px;cursor:pointer;z-index:40;display:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#startBtn:hover{background:var(--btn-hover)}
#leaveBtn{position:fixed;top:10px;left:12px;background:var(--panel-bg);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;z-index:30;display:none}
#leaveBtn:hover{background:rgba(255,255,255,.15)}
#quizPanel{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel-bg);padding:20px 24px;border-radius:16px;text-align:center;color:#fff;z-index:1000;width:min(92vw,500px);box-shadow:0 20px 60px rgba(0,0,0,.5);display:none}

#quizPanel #qText{font-size:17px;margin:0 0 16px;line-height:1.4;color:#fff}

#quizPanel .answers button{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.35);padding:12px 16px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;width:120px}
#quizPanel .answers button:hover:not(:disabled){border-color:var(--text-gold);background:rgba(255,122,0,.15)}
#quizPanel .answers button.selected{background:var(--text-gold);color:#111;border-color:var(--text-gold)}
#quizPanel .answers button:disabled{cursor:default;opacity:0.6}
#quizPanel #qStatus{margin-top:12px;font-size:14px;color:var(--text-highlight);min-height:20px}
#revealBtn{background:var(--btn-primary);color:var(--creator-white);border:none;padding:12px 16px;border-radius:8px;font-weight:bold;margin-top:15px;cursor:pointer;width:100%}
#revealBtn:hover{background:var(--btn-hover)}
#leaderboard{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel-bg);padding:26px 24px;border-radius:16px;text-align:center;color:#fff;z-index:1100;width:min(92vw,460px);box-shadow:0 20px 60px rgba(0,0,0,.6);display:none}

#intro p{font-size:1.1rem;opacity:0.9;margin:0 0 24px}
#intro button{background:var(--creator-blue);color:white;border:none;padding:16px 32px;border-radius:12px;font-size:1rem;font-weight:bold;cursor:pointer}

  html { font-size: 14px !important; }
  body { font-size: 14px !important; overflow-x: hidden !important; }
  #scene { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important; pointer-events: none !important; }

  h1 { font-size: 20px !important; } h2 { font-size: 16px !important; } p.sub { font-size: 13px !important; }

  input { font-size: 16px !important; padding: 12px 14px !important; }
  #topbar { top: 10px !important; left: 8px !important; right: 8px !important; flex-direction: column !important; gap: 8px !important; z-index: 11 !important; }
  #topbar > * { width: 100% !important; text-align: center !important; }
  .chip { font-size: 12px !important; padding: 6px 10px !important; }
  #game { width: min(96vw, 560px) !important; bottom: 10px !important; left: 50% !important; transform: translateX(-50%) !important; }

  #answers { grid-template-columns: 1fr !important; gap: 8px !important; }
  #answers button { min-height: 44px !important; font-size: 15px !important; }
  #toast { font-size: 13px !important; padding: 10px 14px !important; max-width: 94vw !important; }
  #help { font-size: 13px !important; padding: 6px 12px !important; max-width: 92vw !important; }

</style>
</head>

  </div>
</div>
<div id="lobby" class="panel hidden">

    <div class="sub" style="margin-top:8px;font-size:13px;">Scannez pour rejoindre</div>
  </div>
  <ul class="pl" id="lobbyList"></ul>
  <button id="btnStart" class="hidden">Lancer la partie</button>
  <div id="lobbyWait" class="sub" style="text-align:center;margin:0">En attente du lancement par l'hôte…</div>
</div>
<div id="game" class="panel hidden">
  <div id="qnum"></div>
  <div id="qtext"></div>
  <div class="answers" id="qAnswers"></div>
  <div id="qStatus"></div>
  <button id="revealBtn">Révéler les résultats</button>
</div>
<div id="end" class="panel hidden">
  <h2>🏆 Classement final</h2>
  <table class="rank" id="rank"></table>
  <button id="btnHome" class="sec">Retour à l'accueil</button>
</div>
<div id="toast"></div>
