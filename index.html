<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz 3D Multijoueur</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0d1f;font-family:Arial,Helvetica,sans-serif}
canvas{display:block}
#t{position:fixed;left:0;right:0;bottom:9%;text-align:center;color:#fff;font-weight:800;font-size:22px;line-height:1.2;text-shadow:0 2px 3px rgba(0,0,0,.45);pointer-events:none;padding:0 20px}
#b{position:fixed;top:34px;left:0;right:0;text-align:center;display:none;z-index:20}
#b button{margin:0 4px;padding:8px 18px;border:0;border-radius:20px;font-weight:700;font-size:14px;background:rgba(255,255,255,.92);color:#234;cursor:pointer}
#b button.on{background:#ffb300;color:#000}
#h{position:fixed;top:10px;left:0;right:0;text-align:center;color:#fff;font-size:12px;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.5);pointer-events:none;z-index:20}
.panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,15,40,.94);padding:26px 24px;border-radius:16px;text-align:center;color:#fff;z-index:1000;width:min(92vw,380px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.panel h2{margin:0 0 6px;color:#ffb300;font-size:22px}
.panel .sub{margin:0 0 18px;font-size:13px;opacity:.7;line-height:1.4}
.panel input{box-sizing:border-box;width:100%;padding:12px 14px;font-size:16px;border-radius:8px;border:1px solid #33406b;background:#0d1330;color:#fff;margin:6px 0;text-align:center}
.panel input::placeholder{color:#8a93b5}
.panel .row{display:flex;gap:8px;margin-top:6px}
.panel button{background:#ffb300;color:#111;border:none;padding:12px 16px;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer;flex:1}
.panel button.secondary{background:#2a3566;color:#fff}
.panel button:disabled{opacity:.55;cursor:default}
.panel .sep{margin:16px 0 6px;font-size:12px;opacity:.5;text-transform:uppercase;letter-spacing:1px}
#status{margin-top:14px;font-size:13px;min-height:18px;color:#9fe6a0;word-break:break-word}
#status.err{color:#ff8a80}
#roomInfo{position:fixed;top:66px;right:12px;background:rgba(10,15,40,.85);color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;display:none;z-index:30;text-align:right}
#roomInfo b{color:#ffb300;font-size:17px;letter-spacing:2px}
#roomInfo button{display:block;margin-top:6px;width:100%;background:#2a3566;color:#fff;border:none;padding:6px 8px;border-radius:6px;font-size:12px;cursor:pointer}
#playersList{position:fixed;top:70px;left:12px;background:rgba(10,15,40,.85);padding:10px 12px;border-radius:10px;color:#fff;font-size:12px;max-width:210px;display:none;z-index:30;max-height:50vh;overflow:auto}
#playersList h4{margin:0 0 8px;color:#ffb300;font-size:13px}
#playersList .p{margin:3px 0;padding:3px 0;color:#c9d2f0;border-bottom:1px solid rgba(255,255,255,.06)}
#playersList .p.me{color:#ffb300;font-weight:bold}
#playersList .p .tag{float:right;opacity:.6;font-size:10px}
#startBtn{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#ffb300;color:#111;border:none;padding:15px 30px;border-radius:25px;font-weight:bold;font-size:16px;cursor:pointer;z-index:40;display:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#leaveBtn{position:fixed;top:10px;left:12px;background:rgba(10,15,40,.85);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;z-index:30;display:none}
</style></head><body>
<div id="h">Quiz 3D Multijoueur</div>
<div id="b"><button id="b1" class="on">Lobby</button><button id="b2">Table</button></div>
<div id="t">En attente de salle...<br><span id="c">0/19 joueurs</span></div>
<button id="leaveBtn">Quitter la salle</button>
<div id="roomInfo">Salle <b id="roomCodeLabel">-----</b><button id="copyBtn">Copier le code</button></div>
<div id="playersList"><h4>Joueurs</h4><div id="playersItems"></div></div>
<button id="startBtn">Lancer la partie</button>
<div id="roomPanel" class="panel">
  <h2>Quiz 3D Multijoueur</h2>
  <p class="sub">Crée une salle et partage le code, ou rejoins une salle existante.</p>
  <input id="nameInput" maxlength="16" placeholder="Ton pseudo">
  <button id="createBtn">Créer une salle</button>
  <div class="sep">ou</div>
  <input id="roomInput" maxlength="5" placeholder="Code de la salle" style="text-transform:uppercase">
  <div class="row">
    <button id="joinBtn" class="secondary">Rejoindre</button>
  </div>
  <div id="status"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const QUESTION = "Nommez un langage de programmation";
const ANSWERS = [
  ['JavaScript', 45], ['Python', 38], ['Java', 32], ['C++', 28], ['C#', 25],
  ['PHP', 22], ['Ruby', 18], ['Go', 15], ['Swift', 12], ['Kotlin', 10]
];
const MAX_PLAYERS = 19;
const TABLE_SEATS = 6;
const MQTT_URL = 'wss://broker.emqx.io:8084/mqtt';
const TOPIC_BASE = 'creatorquiz3d/';

const playerColors = [0x808080, 0x808080, 0x808080, 0x808080, 0x808080, 0x808080, 0x808080, 0x808080, 0x808080, 0x808080, 0x808080, 0x808080, 0x808080, 0x808080, 0x808080, 0x808080, 0x808080, 0x808080, 0x808080];

const lobbyPositions = [
  [-1.5, 0], [0.1, -0.4], [-0.1, 1.4], [1.5, 0.6],
  [2.5, -1], [-2, 1.5], [1, -2], [-3, 0],
  [2, 1], [-1.8, -1.5], [0.5, 2], [1.8, -0.8],
  [-2.5, -1.2], [0.8, 1.8], [-1.2, -1], [2.2, 0.5],
  [-0.8, 2.2], [1.2, 0.3], [-2.2, -0.5]
];

const tablePlayerPositions = [
  { angle: 0, radius: 4.2 },
  { angle: Math.PI * 2 / 6, radius: 4.2 },
  { angle: Math.PI * 4 / 6, radius: 4.2 },
  { angle: Math.PI * 6 / 6, radius: 4.2 },
  { angle: Math.PI * 8 / 6, radius: 4.2 },
  { angle: Math.PI * 10 / 6, radius: 4.2 }
];

let playerId = Math.random().toString(36).slice(2, 11);
let playerName = 'Joueur-' + playerId.slice(0, 4);
let roomId = null;
let isHost = false;
let state = null;
let mode = 'lobby';
let rv = 0;

const $ = (id) => document.getElementById(id);

// ========== RENDERER (rendu physique) ==========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d1f);
scene.fog = new THREE.Fog(0x0a0d1f, 26, 60);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
ren.setSize(innerWidth, innerHeight);
ren.shadowMap.enabled = true;
ren.shadowMap.type = THREE.PCFSoftShadowMap;
ren.outputEncoding = THREE.sRGBEncoding;
ren.toneMapping = THREE.ACESFilmicToneMapping;
ren.toneMappingExposure = 1.12;
document.body.appendChild(ren.domElement);

// ========== TEXTURES PROCEDURALES ==========
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}

const woodTex = canvasTex(512, 512, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, w, 0);
  g.addColorStop(0, '#8a5c34'); g.addColorStop(0.5, '#a5713f'); g.addColorStop(1, '#7e5230');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 110; i++) {
    const y0 = Math.random() * h;
    x.strokeStyle = `rgba(58,34,16,${0.04 + Math.random() * 0.1})`;
    x.lineWidth = 0.6 + Math.random() * 2.4;
    x.beginPath(); x.moveTo(0, y0);
    for (let px = 0; px <= w; px += 28) x.lineTo(px, y0 + Math.sin(px * 0.02 + i * 1.7) * (1.5 + Math.random() * 4));
    x.stroke();
  }
  for (let i = 0; i < 26; i++) {
    x.fillStyle = `rgba(255,220,170,${0.02 + Math.random() * 0.05})`;
    x.fillRect(0, Math.random() * h, w, 1 + Math.random() * 4);
  }
});
woodTex.repeat.set(2, 2);

const feltTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#233a86'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) {
    x.fillStyle = `rgba(${150 + Math.random() * 60 | 0},${165 + Math.random() * 60 | 0},${220},${0.04 + Math.random() * 0.07})`;
    x.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5);
  }
});
feltTex.repeat.set(6, 6);

const floorTex = canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = '#20242e'; x.fillRect(0, 0, w, h);
  const tile = 256;
  for (let ty = 0; ty < 2; ty++) {
    for (let tx = 0; tx < 2; tx++) {
      const ox = tx * tile, oy = ty * tile;
      x.fillStyle = (tx + ty) % 2 ? '#262b36' : '#1d2129';
      x.fillRect(ox + 4, oy + 4, tile - 8, tile - 8);
      for (let i = 0; i < 240; i++) {
        x.fillStyle = `rgba(255,255,255,${Math.random() * 0.03})`;
        x.fillRect(ox + Math.random() * tile, oy + Math.random() * tile, 1, 1);
      }
    }
  }
});
floorTex.repeat.set(10, 8);

const leatherTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#4a2418'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 1400; i++) {
    x.fillStyle = `rgba(255,190,140,${Math.random() * 0.05})`;
    x.beginPath();
    x.arc(Math.random() * w, Math.random() * h, 1 + Math.random() * 2.5, 0, 7);
    x.fill();
  }
});

const glowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 8, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,200,110,.55)');
  g.addColorStop(0.5, 'rgba(120,140,255,.18)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();

// ========== MATERIAUX ==========
const woodDark = new THREE.MeshPhysicalMaterial({ color: 0x4a3320, roughness: 0.55, metalness: 0.05, clearcoat: 0.5, clearcoatRoughness: 0.3 });
const woodTop = new THREE.MeshPhysicalMaterial({ map: woodTex, roughness: 0.4, metalness: 0.05, clearcoat: 0.6, clearcoatRoughness: 0.25 });
const metalGold = new THREE.MeshPhysicalMaterial({ color: 0xd9a441, roughness: 0.28, metalness: 1, clearcoat: 0.4, clearcoatRoughness: 0.2 });
const metalChrome = new THREE.MeshPhysicalMaterial({ color: 0x9aa4b2, roughness: 0.22, metalness: 1 });
const fabricFelt = new THREE.MeshStandardMaterial({ map: feltTex, color: 0x9fb0ff, roughness: 1, metalness: 0 });
const leather = new THREE.MeshPhysicalMaterial({ map: leatherTex, roughness: 0.62, metalness: 0.02, clearcoat: 0.18, clearcoatRoughness: 0.4 });
const wallMat = new THREE.MeshStandardMaterial({ color: 0x151a30, roughness: 0.92 });
const wallMat2 = new THREE.MeshStandardMaterial({ color: 0x101528, roughness: 0.92 });
const floorMat = new THREE.MeshPhysicalMaterial({ map: floorTex, roughness: 0.32, metalness: 0.08, clearcoat: 0.45, clearcoatRoughness: 0.3 });
const standMat = new THREE.MeshStandardMaterial({ color: 0x232940, roughness: 0.9 });
const trussMat = new THREE.MeshStandardMaterial({ color: 0x14161c, roughness: 0.5, metalness: 0.6 });

// ========== ECLAIRAGE STUDIO ==========
const hemi = new THREE.HemisphereLight(0x8a7ff0, 0x1a1430, 0.55);
scene.add(hemi);

const key = new THREE.SpotLight(0xffefe0, 1.7, 50, 0.6, 0.55, 1);
key.position.set(0, 13, 3);
key.target.position.set(0, 1.2, -1);
key.castShadow = true;
key.shadow.mapSize.width = 2048;
key.shadow.mapSize.height = 2048;
key.shadow.bias = 0.0002;
scene.add(key); scene.add(key.target);

const fill = new THREE.DirectionalLight(0x6a7ff0, 0.3);
fill.position.set(-9, 7, 9);
scene.add(fill);

const rim = new THREE.SpotLight(0xff6b9d, 0.95, 45, 0.8, 0.9, 1);
rim.position.set(0, 11, -14);
rim.target.position.set(0, 3, 0);
scene.add(rim); scene.add(rim.target);

// ========== SALLE ==========
const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 70), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const backWall = new THREE.Mesh(new THREE.PlaneGeometry(70, 22), wallMat);
backWall.position.set(0, 11, -17);
scene.add(backWall);
[-1, 1].forEach((d) => {
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(50, 22), wallMat2);
  wall.position.set(d * 24, 11, -5);
  wall.rotation.y = d > 0 ? -Math.PI / 2 : Math.PI / 2;
  scene.add(wall);
});

// Fond lumineux derrière la table
const glow = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 13),
  new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })
);
glow.position.set(0, 5.5, -16.8);
scene.add(glow);

// ====== RAIL DE PROJECTEURS + CÔNES DE LUMIERE ======
const rig = new THREE.Group();
scene.add(rig);
const truss = new THREE.Mesh(new THREE.BoxGeometry(13, 0.28, 0.28), trussMat);
truss.position.set(0, 8.3, -1);
rig.add(truss);
[-4, 0, 4].forEach((tx) => {
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.55, 6), trussMat);
  rod.position.set(tx, 7.95, -1);
  rig.add(rod);
  const can = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.26, 0.5, 16), trussMat);
  can.position.set(tx, 7.55, -1);
  can.rotation.x = 0.35;
  rig.add(can);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 8), new THREE.MeshBasicMaterial({ color: 0xfff2d8 }));
  bulb.position.set(tx, 7.32, -0.92);
  rig.add(bulb);
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(2.1, 6.4, 24, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xffe9c0, transparent: true, opacity: 0.05, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending })
  );
  cone.position.set(tx, 4.3, 0.2);
  cone.rotation.x = Math.PI;
  rig.add(cone);
});

// ====== GRADINS + PUBLIC ======
const crowdColors = [0x3a4356, 0x565f6e, 0x6e4638, 0x753d3d, 0x2e4260, 0x4d4d5e, 0x6b5a41, 0x37414f];
function makeCrowdChar(color, s) {
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.92 });
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.24 * s, 0.28 * s, 0.52 * s, 12), m);
  b.position.y = 0.28 * s;
  g.add(b);
  const skin = new THREE.MeshStandardMaterial({ color: [0xf2c9a0, 0xd9a273, 0x8d5a3b, 0xf7e0c8, 0xc68e63][Math.random() * 5 | 0], roughness: 0.6 });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.21 * s, 14, 12), skin);
  head.position.y = 0.62 * s;
  g.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.225 * s, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2.2), new THREE.MeshStandardMaterial({ color: [0x1d1712, 0x3a2a1a, 0x5c4326, 0x2a2a2e][Math.random() * 4 | 0], roughness: 0.85 }));
  hair.position.y = 0.64 * s;
  g.add(hair);
  return g;
}
for (let r = 0; r < 5; r++) {
  const st = new THREE.Mesh(new THREE.BoxGeometry(15, 0.5 * (r + 1), 1.3), standMat);
  st.position.set(0, 0.25 * (r + 1), -7 - r * 1.3);
  st.receiveShadow = true;
  scene.add(st);
  for (let i = 0; i < 14; i++) {
    const f = makeCrowdChar(crowdColors[Math.random() * crowdColors.length | 0], 0.55);
    f.position.set(-6.5 + i + (Math.random() - 0.5) * 0.4, 0.5 * (r + 1), -7 - r * 1.3);
    f.rotation.y = (Math.random() - 0.5) * 0.5;
    scene.add(f);
  }
}
[-1, 1].forEach((d) => {
  const w = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3.6, 7.5), standMat);
  w.position.set(d * 7.8, 1.8, -9.5);
  scene.add(w);
});

// ========== PERSONNAGES ==========
const shadowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 2, 32, 32, 32);
  g.addColorStop(0, 'rgba(0,0,0,.4)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

function makeLabel(text, isMe) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  x.font = 'bold 30px Arial';
  x.textAlign = 'center';
  x.strokeStyle = 'rgba(0,0,0,0.65)';
  x.lineWidth = 5;
  x.strokeText(text, 128, 40);
  x.fillStyle = isMe ? '#ffcf5a' : '#f2f4fa';
  x.fillText(text, 128, 40);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.scale.set(1.6, 0.4, 1);
  sprite.position.y = 2.02;
  sprite.name = 'nameLabel';
  return sprite;
}


function makeChar(color, name, isMe) {
  const g = new THREE.Group();
  const clay = new THREE.MeshPhysicalMaterial({ color: 0x808080, roughness: 0.45, metalness: 0, clearcoat: 0.15, clearcoatRoughness: 0.2 });

  const sh = new THREE.Mesh(new THREE.PlaneGeometry(1.05, 1.05), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
  sh.rotation.x = -Math.PI / 2;
  sh.position.y = 0.015;
  g.add(sh);

  // Tete : grande sphère parfaite, sans visage
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 24), clay);
  head.position.y = 1.62;
  g.add(head);

  // Cou court et cylindrique
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.17, 16), clay);
  neck.position.y = 1.48;
  g.add(neck);

  // Tronc : cylindre adouci qui s'évasant subtilement vers le bas
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.27, 0.72, 24), clay);
  torso.position.y = 1.08;
  g.add(torso);

  // Bras croisés sur la poitrine (avant-bras droit par-dessus le gauche)
  const arms = [];
  const armY = 1.32;
  [-1, 1].forEach((d) => {
    const p = new THREE.Group();
    p.position.set(d * 0.26, armY, 0);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.42, 12), clay);
    arm.position.y = -0.22;
    p.add(arm);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.085, 12, 10), clay);
    hand.position.y = -0.46;
    p.add(hand);
    // avant-bras droit (d=1) passe par-dessus le gauche
    p.rotation.z = d > 0 ? 0.85 : -0.75;
    p.rotation.y = d > 0 ? 0.18 : -0.18;
    p.position.z = d > 0 ? 0.06 : -0.06;
    g.add(p);
    arms.push(p);
  });

  // Jambes : tubes lisses, droites, légèrement écartées
  const legs = [];
  [-0.13, 0.13].forEach((dx) => {
    const hip = new THREE.Group();
    hip.position.set(dx, 0.72, 0);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.07, 0.62, 14), clay);
    leg.position.y = -0.33;
    hip.add(leg);
    const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.13, 16), clay);
    foot.rotation.x = Math.PI / 2;
    foot.position.set(0, -0.67, 0.05);
    hip.add(foot);
    g.add(hip);
    legs.push(hip);
  });

  g.add(makeLabel(name, isMe));
  g.userData = { arms, legs, torso, head, ph: Math.random() * 6, name, baseRot: 0 };
  return g;
}

// ========== TABLE ==========
const tg = new THREE.Group();
tg.visible = false;
scene.add(tg);

const tableBase = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.95, 0.35, 32), woodDark);
tableBase.position.y = 0.17;
tableBase.castShadow = true;
tableBase.receiveShadow = true;
tg.add(tableBase);

const tableTop = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 0.2, 64), woodTop);
tableTop.position.y = 1.35;
tableTop.castShadow = true;
tableTop.receiveShadow = true;
tg.add(tableTop);

const tableEdge = new THREE.Mesh(new THREE.TorusGeometry(4.02, 0.09, 16, 64), woodDark);
tableEdge.rotation.x = Math.PI / 2;
tableEdge.position.y = 1.35;
tg.add(tableEdge);

const goldRing = new THREE.Mesh(new THREE.TorusGeometry(4.16, 0.05, 12, 96), metalGold);
goldRing.rotation.x = Math.PI / 2;
goldRing.position.y = 1.385;
tg.add(goldRing);

const bc = document.createElement('canvas');
bc.width = 1024;
bc.height = 512;
const bx = bc.getContext('2d');
const bt = new THREE.CanvasTexture(bc);
bt.encoding = THREE.sRGBEncoding;

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBoard() {
  const bg = bx.createLinearGradient(0, 0, 0, 512);
  bg.addColorStop(0, '#101a3c');
  bg.addColorStop(1, '#0a0f24');
  bx.fillStyle = bg;
  bx.fillRect(0, 0, 1024, 512);

  bx.strokeStyle = '#c99b3f';
  bx.lineWidth = 6;
  rr(bx, 8, 8, 1008, 496, 18);
  bx.stroke();

  bx.fillStyle = '#c99b3f';
  rr(bx, 60, 22, 904, 66, 12);
  bx.fill();
  bx.fillStyle = '#171204';
  bx.font = 'bold 36px Arial';
  bx.textAlign = 'center';
  bx.fillText(QUESTION, 512, 66);

  const maxPts = ANSWERS[0][1];
  ANSWERS.forEach((a, i) => {
    const y = 106 + i * 39;
    const on = i < rv;
    rr(bx, 60, y, 904, 32, 9);
    bx.fillStyle = on ? '#ffb300' : '#18234d';
    bx.fill();
    if (!on) {
      bx.fillStyle = '#2a3a7a';
      rr(bx, 60, y, 904 * 0.98 * (a[1] / maxPts) + 18, 32, 9);
      bx.fill();
    }
    bx.fillStyle = on ? '#1b1b1b' : '#8fa0d8';
    bx.font = 'bold 24px Arial';
    bx.textAlign = 'left';
    bx.fillText(on ? a[0] : String(i + 1), 84, y + 24);
    if (on) {
      bx.textAlign = 'right';
      bx.fillText(String(a[1]), 942, y + 24);
    }
  });
  bt.needsUpdate = true;
}

const playerObjs = {};

function syncPlayerObjects(list) {
  const ids = new Set(list.map((p) => p.id));
  Object.keys(playerObjs).forEach((id) => {
    if (!ids.has(id)) {
      const g = playerObjs[id].group;
      if (g.parent) g.parent.remove(g);
      delete playerObjs[id];
    }
  });
  list.forEach((p) => {
    let o = playerObjs[p.id];
    const isMe = p.id === playerId;
    if (!o) {
      const g = makeChar(playerColors[p.colorIndex % playerColors.length], p.name, isMe);
      scene.add(g);
      o = playerObjs[p.id] = { group: g, name: p.name };
    }
    if (o.name !== p.name) {
      o.name = p.name;
      const old = o.group.getObjectByName('nameLabel');
      if (old) o.group.remove(old);
      o.group.add(makeLabel(p.name, isMe));
    }
  });
  layoutPlayers(list);
}

function layoutPlayers(list) {
  list.forEach((p, i) => {
    const o = playerObjs[p.id];
    if (!o) return;
    const g = o.group;
    if (mode === 'lobby') {
      if (g.parent !== scene) scene.add(g);
      const pos = lobbyPositions[i % lobbyPositions.length];
      g.position.set(pos[0], 0, pos[1]);
      g.userData.baseRot = 0;
      g.visible = true;
    } else if (i < TABLE_SEATS) {
      if (g.parent !== tg) tg.add(g);
      const pos = tablePlayerPositions[i];
      const a = pos.angle;
      g.position.set(Math.sin(a) * pos.radius, 0, Math.cos(a) * pos.radius);
      g.userData.baseRot = -a + Math.PI;
      g.visible = true;
    } else {
      g.visible = false;
    }
  });
}

function updateHint() {
  const started = state && state.started;
  if (!started) {
    $('h').textContent = isHost ? 'Partage le code de la salle pour inviter des joueurs' : "En attente du lancement par l'hôte...";
  } else {
    $('h').textContent = mode === 'lobby' ? 'Vue lobby' : (isHost ? 'Clique pour révéler les réponses' : 'Les réponses apparaissent au fil du jeu');
  }
}

function setMode(m) {
  mode = m;
  const lb = m === 'lobby';
  tg.visible = !lb;
  scene.background.set(lb ? 0x7a7aa0 : 0x080a18);
  scene.fog.color.set(lb ? 0x7a7aa0 : 0x080a18);
  hemi.intensity = lb ? 0.85 : 0.5;
  glow.visible = !lb;
  $('t').style.display = lb ? '' : 'none';
  $('b1').className = lb ? 'on' : '';
  $('b2').className = lb ? '' : 'on';
  updateHint();
  cam.position.set(0, lb ? 8 : 7, lb ? 12.5 : 11);
  cam.lookAt(0, lb ? 1.2 : 2, lb ? -2 : -1);
  if (state) layoutPlayers(state.players);
}

function setStatus(msg, isError) {
  const el = $('status');
  el.textContent = msg || '';
  el.className = isError ? 'err' : '';
}

function updatePlayersList(list) {
  const items = list.map((p) => {
    const me = p.id === playerId ? ' me' : '';
    const tag = p.id === state.hostId ? 'hôte' : '';
    return `<div class="p${me}">${escapeHtml(p.name)}<span class="tag">${tag}</span></div>`;
  }).join('');
  $('playersItems').innerHTML = items || '<div class="p">Aucun joueur</div>';
  $('c').textContent = list.length + '/' + MAX_PLAYERS;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function applyState(s) {
  state = s;
  rv = s.revealed || 0;
  drawBoard();
  updatePlayersList(s.players);
  syncPlayerObjects(s.players);
  $('roomCodeLabel').textContent = roomId || '-----';
  $('startBtn').style.display = (isHost && !s.started) ? 'block' : 'none';
  $('b').style.display = s.started ? 'block' : 'none';
  if (s.started && mode !== 'table') setMode('table');
  if (!s.started && mode !== 'lobby') setMode('lobby');
  $('b1').className = mode === 'lobby' ? 'on' : '';
  $('b2').className = mode === 'table' ? 'on' : '';
  updateHint();
}

function sanitizeName(v) {
  const n = (v || '').trim().replace(/\s+/g, ' ').slice(0, 16);
  return n || 'Joueur';
}

function genRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 5; i++) s += chars[Math.random() * chars.length | 0];
  return s;
}

let client = null;
let connected = false;
let busy = false;
let joinTimer = null;
let heartbeatTimer = null;
let watchdogTimer = null;
let lastStateTs = 0;

function stateTopic() { return TOPIC_BASE + roomId + '/state'; }
function eventsTopic() { return TOPIC_BASE + roomId + '/events'; }

function publishState() {
  if (!client || !connected || !state) return;
  state.ts = Date.now();
  client.publish(stateTopic(), JSON.stringify(state), { qos: 0, retain: true });
}

function publishEvent(ev) {
  if (!client || !connected) return;
  client.publish(eventsTopic(), JSON.stringify(ev), { qos: 0 });
}

function mqttConnect(onReady) {
  if (typeof mqtt === 'undefined') {
    busy = false;
    setStatus('Impossible de charger la librairie réseau. Vérifie ta connexion.', true);
    return;
  }
  if (client) {
    if (connected) { onReady(); return; }
    try { client.end(true); } catch (e) {}
    client = null;
    connected = false;
  }
  setStatus('Connexion au serveur...');
  const myClient = mqtt.connect(MQTT_URL, {
    clientId: 'cq3d_' + Math.random().toString(16).slice(2, 12),
    connectTimeout: 12000,
    reconnectPeriod: 3000,
    clean: true,
    protocolVersion: 4
  });
  client = myClient;
  myClient.on('connect', () => {
    if (client !== myClient) return;
    connected = true;
    onReady();
  });
  myClient.on('close', () => { if (client === myClient) connected = false; });
  myClient.on('error', (e) => {
    if (client !== myClient) return;
    busy = false;
    setStatus('Erreur réseau : ' + (e && e.message ? e.message : 'connexion impossible'), true);
  });
  myClient.on('message', (topic, payload) => {
    if (client !== myClient) return;
    onMessage(topic, payload);
  });
}

function onMessage(topic, payload) {
  let msg;
  try { msg = JSON.parse(payload.toString()); } catch (e) { return; }
  if (!msg || !roomId) return;
  if (topic === stateTopic()) {
    if (!isHost) handleIncomingState(msg);
  } else if (topic === eventsTopic()) {
    if (isHost) {
      handleEvent(msg);
    } else if (msg.type === 'closed') {
      setStatus("L'hôte a fermé la salle.", true);
      leaveRoom();
    }
  }
}

function handleEvent(msg) {
  if (!state) return;
  if (msg.type === 'join') {
    const existing = state.players.find((p) => p.id === msg.id);
    if (existing) {
      existing.name = sanitizeName(msg.name);
    } else if (state.players.length < MAX_PLAYERS) {
      const used = new Set(state.players.map((p) => p.colorIndex));
      let ci = 0;
      while (used.has(ci) && ci < playerColors.length) ci++;
      state.players.push({ id: msg.id, name: sanitizeName(msg.name), colorIndex: ci % playerColors.length });
    }
    publishState();
    applyState(state);
  } else if (msg.type === 'leave') {
    state.players = state.players.filter((p) => p.id !== msg.id);
    publishState();
    applyState(state);
  } else if (msg.type === 'ping') {
    publishState();
  }
}

function handleIncomingState(msg) {
  if (!msg.players) return;
  if (msg.ts && Date.now() - msg.ts > 60000) {
    setStatus('Salle expirée ou hôte hors ligne.', true);
    return;
  }
  lastStateTs = Date.now();
  applyState(msg);
  if (joinTimer && msg.players.some((p) => p.id === playerId)) {
    clearInterval(joinTimer);
    joinTimer = null;
  }
  setStatus('Connecté — salle ' + roomId);
}

function enterRoomUI() {
  $('roomPanel').style.display = 'none';
  $('roomInfo').style.display = 'block';
  $('playersList').style.display = 'block';
  $('leaveBtn').style.display = 'block';
  $('roomCodeLabel').textContent = roomId;
}

function createRoom() {
  if (busy) return;
  playerName = sanitizeName($('nameInput').value);
  localStorage.setItem('cq3d_name', playerName);
  busy = true;
  setStatus('Création de la salle...');
  mqttConnect(() => {
    busy = false;
    isHost = true;
    roomId = genRoomCode();
    state = {
      hostId: playerId,
      hostName: playerName,
      players: [{ id: playerId, name: playerName, colorIndex: 0 }],
      started: false,
      revealed: 0,
      ts: Date.now()
    };
    client.subscribe(eventsTopic(), { qos: 0 }, () => {
      publishState();
      startHeartbeat();
      startWatchdog();
    });
    enterRoomUI();
    setStatus('Salle créée. Partage le code ' + roomId + '.');
    applyState(state);
    history.replaceState(null, '', '?room=' + roomId);
  });
}

function joinRoom(code) {
  if (busy) return;
  const clean = (code || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (clean.length < 4) { setStatus('Entre un code de salle valide.', true); return; }
  playerName = sanitizeName($('nameInput').value);
  localStorage.setItem('cq3d_name', playerName);
  busy = true;
  setStatus('Connexion à la salle ' + clean + '...');
  mqttConnect(() => {
    busy = false;
    isHost = false;
    roomId = clean;
    client.subscribe([stateTopic(), eventsTopic()], { qos: 0 }, () => {
      sendJoin();
      joinTimer = setInterval(sendJoin, 2500);
      startWatchdog();
    });
    enterRoomUI();
    history.replaceState(null, '', '?room=' + roomId);
    setTimeout(() => {
      if (!state) {
        setStatus('Salle introuvable ou hôte hors ligne. Vérifie le code.', true);
        if (joinTimer) { clearInterval(joinTimer); joinTimer = null; }
      }
    }, 9000);
  });
}

function sendJoin() {
  publishEvent({ type: 'join', id: playerId, name: playerName });
}

function startGame() {
  if (!isHost || !state) return;
  state.started = true;
  state.revealed = 0;
  publishState();
  applyState(state);
}

function reveal() {
  if (!isHost || !state || !state.started) return;
  state.revealed = (state.revealed + 1) % (ANSWERS.length + 1);
  publishState();
  applyState(state);
}

function startHeartbeat() {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(() => { if (isHost) publishState(); }, 3000);
}

function startWatchdog() {
  if (watchdogTimer) clearInterval(watchdogTimer);
  watchdogTimer = setInterval(() => {
    if (!isHost && roomId && lastStateTs && Date.now() - lastStateTs > 12000) {
      setStatus('Hôte déconnecté.', true);
    }
  }, 4000);
}

function leaveRoom() {
  const oldClient = client;
  const oldRoom = roomId;
  const oldHost = isHost;
  const wasConnected = connected;

  if (joinTimer) { clearInterval(joinTimer); joinTimer = null; }
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
  if (watchdogTimer) { clearInterval(watchdogTimer); watchdogTimer = null; }
  client = null;
  connected = false;

  if (oldClient && wasConnected && oldRoom) {
    let ended = false;
    const finish = () => {
      if (ended) return;
      ended = true;
      try { oldClient.end(true); } catch (e) {}
    };
    if (oldHost) {
      oldClient.publish(TOPIC_BASE + oldRoom + '/state', '', { qos: 1, retain: true }, finish);
      oldClient.publish(TOPIC_BASE + oldRoom + '/events', JSON.stringify({ type: 'closed' }), { qos: 0 });
    } else {
      oldClient.publish(TOPIC_BASE + oldRoom + '/events', JSON.stringify({ type: 'leave', id: playerId }), { qos: 1 }, finish);
    }
    setTimeout(finish, 1500);
  }

  isHost = false;
  roomId = null;
  state = null;
  rv = 0;
  Object.keys(playerObjs).forEach((id) => {
    const g = playerObjs[id].group;
    if (g.parent) g.parent.remove(g);
    delete playerObjs[id];
  });
  $('roomPanel').style.display = 'block';
  $('roomInfo').style.display = 'none';
  $('playersList').style.display = 'none';
  $('leaveBtn').style.display = 'none';
  $('startBtn').style.display = 'none';
  $('b').style.display = 'none';
  $('playersItems').innerHTML = '';
  $('c').textContent = '0/' + MAX_PLAYERS;
  setStatus('');
  drawBoard();
  setMode('lobby');
  history.replaceState(null, '', location.pathname);
}

$('createBtn').onclick = createRoom;
$('joinBtn').onclick = () => joinRoom($('roomInput').value);
$('roomInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom($('roomInput').value); });
$('nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') createRoom(); });
$('startBtn').onclick = startGame;
$('leaveBtn').onclick = leaveRoom;
$('b1').onclick = () => { if (state && state.started) setMode('lobby'); };
$('b2').onclick = () => { if (state && state.started) setMode('table'); };
$('copyBtn').onclick = () => {
  if (!roomId) return;
  const url = location.origin + location.pathname + '?room=' + roomId;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(roomId).then(() => setStatus('Code copié : ' + roomId)).catch(() => setStatus('Code : ' + roomId));
  } else {
    setStatus('Code : ' + roomId);
  }
};

let mx = 0;
addEventListener('pointermove', (e) => {
  mx = (e.clientX / innerWidth - 0.5) * 2;
});

addEventListener('pointerdown', (e) => {
  if (e.target.closest && e.target.closest('button,input,.panel,#playersList,#roomInfo')) return;
  if (mode === 'table' && isHost && state && state.started) reveal();
});

addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  ren.setSize(innerWidth, innerHeight);
});

addEventListener('pagehide', () => {
  if (client && connected && roomId) {
    if (!isHost) publishEvent({ type: 'leave', id: playerId });
  }
});

const savedName = localStorage.getItem('cq3d_name');
if (savedName) $('nameInput').value = savedName;
const params = new URLSearchParams(location.search);
if (params.get('room')) $('roomInput').value = params.get('room').toUpperCase();

$('b').style.display = 'none';
$('roomPanel').style.display = 'block';
setMode('lobby');

const clk = new THREE.Clock();
(function loop() {
  const t = clk.getElapsedTime();
  Object.values(playerObjs).forEach((o) => {
    const p = o.group;
    const u = p.userData;
    const br = Math.sin(t * 1.6 + u.ph);
    if (u.torso) u.torso.scale.set(1 + br * 0.015, 1.55, 0.72 + br * 0.01);
    if (u.head) u.head.position.y = 1.58 + br * 0.006;
    p.position.y = Math.abs(Math.sin(t * 1.5 + u.ph)) * 0.012;
    p.rotation.z = Math.sin(t * 0.55 + u.ph) * 0.018;
    if (u.arms) {
      u.arms[0].rotation.z = 0.85 + Math.sin(t * 1.3 + u.ph) * 0.025;
      u.arms[0].rotation.y = 0.18;
      u.arms[1].rotation.z = -0.75 - Math.sin(t * 1.3 + u.ph) * 0.025;
      u.arms[1].rotation.y = -0.18;
    }
    if (u.legs) {
      // jambes statiques, bien ancrées au sol
    }
    p.rotation.y = (u.baseRot || 0) + Math.sin(t * 0.5 + u.ph) * 0.08;
  });
  cam.position.x += ((mx * 2.5) - cam.position.x) * 0.05;
  if (mode === 'lobby') cam.lookAt(0, 1.2, -2);
  else cam.lookAt(0, 2, -1);
  ren.render(scene, cam);
  requestAnimationFrame(loop);
})();
