<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz 3D – CREATOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="stage"></div>
<div id="intro"></div>

<section id="join" class="card ui"><div class="logo">CREATOR</div><p>Quiz 3D multijoueur : crée une salle et partage le code, ou rejoins-en une.</p>
  <input id="nameInput" maxlength="16" placeholder="Ton pseudo" autocomplete="nickname">
  <button id="createBtn">Créer une salle</button><div class="sep">ou</div>
  <input id="roomInput" maxlength="5" placeholder="Code de la salle" style="text-transform:uppercase">
  <button id="joinBtn" class="blue">Rejoindre</button><div id="status"></div></section>

<header id="hud" class="ui" hidden><button id="leaveBtn" class="ghost">← Quitter</button>
  <div class="card chip">Salle <b id="code">-----</b><button id="copyBtn" class="blue">Copier le lien</button></div></header>
<aside id="players" class="card ui" hidden><div id="plist"></div></aside>

<div id="lobbyBar" class="ui" hidden><span id="lobbyTxt">En attente de joueurs…</span>
  <button id="startBtn">Lancer la partie</button><span id="waitHost" style="font-size:14px;font-weight:600">L’hôte va lancer la partie…</span></div>

<section id="qpanel" class="card ui" hidden><div id="qnum"></div><div id="qtext"></div>
  <div id="timer"><div><span id="bar" style="display:block"></span></div><span id="secs"></span></div>
  <div id="answers"></div><div id="feedback"></div><button id="nextBtn" hidden>Question suivante ▶</button></section>

<section id="end" class="ui" hidden><div class="card"><h2>Classement final 🏆</h2><div id="lb"></div>
  <div class="row"><button id="replayBtn" hidden>Rejouer</button><button id="closeEnd" class="ghost">Fermer</button></div></div></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script type="module" src="js/main.js"></script>
</body></html>
