<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CREATOR — Guess Their Answer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F7FF;
  --soft: #EAF0FF;
  --ink: #0B1020;
  --blue: #0033FF;
  --mint: #00E5A0;
  --org: #FF5C35;
  --yellow: #FFC107;
  --card: #FFFFFF;
  --shadow: 4px 4px 0px var(--ink);
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1020;
    --soft: #18203A;
    --ink: #F4F7FF;
    --card: #151D3B;
    --shadow: 4px 4px 0px var(--blue);
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 600 16px/1.4 Poppins, system-ui, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
main { max-width: 1000px; margin: 0 auto; padding: 18px 16px 40px; position: relative; z-index: 2; }
section { display: none; }
section.on { display: block; animation: popIn 0.3s ease-out; }
@keyframes popIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

h1 {
  font-size: clamp(2rem, 6vw, 3.4rem);
  line-height: 1.05;
  margin: .2em 0;
  font-weight: 900;
  color: var(--blue);
  text-transform: uppercase;
  letter-spacing: -1px;
}
h2 { font-size: 1.5rem; font-weight: 800; margin: 0.5em 0; color: var(--blue); }
.mute { color: #6b7280; font-weight: 600; }
.pill {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 99px;
  background: var(--mint);
  color: #0B1020;
  font-weight: 800;
  font-size: .8rem;
  border: 2px solid var(--ink);
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px;
  margin: 12px 0;
  border: 3px solid var(--ink);
  box-shadow: var(--shadow);
}
.btn {
  display: block;
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: 3px solid var(--ink);
  border-radius: var(--radius);
  font: 800 1rem Poppins, system-ui, sans-serif;
  cursor: pointer;
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--shadow);
  transition: transform 0.1s, box-shadow 0.1s;
}
.btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--ink); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.blue { background: var(--blue); color: white; }
.btn.mint { background: var(--mint); color: #0B1020; }
.btn.org { background: var(--org); color: white; }
.btn.ghost { background: transparent; border-color: var(--blue); color: var(--blue); box-shadow: none; }
.btn.ghost:hover { background: var(--blue); color: white; }

.hero {
  background: var(--blue);
  color: white;
  border-radius: var(--radius);
  padding: 26px;
  margin: 12px 0;
  display: flex;
  gap: 16px;
  align-items: center;
  justify-content: space-between;
  border: 3px solid var(--ink);
  box-shadow: var(--shadow);
}
.hero h1 { color: white; }
.hero p { margin: .3em 0; color: #cfd8ff; font-size: 1.1rem; }
.hero svg { flex: 0 0 auto; width: min(36vw, 190px); }

input {
  width: 100%;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 3px solid var(--ink);
  background: var(--card);
  color: var(--ink);
  font: 700 1.05rem Poppins, system-ui, sans-serif;
  margin-top: 8px;
  outline: none;
  box-shadow: var(--shadow);
}
input:focus { border-color: var(--blue); }

.code {
  font-size: clamp(3rem, 12vw, 6rem);
  font-weight: 900;
  letter-spacing: .15em;
  color: var(--blue);
  margin: 0;
  text-shadow: 3px 3px 0 var(--mint);
}

.q { font-size: clamp(1.5rem, 4.5vw, 2.6rem); font-weight: 900; margin: .2em 0; color: var(--ink); }
.bar {
  height: 16px;
  background: var(--card);
  border-radius: 99px;
  overflow: hidden;
  margin: 10px 0;
  border: 3px solid var(--ink);
}
.bar i { display: block; height: 100%; width: 100%; background: var(--mint); transition: width 1s linear; }

.pop-meter { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
.pop-bar {
  flex: 1;
  height: 24px;
  background: var(--card);
  border-radius: 99px;
  overflow: hidden;
  border: 3px solid var(--ink);
  position: relative;
}
.pop-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--org), var(--yellow));
  width: 0%;
  transition: width 0.9s cubic-bezier(.2, .8, .2, 1);
}
.pop-text { font-weight: 900; font-size: 1.2rem; color: var(--blue); min-width: 56px; text-align: right; }

.slot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  margin: 8px 0;
  border-radius: var(--radius);
  background: var(--card);
  font-weight: 800;
  font-size: 1.15rem;
  border: 3px solid var(--ink);
  box-shadow: var(--shadow);
}
.slot.top { background: var(--mint); color: #0B1020; }
.slot .name { font-size: 0.8rem; color: #4b5563; display: block; font-weight: 700; }

.pl {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  margin: 6px 0;
  border-radius: var(--radius);
  background: var(--card);
  border: 2px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
}
.pl svg { width: 44px; height: 44px; flex: 0 0 auto; }
.pl span { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.pl b { color: var(--blue); font-size: 1.2rem; }
.pl em { font-style: normal; color: var(--org); font-weight: 800; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.grid .pl { margin: 0; flex-direction: column; text-align: center; }
.grid .pl svg { width: 64px; height: 64px; }

.big { font-size: 3.2rem; font-weight: 900; margin: .1em 0; color: var(--blue); }
.msg { color: var(--org); font-weight: 800; min-height: 1.4em; }

.sw { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 14px; }
.dot {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 3px solid var(--ink);
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--ink);
  transition: transform 0.1s;
}
.dot:active { transform: scale(0.9); }
.dot.sel { border-color: var(--blue); transform: scale(1.15); box-shadow: 0 0 0 3px var(--blue); }
.chip {
  padding: 8px 14px;
  border-radius: 99px;
  border: 3px solid var(--ink);
  background: var(--card);
  color: var(--ink);
  font: 700 .85rem Poppins, system-ui, sans-serif;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--ink);
}
.chip.sel { background: var(--blue); color: white; }

#c3 { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
body.g3 main { padding-bottom: 42vh; }

#wFox, #eFox { display: none; }
</style>
</head>
<body>

<main>

<!-- ÉCRAN ACCUEIL -->
<section id="home" class="on">
 <div class="hero">
   <div>
     <span class="pill">CREATOR · Epitech Bénin</span>

 </div>
 <div class="row" style="display:flex; gap:10px;">
   <button class="btn mint" id="bHost">Animer (écran projeté)</button>

 </div>

 </div>

<section id="pGame">
 <div class="row" style="display:flex; justify-content:space-between">
   <span class="pill" id="pProg"></span>
   <span class="pill" id="pMult" style="background:var(--org);color:#fff"></span>
 </div>

</section>

<section id="pRes">
  <div class="card" style="text-align:center">
    <p id="rTxt" style="font-size: 1.2rem; font-weight: 800; margin-bottom: 20px;"></p>

      <div class="pop-bar"><div class="pop-fill" id="rPopBar"></div></div>

  </div>
</section>

</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/three.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const QS = [
  ["Nomme un langage de programmation", [["python", 35], ["javascript", 30], ["html", 15], ["java", 10], ["c", 10]]],
  ["Nomme un réseau social", [["whatsapp", 40], ["facebook", 25], ["tiktok", 20], ["instagram", 10], ["twitter", 5]]],
  ["Nomme un framework JavaScript", [["react", 45], ["vue", 25], ["angular", 15], ["svelte", 10], ["jquery", 5]]],
  ["Nomme un éditeur de code", [["vscode|vs code", 60], ["sublime", 15], ["vim", 10], ["intellij", 10], ["atom", 5]]],
  ["Nomme un moyen de transport à Cotonou", [["zem|zémidjan", 50], ["taxi", 20], ["bus", 15], ["moto", 10], ["voiture", 5]]],
  ["Nomme un plat béninois", [["pate|pâte", 40], ["riz", 25], ["igname", 15], ["haricot", 10], ["alloco", 10]]],
  ["Nomme un code HTTP", [["404", 40], ["200", 30], ["500", 15], ["403", 10], ["301", 5]]],
  ["Nomme une balise HTML", [["div", 35], ["p", 25], ["a", 15], ["img", 15], ["span", 10]]],
  ["Nomme un outil d'IA pour coder", [["chatgpt|chat gpt", 50], ["copilot", 30], ["claude", 15], ["gemini", 5]]],
  ["Nomme un fruit tropical", [["mangue", 40], ["ananas", 25], ["banane", 15], ["coco", 10], ["papaye", 10]]]
];

const HOODS = ["#0033FF", "#00B87A", "#FF5C35", "#8B5CF6", "#FFC107"];
const ACCS = ["Aucun", "Lunettes", "Casquette", "Casque"];
const DUR = 15;

const norm = (s) => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();

function lev(a, b) {
  const d = [...Array(b.length + 1).keys()];
  for (let i = 1; i <= a.length; i++) {
    let p = d[0];
    d[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const t = d[j];
      d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] !== b[j - 1]));
      p = t;
    }
  }
  return d[b.length];
}

function findMatch(text, answers) {
  const n = norm(text);
  if (!n) return -1;
  for (let i = 0; i < answers.length; i++) {
    for (const key of answers[i][0].split("|").map(norm)) {
      if (n === key) return i;
      if (n.length >= 3 && key.length >= 3 && (n.includes(key) || key.includes(n))) return i;
      if (n.length >= 4 && key.length >= 4 && lev(n, key) <= 1) return i;
    }
  }
  return -1;
}

function fox(h = 0, a = 0) {
  const c = HOODS[h % 5];
  let x = "";
  if (a === 1) x = '<g fill="none" stroke="#111827" stroke-width="2.5"><circle cx="39" cy="44" r="8"/><circle cx="61" cy="44" r="8"/><path d="M47 44h6"/></g>';
  if (a === 2) x = '<path d="M22 32Q50 4 78 32Z" fill="#00E5A0"/><rect x="18" y="30" width="64" height="6" rx="3" fill="#00B87A"/>';
  if (a === 3) x = '<path d="M20 46Q20 12 50 12Q80 12 80 46" fill="none" stroke="#111827" stroke-width="5"/><rect x="13" y="40" width="10" height="18" rx="5" fill="#FF5C35"/><rect x="77" y="40" width="10" height="18" rx="5" fill="#FF5C35"/>';
  return `<svg viewBox="0 0 100 100"><path d="M16 100Q18 66 50 62Q82 66 84 100Z" fill="${c}"/><path d="M44 66v14M56 66v14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><path d="M20 10L40 34L16 42Z M80 10L60 34L84 42Z" fill="#FF7A1A"/><path d="M24 18L35 33L22 37Z M76 18L65 33L78 37Z" fill="#FFE6D0"/><ellipse cx="50" cy="46" rx="31" ry="26" fill="#FF7A1A"/><path d="M22 52Q50 82 78 52Q50 44 22 52Z" fill="#FFF3E6"/><circle cx="39" cy="44" r="4.5" fill="#111827"/><circle cx="61" cy="44" r="4.5" fill="#111827"/><circle cx="40.5" cy="42.5" r="1.4" fill="#fff"/><circle cx="62.5" cy="42.5" r="1.4" fill="#fff"/><ellipse cx="50" cy="58" rx="5" ry="3.5" fill="#111827"/><path d="M44 64Q50 69 56 64" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round"/>${x}</svg>`;
}

function show(id) {
  document.querySelectorAll("section").forEach((s) => s.classList.toggle("on", s.id === id));
}

const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};

const playerId = (() => {
  let id = store.get("gta-pid");
  if (!id) {
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "p" + Date.now() + Math.random().toString(16).slice(2);
    store.set("gta-pid", id);
  }
  return id;
})();

const socket = typeof io === "function" ? io() : null;

function makeRoom(connection) {
  const handlers = new Map();
  const peerCallbacks = [];
  let myId = null;
  let peerList = [];

  connection.on("peers", (list) => {
    peerList = (Array.isArray(list) ? list : []).map((p) => ({
      peer: p.peer,
      presence: p.presence || {},
      isMe: p.peer === myId
    }));
    peerCallbacks.slice().forEach((fn) => { try { fn(); } catch (e) {} });
  });

  connection.on("event", (message) => {
    if (!message) return;
    const list = handlers.get(message.event);
    if (!list) return;
    list.slice().forEach((fn) => {
      try { fn({ peer: message.peer, data: message.data }); } catch (e) {}
    });
  });

  return {
    join(roomId) {
      return new Promise((resolve, reject) => {
        let settled = false;
        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          reject(new Error("timeout"));
        }, 6000);
        connection.emit("join", { room: roomId, presence: {} }, (ack) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (!ack || !ack.ok) {
            reject(new Error("join"));
            return;
          }
          myId = ack.id;
          resolve();
        });
      });
    },
    presence(data) { connection.emit("presence", data); },
    peers() { return peerList; },
    onPeers(fn) { peerCallbacks.push(fn); },
    on(event, fn) {
      if (!handlers.has(event)) handlers.set(event, []);
      handlers.get(event).push(fn);
    },
    emit(event, data) { connection.emit("emit", { event, data }); },
    leave() {
      connection.emit("leave");
      myId = null;
      peerList = [];
      handlers.clear();
      peerCallbacks.length = 0;
    }
  };
}

const net = socket ? makeRoom(socket) : null;

let R = net;
let room = null;
const me = {
  name: store.get("gta-name") || "",
  h: +store.get("gta-h") || 0,
  a: +store.get("gta-a") || 0
};

$("heroFox").innerHTML = fox(0, 1);

function renderLeaderboard(list) {
  if (!Array.isArray(list) || !list.length) {
    $("lb").innerHTML = '<p class="mute">Personne encore. Sois le premier !</p>';
    return;
  }
  $("lb").innerHTML = list.map((v, i) => (
    `<div class="pl"><b>${i + 1}</b>${fox(v.h | 0, v.a | 0)}<span>${esc(v.name || "?")}</span><b>${Number(v.score) | 0} pts</b></div>`
  )).join("");
}

if (socket) {
  socket.on("leaderboard", renderLeaderboard);
  socket.on("connect", () => {
    if ($("homeMsg").textContent.indexOf("Serveur") === 0) $("homeMsg").textContent = "";
  });
} else {
  $("lb").innerHTML = '<p class="mute">Serveur non connecté. Lance <code>node server.js</code>.</p>';
  $("homeMsg").textContent = "Serveur non connecté. Lance node server.js puis ouvre http://localhost:3000.";
}

const need = () => {
  if (!socket) {
    $("homeMsg").textContent = "Serveur non connecté. Lance node server.js puis ouvre http://localhost:3000.";
    return false;
  }
  return true;
};

$("bHome1").onclick = $("bHome2").onclick = () => {
  DEMO = 0;
  clearInterval(tm);
  if (room) room.leave();
  room = null;
  show("home");
};

/* ===== ANIMATEUR ===== */
let st = { n: 0 };
let answers = {};
let scores = {};
let names = {};
let qi = 0;
let tm = null;
let code = "";
let DEMO = 0;

const players = () => room.peers().filter((p) => p.presence && p.presence.role === "player" && !p.isMe);
function setSt(p) {
  st = { ...st, n: st.n + 1, ...p };
  room.presence({ st });
}

$("bHost").onclick = async () => {
  if (!need()) return;
  if (room) room.leave();
  code = Array.from({ length: 4 }, () => "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.random() * 24 | 0]).join("");
  room = R;
  try {
    await room.join("gta-" + code);
  } catch (e) {
    $("homeMsg").textContent = "Impossible d’ouvrir la salle.";
    room = null;
    return;
  }
  st = { n: 0, ph: "lobby" };
  answers = {};
  scores = {};
  names = {};
  await room.presence({ role: "host", st });
  room.onPeers(() => {
    players().forEach((p) => {
      names[p.peer] = {
        name: p.presence.name || "?",
        h: p.presence.h | 0,
        a: p.presence.a | 0
      };
    });
    if (st.ph === "lobby") lobby();
    else if (st.ph === "q") stat();
  });
  room.on("ans", onAns);
  $("hCode").textContent = code;
  lobby();
  show("hLobby");
};

function lobby() {
  const p = players();
  $("hCount").textContent = p.length + (p.length > 1 ? " joueurs" : " joueur");
  $("hPlayers").innerHTML = p.map((x) => (
    `<div class="pl">${fox(x.presence.h, x.presence.a)}<span>${esc(x.presence.name || "?")}</span></div>`
  )).join("");
}

$("bStart").onclick = () => {
  if (!players().length) {
    $("hCount").textContent = "Attends au moins 1 joueur…";
    return;
  }
  scores = {};
  qi = 0;
  nextQ();
};

function nextQ() {
  answers = {};
  clearInterval(tm);
  setSt({ ph: "q", qi, dur: DUR, res: null });
  if (DEMO) bots();

  const [q, A] = QS[qi];
  $("hProg").textContent = `Question ${qi + 1}/10`;
  $("hMult").textContent = "Trouve la réponse la plus populaire !";
  $("hMult").style.display = "block";
  $("hQ").textContent = q;
  $("hBoard").innerHTML = A.map((_, k) => `<div class="slot"><span>${k + 1}. ????? </span><span>--%</span></div>`).join("");
  $("hRank").innerHTML = "";
  $("bNext").textContent = "Révéler les réponses";
  $("bNext").onclick = reveal;
  show("hGame");
  stat();

  let left = DUR;
  $("hBar").style.width = "100%";
  tm = setInterval(() => {
    left--;
    $("hBar").style.width = (left / DUR * 100) + "%";
    if (left <= 0) reveal();
  }, 1000);
}

function stat() {
  $("hStat").textContent = `${Object.keys(answers).length}/${players().length} ont répondu`;
}

function onAns(m) {
  if (st.ph !== "q" || !m.data || m.data.qi !== qi || answers[m.peer]) return;
  answers[m.peer] = String(m.data.text || "").slice(0, 40);
  stat();
  if (Object.keys(answers).length >= players().length) reveal();
}

function reveal() {
  if (st.ph !== "q") return;
  clearInterval(tm);

  const A = QS[qi][1];
  const res = {};
  Object.entries(answers).forEach(([p, t]) => {
    const h = findMatch(t, A);
    const pts = h >= 0 ? A[h][1] * 10 : 0;
    scores[p] = (scores[p] || 0) + pts;
    res[p] = { h, pts, txt: t };
  });

  setSt({ ph: "r", res, sc: scores });

  $("hBoard").innerHTML = A.map((r, k) => {
    const w = Object.entries(res).filter(([, v]) => v.h === k).map(([p]) => names[p] ? names[p].name : "").filter(Boolean).join(", ");
    return `<div class="slot ${k < 3 ? "top" : ""}"><span>${k + 1}. ${esc(r[0].split("|")[0])}${w ? `<span class="name">· ${esc(w)}</span>` : ""}</span><span>${r[1]}%</span></div>`;
  }).join("");

  $("hRank").innerHTML = ranked().map((r, i) => (
    `<div class="pl"><b>${i + 1}</b>${fox(r.h, r.a)}<span>${esc(r.name)}</span><b>${r.s} pts</b></div>`
  )).join("");

  $("bNext").textContent = qi >= 9 ? "Voir le podium" : "Question suivante";
  if (DEMO) setTimeout(() => { if (DEMO && st.ph === "r") $("bNext").click(); }, 3500);
  $("bNext").onclick = () => {
    if (qi >= 9) endGame();
    else { qi++; nextQ(); }
  };
}

function ranked() {
  return Object.keys(names)
    .map((p) => ({ p, ...names[p], s: scores[p] || 0 }))
    .sort((a, b) => b.s - a.s);
}

function endGame() {
  setSt({ ph: "end", sc: scores });
  $("hPodium").innerHTML = ranked().map((r, i) => (
    `<div class="pl" style="${i < 3 ? "background:var(--soft);padding:14px;border:3px solid var(--blue)" : ""}"><b>${["🥇", "🥈", "🥉"][i] || i + 1}</b>${fox(r.h, r.a)}<span>${esc(r.name)}</span><b>${r.s} pts</b></div>`
  )).join("");
  show("hEnd");
}

function bots() {
  const A = QS[qi][1];
  const q = qi;
  players().forEach((x, i) => setTimeout(() => {
    if (!DEMO || st.ph !== "q" || qi !== q) return;
    const sk = [.9, .8, .7, .6, .5, .4][i % 6];
    const k = Math.random() < sk ? Math.floor(Math.random() * A.length) : Math.floor(Math.random() * 5);
    onAns({ peer: x.peer, data: { qi: q, text: k >= 0 && A[k] ? A[k][0].split("|")[0] : "bleu" } });
  }, 1000 + Math.random() * 4500));
}

$("bDemo").onclick = () => {
  if (room) room.leave();
  const B = [["Kossi", 0, 1], ["Aïcha", 1, 2], ["Fifamè", 2, 0], ["Yanick", 3, 3], ["Sènami", 4, 1], ["Rodrigue", 0, 2]];
  const pe = B.map((b, i) => ({ peer: "b" + i, isMe: false, presence: { role: "player", name: b[0], h: b[1], a: b[2] } }));
  room = { peers: () => pe, presence: () => {}, onPeers: () => {}, on: () => {}, emit: () => {}, leave: () => {} };
  DEMO = 1;
  code = "DEMO";
  st = { n: 0, ph: "lobby" };
  answers = {};
  scores = {};
  names = {};
  pe.forEach((p) => { names[p.peer] = { name: p.presence.name, h: p.presence.h, a: p.presence.a }; });
  $("hCode").textContent = "DEMO";
  show("hLobby");
  lobby();
  setTimeout(() => { if (DEMO && st.ph === "lobby") $("bStart").click(); }, 3500);
};

/* ===== JOUEUR ===== */
$("pName").value = me.name;

function pf() {
  $("pHoods").innerHTML = HOODS.map((c, i) => `<button type="button" class="dot${i === me.h ? " sel" : ""}" style="background:${c}" data-h="${i}"></button>`).join("");
  $("pAccs").innerHTML = ACCS.map((n, i) => `<button type="button" class="chip${i === me.a ? " sel" : ""}" data-a="${i}">${n}</button>`).join("");
}
pf();

$("bJoin").onclick = () => { if (need()) show("pJoin"); };
$("pHoods").onclick = (e) => {
  const b = e.target.closest("[data-h]");
  if (b) { me.h = +b.dataset.h; pf(); }
};
$("pAccs").onclick = (e) => {
  const b = e.target.closest("[data-a]");
  if (b) { me.a = +b.dataset.a; pf(); }
};

let seen = -1;
let pTm = null;
let sent = false;
let curQ = 0;

$("bGo").onclick = async () => {
  if (!need()) return;
  me.name = $("pName").value.trim() || "Joueur";
  const c = $("pCode").value.trim().toUpperCase();
  if (c.length !== 4) {
    $("pMsg").textContent = "Le code a 4 lettres.";
    return;
  }
  store.set("gta-name", me.name);
  store.set("gta-h", me.h);
  store.set("gta-a", me.a);
  if (room) room.leave();
  room = R;
  try {
    await room.join("gta-" + c);
  } catch (e) {
    $("pMsg").textContent = "Salle introuvable.";
    room = null;
    return;
  }
  await room.presence({ role: "player", name: me.name, h: me.h, a: me.a });
  seen = -1;
  $("wFox").innerHTML = fox(me.h, me.a);
  $("wName").textContent = me.name;
  show("pWait");

  const chk = () => {
    const hp = room.peers().find((p) => p.presence && p.presence.role === "host");
    if (!hp) {
      $("wTxt").textContent = "Animateur introuvable. Vérifie le code.";
      return;
    }
    const s = hp.presence.st;
    if (s && s.n !== seen) {
      seen = s.n;
      onState(s);
    }
  };
  room.onPeers(chk);
  chk();
};

const mine = () => {
  const m = room.peers().find((p) => p.isMe);
  return m && m.peer;
};

function onState(s) {
  clearInterval(pTm);

  if (s.ph === "lobby") {
    $("wTxt").textContent = "Tu es dans la salle. La partie va commencer !";
    show("pWait");
  } else if (s.ph === "q") {
    curQ = s.qi;
    sent = false;
    $("pProg").textContent = `Question ${s.qi + 1}/10`;
    $("pMult").textContent = "Trouve la réponse la plus populaire !";
    $("pQ").textContent = QS[s.qi][0];
    $("pAns").value = "";
    $("pAns").disabled = false;
    $("bSend").disabled = false;
    $("pInfo").textContent = "";
    show("pGame");
    $("pAns").focus();

    let left = s.dur;
    $("pBar").style.width = "100%";
    pTm = setInterval(() => {
      left--;
      $("pBar").style.width = (left / s.dur * 100) + "%";
      if (left <= 0) {
        clearInterval(pTm);
        lock("Temps écoulé…");
      }
    }, 1000);
  } else if (s.ph === "r") {
    const r = (s.res || {})[mine()];
    let popPct = 0;
    if (r && r.h >= 0) {
      const A = QS[s.qi][1];
      popPct = A[r.h][1];
    }
    $("rTxt").textContent = r ? (r.h >= 0 ? "Bonne réponse !" : "Réponse non trouvée…") : "Pas de réponse.";
    $("rPopBar").style.width = popPct + "%";
    $("rPopText").textContent = popPct + "%";

    const all = Object.values(s.sc || {}).sort((a, b) => b - a);
    const t = (s.sc || {})[mine()] || 0;
    $("rTot").textContent = `Total : ${t} pts · Rang ${all.indexOf(t) + 1}/${all.length || 1}`;
    show("pRes");
  } else if (s.ph === "end") {
    const sc = s.sc || {};
    const t = sc[mine()] || 0;
    const all = Object.values(sc).sort((a, b) => b - a);
    $("eFox").innerHTML = fox(me.h, me.a);
    $("eScore").textContent = t + " pts";
    $("eRank").textContent = `Tu termines n°${all.indexOf(t) + 1} sur ${all.length}`;
    show("pEnd");
    save(t);
  }
}

function lock(msg) {
  $("pAns").disabled = true;
  $("bSend").disabled = true;
  $("pInfo").textContent = msg;
}

$("bSend").onclick = () => {
  const t = $("pAns").value.trim();
  if (!t || sent) return;
  sent = true;
  room.emit("ans", { qi: curQ, text: t });
  lock("Réponse envoyée. Regarde l’écran !");
};
$("pAns").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("bSend").click();
});

function save(t) {
  if (!socket) return;
  socket.emit("score", { id: playerId, name: me.name, h: me.h, a: me.a, score: t });
}

/* ===== 3D DÉCORATIF ===== */
(function () {
  if (typeof THREE === "undefined") return;
  const rd = new THREE.WebGLRenderer({ canvas: $("c3"), alpha: true, antialias: true });
  rd.setPixelRatio(Math.min(devicePixelRatio, 2));
  const sc = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(40, 1, .1, 100);
  cam.position.set(0, 3, 8);
  sc.add(new THREE.AmbientLight(0xffffff, .8));
  const dl = new THREE.DirectionalLight(0xffffff, .9);
  dl.position.set(4, 8, 6);
  sc.add(dl);

  const M = (c, o) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: .7, ...o });
  const mesh = (g, m, x = 0, y = 0, z = 0) => {
    const o = new THREE.Mesh(g, m);
    o.position.set(x, y, z);
    return o;
  };

  const bg = new THREE.Group();
  sc.add(bg);
  const G = [new THREE.IcosahedronGeometry(.7, 0), new THREE.OctahedronGeometry(.7), new THREE.TorusGeometry(.5, .18, 8, 14)];
  const C4 = [0x0033FF, 0x00E5A0, 0xFF5C35, 0xFFC107];

  for (let i = 0; i < 26; i++) {
    const o = mesh(G[i % 3], M(C4[i % 4], { transparent: true, opacity: .5 }), (Math.random() - .5) * 28, Math.random() * 12 - 1, -4 - Math.random() * 10);
    o.userData = { s: Math.random() * .008 + .003, p: Math.random() * 6 };
    bg.add(o);
  }

  function size() {
    rd.setSize(innerWidth, innerHeight, false);
    cam.aspect = innerWidth / innerHeight;
    cam.updateProjectionMatrix();
  }
  addEventListener("resize", size);
  size();

  const clk = new THREE.Clock();
  (function loop() {
    const t = clk.getElapsedTime();
    bg.children.forEach((o) => {
      o.rotation.x += o.userData.s;
      o.rotation.y += o.userData.s * 1.4;
      o.position.y += Math.sin(t + o.userData.p) * .002;
    });
    cam.position.x += (Math.sin(t * .2) * 2 - cam.position.x) * .02;
    cam.lookAt(0, 1.5, 0);
    rd.render(sc, cam);
    requestAnimationFrame(loop);
  })();
})();
</script>
