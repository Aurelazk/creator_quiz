<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e15">
<title>CREATOR 3D — Quiz Room</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2218%22 y=%2210%22 width=%2228%22 height=%2280%22 rx=%226%22 fill=%22%2300ffa3%22/><rect x=%2254%22 y=%2210%22 width=%2228%22 height=%2280%22 rx=%226%22 fill=%22%23ff3355%22/></svg>">

<!-- Three.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- Socket.io -->
<script src="/socket.io/socket.io.js"></script>

<!-- Check if Three.js loaded -->
<script>
// Verify Three.js is loaded
if (typeof THREE === 'undefined') {
  document.addEventListener('DOMContentLoaded', function() {
    const errorMsg = document.createElement('div');
    errorMsg.style.cssText = `
      position: fixed;
      inset: 0;
      background: #0d0e15;
      color: #ff3355;
      font: 900 24px/1.5 var(--mono);
      text-align: center;
      padding: 50px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    `;
    errorMsg.innerHTML = `
      <h1 style="font-size: 48px;">⚠️ Three.js non chargé</h1>
      <p>Vérifiez votre connexion internet ou rechargez la page (Ctrl+F5)</p>
      <p>Si le problème persiste, Three.js peut être bloqué par votre navigateur</p>
      <button onclick="location.reload()" style="padding: 16px 32px; border: 2px solid #ff3355; color: #ff3355; background: transparent; font: 900 16px/1 var(--mono); cursor: pointer;">RECHARGER</button>
    `;
    document.body.prepend(errorMsg);
    // Hide loading screen
    const loading = document.getElementById('loading-screen');
    if (loading) loading.style.display = 'none';
  });
}
</script>

<style>
:root{
  --bg:#0d0e15;
  --bg-deep:#06070c;
  --panel:#10131f;
  --text:#eaf6ff;
  --muted:#7f8aa3;
  --green:#00ffa3;
  --green-soft:rgba(0,255,163,.55);
  --red:#ff3355;
  --red-soft:rgba(255,51,85,.55);
  --gold:#ffd166;
  --cyan:#38e8ff;
  --blue:#0033ff;
  --mint:#00e5a0;
  --org:#ff5c35;
  --purple:#8b5cf6;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI",Inter,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  margin:0;
  overflow:hidden;
  background:var(--bg-deep);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}

/* Three.js Canvas */
#three-container{
  position:fixed;
  inset:0;
  z-index:1;
}

/* UI Overlay */
#ui-overlay{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}

#main-menu {
  z-index: 100 !important;
  pointer-events: auto !important;
}

/* Loading Screen */
#loading-screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(4,5,9,.95);
  pointer-events:auto;
  transition:opacity .5s,visibility .5s;
}
#loading-screen.hidden{
  opacity:0;
  visibility:hidden;
}

.loading-spinner{
  width:60px;
  height:60px;
  border:3px solid rgba(56,232,255,.3);
  border-top-color:var(--cyan);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.loading-text{
  margin-top:16px;
  font:700 12px/1 var(--mono);
  letter-spacing:.2em;
  color:var(--muted);
  text-transform:uppercase;
}

/* Main Menu */
#main-menu{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
  pointer-events:auto;
}

.menu-title{
  font:900 clamp(1.8rem,4vw,2.8rem)/1 var(--sans);
  letter-spacing:.1em;
  color:#fff;
  text-shadow:0 0 20px rgba(56,232,255,.6),0 0 60px rgba(56,232,255,.3);
  text-transform:uppercase;
}

.menu-subtitle{
  font:700 11px/1 var(--mono);
  letter-spacing:.3em;
  color:var(--muted);
  text-transform:uppercase;
}

.menu-btn{
  padding:16px 40px;
  border:1px solid rgba(56,232,255,.4);
  border-radius:14px;
  background:linear-gradient(180deg,rgba(15,19,32,.85),rgba(8,10,17,.85));
  color:var(--cyan);
  font:900 14px/1 var(--mono);
  letter-spacing:.3em;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 0 20px rgba(56,232,255,.15),inset 0 0 20px rgba(56,232,255,.05);
  transition:all .3s ease;
  pointer-events:auto !important;
  z-index: 100 !important;
  position: relative !important;
}
.menu-btn:hover{
  border-color:var(--cyan);
  background:linear-gradient(180deg,rgba(0,255,163,.15),rgba(0,255,163,.05));
  box-shadow:0 0 30px rgba(56,232,255,.3),inset 0 0 30px rgba(56,232,255,.1);
  transform:translateY(-2px);
}
.menu-btn.secondary{
  border-color:rgba(255,51,85,.4);
  color:var(--red);
  box-shadow:0 0 20px rgba(255,51,85,.15),inset 0 0 20px rgba(255,51,85,.05);
}
.menu-btn.secondary:hover{
  border-color:var(--red);
  background:linear-gradient(180deg,rgba(255,51,85,.15),rgba(255,51,85,.05));
  box-shadow:0 0 30px rgba(255,51,85,.3),inset 0 0 30px rgba(255,51,85,.1);
}
.menu-btn.demo-btn{
  padding: 20px 50px !important;
  font-size: 16px !important;
  border: 3px solid rgba(255,209,102,.6) !important;
  color: var(--gold) !important;
  background: linear-gradient(180deg, rgba(255,209,102,.15), rgba(255,209,102,.05)) !important;
  box-shadow: 0 0 30px rgba(255,209,102,.3) !important;
  animation: pulse 1.5s ease-in-out infinite alternate !important;
  border-radius: 16px !important;
  letter-spacing: .3em !important;
}
.menu-btn.demo-btn:hover{
  border-color: var(--gold) !important;
  background: linear-gradient(180deg, rgba(255,209,102,.25), rgba(255,209,102,.1)) !important;
  box-shadow: 0 0 50px rgba(255,209,102,.5), 0 0 80px rgba(255,209,102,.3) !important;
  transform: scale(1.05) !important;
}
@keyframes pulse{
  from{transform:scale(1)}
  to{transform:scale(1.05)}
}

/* Join Form */
#join-form{
  display:flex;
  flex-direction:column;
  gap:16px;
  align-items:center;
  pointer-events:auto;
}

.form-input{
  padding:14px 20px;
  border:1px solid rgba(56,232,255,.3);
  border-radius:12px;
  background:rgba(15,19,32,.85);
  color:var(--text);
  font:700 13px/1 var(--mono);
  letter-spacing:.1em;
  width:280px;
  max-width:90vw;
  transition:all .3s ease;
}
.form-input::placeholder{
  color:var(--muted);
}
.form-input:focus{
  outline:none;
  border-color:var(--cyan);
  box-shadow:0 0 20px rgba(56,232,255,.2);
}

/* Room Code Display */
#room-code-display{
  text-align:center;
  pointer-events:auto;
}

.code-label{
  font:700 10px/1 var(--mono);
  letter-spacing:.3em;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:8px;
}

.code-value{
  font:900 clamp(2rem,6vw,3.5rem)/1 var(--mono);
  letter-spacing:.2em;
  color:var(--cyan);
  text-shadow:0 0 20px rgba(56,232,255,.6);
  padding:12px 24px;
  border:2px solid rgba(56,232,255,.3);
  border-radius:16px;
  background:rgba(0,0,0,.3);
}

/* Players List */
#players-list{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  margin-top:16px;
  pointer-events:auto;
}

.player-card{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;
  background:rgba(15,19,32,.7);
  box-shadow:0 0 12px rgba(0,0,0,.3);
}

.player-avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  border:2px solid;
}

.player-name{
  font:700 11px/1 var(--mono);
  letter-spacing:.1em;
  color:var(--text);
  text-transform:uppercase;
}

.player-score{
  font:900 12px/1 var(--mono);
  color:var(--gold);
  text-shadow:0 0 10px rgba(255,209,102,.5);
}

/* Start Button */
#start-btn{
  display:none;
  padding:16px 40px;
  border:1px solid var(--green);
  border-radius:14px;
  background:linear-gradient(180deg,rgba(0,255,163,.2),rgba(0,255,163,.05));
  color:var(--green);
  font:900 14px/1 var(--mono);
  letter-spacing:.3em;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 0 20px rgba(0,255,163,.3),inset 0 0 20px rgba(0,255,163,.1);
  transition:all .3s ease;
  pointer-events:auto;
}
#start-btn:hover{
  background:linear-gradient(180deg,rgba(0,255,163,.35),rgba(0,255,163,.1));
  box-shadow:0 0 30px rgba(0,255,163,.5),inset 0 0 30px rgba(0,255,163,.2);
}

/* Question Display */
#question-display{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  pointer-events:auto;
  display:none;
}

.question-number{
  font:700 10px/1 var(--mono);
  letter-spacing:.3em;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:8px;
}

.question-text{
  font:900 clamp(1.2rem,3vw,2rem)/1.1 var(--sans);
  letter-spacing:-.02em;
  color:#fff;
  text-shadow:0 0 20px rgba(56,232,255,.5);
  max-width:600px;
  padding:20px 30px;
  border:2px solid rgba(56,232,255,.4);
  border-radius:16px;
  background:rgba(15,19,32,.85);
}

/* Answer Input */
#answer-section{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  margin-top:20px;
  pointer-events:auto;
}

.answer-input{
  padding:14px 20px;
  border:1px solid rgba(0,255,163,.4);
  border-radius:12px;
  background:rgba(15,19,32,.85);
  color:var(--text);
  font:700 13px/1 var(--mono);
  width:280px;
  max-width:90vw;
  transition:all .3s ease;
}
.answer-input::placeholder{
  color:var(--muted);
}
.answer-input:focus{
  outline:none;
  border-color:var(--green);
  box-shadow:0 0 20px rgba(0,255,163,.2);
}

.submit-btn{
  padding:14px 32px;
  border:1px solid var(--green);
  border-radius:12px;
  background:linear-gradient(180deg,rgba(0,255,163,.2),rgba(0,255,163,.05));
  color:var(--green);
  font:900 13px/1 var(--mono);
  letter-spacing:.2em;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .3s ease;
}
.submit-btn:hover{
  background:linear-gradient(180deg,rgba(0,255,163,.35),rgba(0,255,163,.1));
  box-shadow:0 0 20px rgba(0,255,163,.3);
}

/* Timer */
#timer-display{
  position:absolute;
  top:20px;
  right:20px;
  padding:10px 16px;
  border:1px solid rgba(255,51,85,.4);
  border-radius:10px;
  background:rgba(15,19,32,.85);
  color:var(--red);
  font:900 1.2rem/1 var(--mono);
  text-shadow:0 0 10px rgba(255,51,85,.5);
  pointer-events:none;
  z-index:20;
}

#demo-indicator{
  position:absolute;
  top:20px;
  left:20px;
  pointer-events:none;
  z-index:20;
}

.demo-badge{
  padding:8px 14px;
  border:2px solid var(--gold);
  border-radius:8px;
  background:rgba(255,209,102,.15);
  color:var(--gold);
  font:900 11px/1 var(--mono);
  letter-spacing:.2em;
  text-transform:uppercase;
  text-shadow:0 0 10px rgba(255,209,102,.5);
  animation:glowPulse 1.5s ease-in-out infinite;
}

@keyframes glowPulse{
  0%,100%{box-shadow:0 0 10px rgba(255,209,102,.5)}
  50%{box-shadow:0 0 20px rgba(255,209,102,.8),0 0 30px rgba(255,209,102,.4)}
}

.timer-danger{
  animation:timerPulse .5s ease-in-out infinite alternate;
}
@keyframes timerPulse{from{filter:brightness(1)}to{filter:brightness(1.55)}}

/* Results Display */
#results-display{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  pointer-events:auto;
  display:none;
  max-width:700px;
  width:90%;
}

.results-title{
  font:900 clamp(1.2rem,3vw,1.8rem)/1 var(--sans);
  color:var(--cyan);
  text-shadow:0 0 20px rgba(56,232,255,.5);
  margin-bottom:16px;
}

.results-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:20px;
}

.result-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;
  background:rgba(15,19,32,.7);
  text-align:left;
}

.result-rank{
  width:28px;
  height:28px;
  border-radius:50%;
  background:linear-gradient(180deg,var(--gold),#a97400);
  color:#000;
  font:900 12px/1 var(--mono);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.result-text{
  flex:1;
  font:700 12px/1 var(--mono);
  letter-spacing:.1em;
  color:var(--text);
  text-transform:uppercase;
}

.result-count{
  font:900 13px/1 var(--mono);
  color:var(--green);
  text-shadow:0 0 10px rgba(0,255,163,.5);
}

.next-btn{
  padding:14px 32px;
  border:1px solid var(--cyan);
  border-radius:12px;
  background:linear-gradient(180deg,rgba(56,232,255,.2),rgba(56,232,255,.05));
  color:var(--cyan);
  font:900 13px/1 var(--mono);
  letter-spacing:.2em;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .3s ease;
  pointer-events:auto;
}
.next-btn:hover{
  background:linear-gradient(180deg,rgba(56,232,255,.35),rgba(56,232,255,.1));
  box-shadow:0 0 20px rgba(56,232,255,.3);
}

/* Leaderboard */
#leaderboard-display{
  position:absolute;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:8px;
  pointer-events:none;
  max-width:250px;
}

.leaderboard-title{
  font:700 10px/1 var(--mono);
  letter-spacing:.3em;
  color:var(--muted);
  text-transform:uppercase;
  text-align:center;
  margin-bottom:8px;
}

.leaderboard-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.05);
  border-radius:8px;
  background:rgba(15,19,32,.6);
}

.leaderboard-avatar{
  width:24px;
  height:24px;
  border-radius:50%;
  border:2px solid;
}

.leaderboard-name{
  flex:1;
  font:700 10px/1 var(--mono);
  letter-spacing:.1em;
  color:var(--text);
  text-transform:uppercase;
}

.leaderboard-score{
  font:900 11px/1 var(--mono);
  color:var(--gold);
  text-shadow:0 0 10px rgba(255,209,102,.5);
}

/* Podium Display */
#podium-display{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(4,5,9,.9);
  pointer-events:auto;
  display:none;
}

.podium-title{
  font:900 clamp(2rem,5vw,3rem)/1 var(--sans);
  color:var(--gold);
  text-shadow:0 0 30px rgba(255,209,102,.6);
  margin-bottom:40px;
  text-transform:uppercase;
  letter-spacing:.1em;
}

.podium-stands{
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:40px;
  margin-bottom:30px;
}

.podium-stand{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}

.podium-base{
  width:120px;
  height:20px;
  border-radius:4px 4px 0 0;
  background:linear-gradient(180deg,rgba(255,209,102,.3),rgba(255,209,102,.1));
  border:2px solid var(--gold);
  border-bottom:none;
}

.podium-platform{
  width:100px;
  padding:16px 8px;
  border-radius:8px 8px 0 0;
  background:rgba(15,19,32,.8);
  border:2px solid var(--gold);
  border-bottom:none;
  text-align:center;
}

.podium-2 .podium-base{height:15px;background:linear-gradient(180deg,rgba(0,255,163,.3),rgba(0,255,163,.1));border-color:var(--green)}
.podium-2 .podium-platform{padding:12px 8px;border-color:var(--green)}
.podium-3 .podium-base{height:10px;background:linear-gradient(180deg,rgba(255,51,85,.3),rgba(255,51,85,.1));border-color:var(--red)}
.podium-3 .podium-platform{padding:8px 8px;border-color:var(--red)}

.podium-place{
  font:900 1.2rem/1 var(--mono);
  color:var(--gold);
  text-shadow:0 0 10px rgba(255,209,102,.5);
}
.podium-2 .podium-place{color:var(--green);text-shadow:0 0 10px rgba(0,255,163,.5)}
.podium-3 .podium-place{color:var(--red);text-shadow:0 0 10px rgba(255,51,85,.5)}

.podium-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  border:3px solid;
}

.podium-name{
  font:700 12px/1 var(--mono);
  letter-spacing:.1em;
  color:var(--text);
  text-transform:uppercase;
}

.podium-score{
  font:900 1.3rem/1 var(--mono);
  color:var(--gold);
  text-shadow:0 0 15px rgba(255,209,102,.5);
}

.play-again-btn{
  margin-top:30px;
  padding:16px 40px;
  border:1px solid var(--cyan);
  border-radius:14px;
  background:linear-gradient(180deg,rgba(56,232,255,.2),rgba(56,232,255,.05));
  color:var(--cyan);
  font:900 14px/1 var(--mono);
  letter-spacing:.3em;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .3s ease;
  pointer-events:auto;
}
.play-again-btn:hover{
  background:linear-gradient(180deg,rgba(56,232,255,.35),rgba(56,232,255,.1));
  box-shadow:0 0 30px rgba(56,232,255,.3);
}

/* Animations */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes slideIn{
  from{opacity:0;transform:scale(.9)}
  to{opacity:1;transform:scale(1)}
}

.fade-in{
  animation:fadeIn .5s ease forwards;
}

.slide-in{
  animation:slideIn .4s ease forwards;
}

/* Responsive */
@media (max-width:768px){
  .question-text{
    font-size:clamp(1rem,4vw,1.5rem);
    padding:16px 20px;
  }
  
  .results-display{
    width:95%;
    max-width:400px;
  }
  
  .result-item{
    flex-wrap:wrap;
  }
  
  #leaderboard-display{
    display:none;
  }
  
  .podium-stands{
    flex-direction:column;
    align-items:center;
    gap:20px;
  }
  
  .podium-stand{
    flex-direction:row;
    gap:16px;
  }
  
  .podium-platform{
    width:80px;
    padding:8px 4px;
  }
}

/* Loading bar for assets */
#asset-loader{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:200px;
  height:4px;
  border-radius:2px;
  background:rgba(255,255,255,.1);
  overflow:hidden;
}

#asset-loader .progress{
  height:100%;
  background:linear-gradient(90deg,var(--cyan),var(--green));
  width:0%;
  transition:width .3s ease;
}

</style>
</head>
<body>

<!-- Three.js Container -->
<div id="three-container"></div>

<!-- Loading Screen -->
<div id="loading-screen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Chargement Three.js...</div>
  <div style="margin-top: 10px; font: 700 11px/1 var(--mono); letter-spacing: .1em; color: var(--muted);">Création de la salle 3D</div>
  <div id="asset-loader">
    <div class="progress"></div>
  </div>
</div>

<!-- UI Overlay -->
<div id="ui-overlay">
  <!-- Main Menu -->
  <div id="main-menu">
    <h1 class="menu-title">CREATOR 3D QUIZ</h1>
    <p class="menu-subtitle">Teste le mode DEMO pour voir la salle !</p>
    <button class="menu-btn demo-btn" id="demo-btn" style="margin-bottom: 16px;">✨ TESTER MODE DEMO ✨</button>
    <button class="menu-btn" id="create-btn">CREER UNE SALLE</button>
    <button class="menu-btn secondary" id="join-btn">REJOINDRE</button>
  </div>

  <!-- Join Form -->
  <div id="join-form" hidden>
    <h2 class="menu-title">Rejoindre</h2>
    <input type="text" class="form-input" id="pseudo-input" placeholder="Ton pseudo" maxlength="15">
    <input type="text" class="form-input" id="room-code-input" placeholder="Code de la salle" maxlength="4">
    <button class="menu-btn" id="confirm-join-btn">CONTINUER</button>
    <button class="menu-btn secondary" id="back-to-menu-btn">RETOUR</button>
  </div>

  <!-- Room Lobby -->
  <div id="room-lobby" hidden>
    <div id="room-code-display">
      <p class="code-label">Code de la salle</p>
      <div class="code-value" id="displayed-room-code"></div>
    </div>
    <div id="players-list"></div>
    <button class="menu-btn" id="start-btn">LANCER LA PARTIE</button>
    <button class="menu-btn secondary" id="exit-lobby-btn" style="margin-top:10px;">RETOUR AU MENU</button>
  </div>

  <!-- Question Display -->
  <div id="question-display">
    <p class="question-number" id="question-number">Question 1/10</p>
    <div class="question-text" id="question-text"></div>
    <div id="answer-section">
      <input type="text" class="answer-input" id="answer-input" placeholder="Ta reponse..." autocomplete="off">
      <button class="submit-btn" id="submit-answer-btn">ENVOYER</button>
    </div>
  </div>

  <!-- Timer -->
  <div id="timer-display">30</div>
  
  <!-- Demo Mode Indicator -->
  <div id="demo-indicator" hidden>
    <span class="demo-badge">🎭 DEMO</span>
  </div>

  <!-- Results Display -->
  <div id="results-display">
    <h2 class="results-title">Resultats</h2>
    <div class="results-list" id="results-list"></div>
    <button class="next-btn" id="next-question-btn">SUIVANT</button>
    <button class="menu-btn secondary" id="exit-results-btn" style="margin-top:10px;">Quitter Demo</button>
  </div>

  <!-- Leaderboard (during game) -->
  <div id="leaderboard-display">
    <p class="leaderboard-title">Classement</p>
    <div id="leaderboard-list"></div>
  </div>

  <!-- Podium Display -->
  <div id="podium-display">
    <h1 class="podium-title">Podium Final</h1>
    <div class="podium-stands" id="podium-stands"></div>
    <button class="play-again-btn" id="play-again-btn">Rejouer</button>
    <button class="menu-btn secondary" id="exit-demo-btn" style="margin-top:10px;">Quitter Demo</button>
  </div>
</div>

<script>
// ============================================================
// CREATOR 3D QUIZ - Client
// ============================================================

// Configuration
const SERVER_URL = window.location.origin;
const PLAYER_COLORS = [
  '#0033FF', // Bleu
  '#00E5A0', // Vert Menthe
  '#FF5C35', // Orange
  '#FFD700', // Jaune
  '#8B5CF6', // Violet
  '#FF69B4', // Rose
  '#00BCD4', // Cyan
  '#E91E63', // Fuchsia
];

// Demo Mode Data
const DEMO_PLAYERS = [
  { pseudo: 'Alice', color: '#0033FF' },
  { pseudo: 'Bob', color: '#00E5A0' },
  { pseudo: 'Charlie', color: '#FF5C35' },
  { pseudo: 'Diana', color: '#FFD700' },
];

const DEMO_QUESTIONS = [
  'Nommez un fruit jaune',
  'Nommez un super-héros célèbre',
  'Nommez une capitale africaine',
  "Nommez un sport qu'on pratique en équipe",
  'Nommez un plat que tout le monde aime',
  "Nommez un animal qu'on peut voir en Afrique",
  'Nommez une application populaire sur téléphone',
  'Nommez un langage de programmation',
  "Nommez quelque chose qu'on emmène à la plage",
  'Nommez une marque de téléphone'
];

const DEMO_ANSWERS = {
  'Nommez un fruit jaune': ['banane', 'citron', 'ananas', 'mangue'],
  'Nommez un super-héros célèbre': ['Spider-Man', 'Batman', 'Superman', 'Iron Man'],
  'Nommez une capitale africaine': ['Cotonou', 'Dakar', 'Abidjan', 'Lagos'],
  "Nommez un sport qu'on pratique en équipe": ['football', 'basketball', 'volleyball', 'rugby'],
  'Nommez un plat que tout le monde aime': ['pizza', 'pâtes', 'riz', 'burger'],
  "Nommez un animal qu'on peut voir en Afrique": ['lion', 'éléphant', 'girafe', 'zèbre'],
  'Nommez une application populaire sur téléphone': ['WhatsApp', 'Instagram', 'TikTok', 'Twitter'],
  'Nommez un langage de programmation': ['JavaScript', 'Python', 'Java', 'C++'],
  "Nommez quelque chose qu'on emmène à la plage": ['serviette', 'lunettes', 'maillot', 'crème solaire'],
  'Nommez une marque de téléphone': ['Samsung', 'iPhone', 'Xiaomi', 'Huawei']
};

// State
let socket;
let roomCode = null;
let playerId = null;
let playerPseudo = null;
let playerColor = null;
let isAnimator = false;
let isDemoMode = false;
let currentQuestion = null;
let timeLeft = 0;
let players = [];
let results = [];
let rankings = [];
let demoQuestionIndex = 0;
let demoTimer = null;

// Three.js Variables
let scene, camera, renderer, room;
let playerAvatars = {};
let questionDisplay3D = null;
let timerDisplay3D = null;
let resultsDisplay3D = null;
let animations = [];

// ============================================================
// INITIALISATION
// ============================================================

function init() {
  initSocket();
  initThreeJS();
  initUI();
  
  // Hide loading screen after Three.js is ready
  setTimeout(() => {
    document.getElementById('loading-screen').classList.add('hidden');
  }, 2000);
}

// ============================================================
// SOCKET.IO
// ============================================================

function initSocket() {
  socket = io(SERVER_URL);
  
  socket.on('connect', () => {
    console.log('Connected to server:', socket.id);
    playerId = socket.id;
  });
  
  socket.on('disconnect', () => {
    console.log('Disconnected from server');
  });
  
  // Room created
  socket.on('room-created', ({ code }) => {
    roomCode = code;
    isAnimator = true;
    showRoomLobby();
    updateRoomCodeDisplay();
  });
  
  // Joined room
  socket.on('joined-room', ({ player, code }) => {
    roomCode = code;
    playerPseudo = player.pseudo;
    playerColor = player.color;
    isAnimator = false;
    showRoomLobby();
    updateRoomCodeDisplay();
  });
  
  // Error
  socket.on('error-msg', ({ message }) => {
    alert(message);
  });
  
  // Players updated
  socket.on('players-updated', ({ players: playersList }) => {
    players = playersList;
    updatePlayersList();
    updatePlayerAvatars();
    if (isAnimator && players.length > 0) {
      document.getElementById('start-btn').style.display = 'block';
    }
  });
  
  // Game started
  socket.on('game-started', () => {
    document.getElementById('room-lobby').hidden = true;
    document.getElementById('question-display').style.display = 'block';
    document.getElementById('leaderboard-display').style.display = 'flex';
    updateLeaderboard();
  });
  
  // New question
  socket.on('new-question', ({ number, text, total, timeLeft: serverTimeLeft }) => {
    currentQuestion = { number, text, total };
    timeLeft = serverTimeLeft;
    updateQuestionDisplay();
    updateTimerDisplay();
    startTimer();
    
    // Show answer section for players
    if (!isAnimator) {
      document.getElementById('answer-section').style.display = 'flex';
      document.getElementById('answer-input').value = '';
      document.getElementById('answer-input').focus();
    }
    
    // Hide results
    document.getElementById('results-display').style.display = 'none';
    document.getElementById('question-display').style.display = 'block';
    
    // In demo mode, hide answer section (not needed)
    if (isDemoMode) {
      document.getElementById('answer-section').style.display = 'none';
    }
  });
  
  // Timer tick
  socket.on('timer-tick', ({ timeLeft: serverTimeLeft }) => {
    timeLeft = serverTimeLeft;
    updateTimerDisplay();
  });
  
  // Answer confirmed
  socket.on('answer-confirmed', () => {
    document.getElementById('answer-input').disabled = true;
    document.getElementById('submit-answer-btn').disabled = true;
  });
  
  // Question results
  socket.on('question-results', ({ questionText, results: serverResults, scores }) => {
    results = serverResults;
    players = scores.map(score => ({
      id: score.id,
      pseudo: score.pseudo,
      score: score.score,
      color: score.color
    }));
    
    updateResultsDisplay();
    updateLeaderboard();
    updatePlayerAvatars();
    
    // Hide question, show results
    document.getElementById('question-display').style.display = 'none';
    document.getElementById('results-display').style.display = 'block';
    document.getElementById('answer-section').style.display = 'none';
    
    // Only animator can go to next question
    if (isAnimator) {
      document.getElementById('next-question-btn').style.display = 'block';
    }
  });
  
  // Show podium
  socket.on('show-podium', ({ rankings: serverRankings }) => {
    rankings = serverRankings;
    showPodium();
    updatePlayerAvatars();
  });
  
  // Back to lobby
  socket.on('back-to-lobby', ({ players: playersList }) => {
    players = playersList;
    document.getElementById('podium-display').style.display = 'none';
    document.getElementById('results-display').style.display = 'none';
    document.getElementById('question-display').style.display = 'none';
    document.getElementById('room-lobby').hidden = false;
    updatePlayersList();
    updatePlayerAvatars();
    document.getElementById('start-btn').style.display = 'none';
  });
  
  // Game ended
  socket.on('game-ended', ({ message }) => {
    alert(message);
    goToMenu();
  });
  
  // Player answered (for animator)
  socket.on('player-answered', ({ playerId, pseudo }) => {
    // Could show notification
  });
}

// ============================================================
// UI FUNCTIONS
// ============================================================

function initUI() {
  // Menu buttons
  document.getElementById('create-btn').addEventListener('click', createRoom);
  document.getElementById('join-btn').addEventListener('click', showJoinForm);
  document.getElementById('demo-btn').addEventListener('click', startDemoMode);
  document.getElementById('back-to-menu-btn').addEventListener('click', () => {
    document.getElementById('join-form').hidden = true;
    document.getElementById('main-menu').hidden = false;
  });
  
  // Join form
  document.getElementById('confirm-join-btn').addEventListener('click', joinRoom);
  
  // Start button
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('exit-lobby-btn').addEventListener('click', goToMenu);
  
  // Answer submission
  document.getElementById('submit-answer-btn').addEventListener('click', submitAnswer);
  document.getElementById('answer-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') submitAnswer();
  });
  
  // Next question button
  document.getElementById('next-question-btn').addEventListener('click', nextQuestion);
  document.getElementById('exit-results-btn').addEventListener('click', goToMenu);
  
  // Play again button
  document.getElementById('play-again-btn').addEventListener('click', playAgain);
  
  // Exit demo button
  document.getElementById('exit-demo-btn').addEventListener('click', goToMenu);
}

function createRoom() {
  const pseudo = prompt('Choisis ton pseudo (admin):', 'Admin');
  if (!pseudo || !pseudo.trim()) return;
  
  playerPseudo = pseudo.trim().substring(0, 15);
  socket.emit('create-room');
  document.getElementById('main-menu').hidden = true;
}

function showJoinForm() {
  document.getElementById('main-menu').hidden = true;
  document.getElementById('join-form').hidden = false;
  document.getElementById('pseudo-input').focus();
}

function joinRoom() {
  const pseudo = document.getElementById('pseudo-input').value.trim();
  const code = document.getElementById('room-code-input').value.trim().toUpperCase();
  
  if (!pseudo) {
    alert('Veuillez entrer un pseudo');
    return;
  }
  
  if (!code || code.length !== 4) {
    alert('Veuillez entrer un code de salle valide (4 lettres)');
    return;
  }
  
  playerPseudo = pseudo;
  socket.emit('join-room', { code, pseudo });
  document.getElementById('join-form').hidden = true;
}

function startGame() {
  socket.emit('start-game', { code: roomCode });
}

function submitAnswer() {
  const answer = document.getElementById('answer-input').value.trim();
  if (!answer) return;
  
  socket.emit('submit-answer', { code: roomCode, answer });
  document.getElementById('answer-input').disabled = true;
  document.getElementById('submit-answer-btn').disabled = true;
}

function nextQuestion() {
  document.getElementById('next-question-btn').style.display = 'none';
  
  if (isDemoMode) {
    demoQuestionIndex++;
    if (demoQuestionIndex >= DEMO_QUESTIONS.length) {
      // Game over in demo mode
      showDemoPodium();
    } else {
      askDemoQuestion();
    }
  } else {
    socket.emit('next-question', { code: roomCode });
  }
}

function playAgain() {
  document.getElementById('podium-display').style.display = 'none';
  
  if (isDemoMode) {
    // Restart demo game
    startDemoGame();
  } else {
    socket.emit('play-again', { code: roomCode });
  }
}

function goToMenu() {
  roomCode = null;
  isAnimator = false;
  isDemoMode = false;
  playerPseudo = null;
  playerColor = null;
  currentQuestion = null;
  players = [];
  results = [];
  rankings = [];
  
  // Clear demo timer
  if (demoTimer) {
    clearInterval(demoTimer);
    demoTimer = null;
  }
  
  // Hide demo indicator
  document.getElementById('demo-indicator').hidden = true;
  
  document.getElementById('main-menu').hidden = false;
  document.getElementById('room-lobby').hidden = true;
  document.getElementById('join-form').hidden = true;
  document.getElementById('question-display').style.display = 'none';
  document.getElementById('results-display').style.display = 'none';
  document.getElementById('podium-display').style.display = 'none';
  document.getElementById('leaderboard-display').style.display = 'none';
  document.getElementById('answer-section').style.display = 'none';
  
  // Reset answer input
  document.getElementById('answer-input').value = '';
  document.getElementById('answer-input').disabled = false;
  document.getElementById('submit-answer-btn').disabled = false;
  
  // Clear 3D scene
  clearThreeJSScene();
  
  // Show loading briefly
  document.getElementById('loading-screen').classList.remove('hidden');
  setTimeout(() => {
    document.getElementById('loading-screen').classList.add('hidden');
  }, 1000);
}

// ============================================================
// DEMO MODE FUNCTIONS
// ============================================================

function startDemoMode() {
  isDemoMode = true;
  isAnimator = true;
  playerPseudo = 'Demo Admin';
  playerColor = PLAYER_COLORS[0];
  roomCode = 'DEMO';
  
  // Show demo indicator
  document.getElementById('demo-indicator').hidden = false;
  
  // Initialize demo players
  players = DEMO_PLAYERS.map((p, index) => ({
    id: `demo-${index}`,
    pseudo: p.pseudo,
    color: p.color,
    score: 0,
    answered: false
  }));
  
  // Add admin to players list
  players.unshift({
    id: 'demo-admin',
    pseudo: playerPseudo,
    color: playerColor,
    score: 0,
    answered: false
  });
  
  // Hide menu, show room lobby briefly then start game
  document.getElementById('main-menu').hidden = true;
  document.getElementById('room-lobby').hidden = false;
  updateRoomCodeDisplay();
  updatePlayersList();
  
  // Add demo message in lobby
  const demoLobbyMsg = document.createElement('p');
  demoLobbyMsg.style.cssText = `
    margin-top: 20px;
    font: 700 11px/1 var(--mono);
    letter-spacing: .2em;
    color: var(--gold);
    text-transform: uppercase;
    text-align: center;
    animation: pulse 1.5s ease-in-out infinite;
  `;
  demoLobbyMsg.textContent = 'DEMO MODE - Partie automatique dans 2 secondes...';
  demoLobbyMsg.id = 'demo-lobby-msg';
  document.getElementById('room-lobby').appendChild(demoLobbyMsg);
  
  // Initialize 3D room
  create3DRoom();
  updatePlayerAvatars();
  
  // Auto-start game after 2 seconds
  setTimeout(() => {
    const msg = document.getElementById('demo-lobby-msg');
    if (msg) msg.remove();
    startDemoGame();
  }, 2000);
}

function startDemoGame() {
  document.getElementById('room-lobby').hidden = true;
  document.getElementById('question-display').style.display = 'block';
  document.getElementById('leaderboard-display').style.display = 'flex';
  updateLeaderboard();
  
  // Start first question
  demoQuestionIndex = 0;
  askDemoQuestion();
}

function askDemoQuestion() {
  if (demoQuestionIndex >= DEMO_QUESTIONS.length) {
    showDemoPodium();
    return;
  }
  
  const questionText = DEMO_QUESTIONS[demoQuestionIndex];
  currentQuestion = {
    number: demoQuestionIndex + 1,
    text: questionText,
    total: DEMO_QUESTIONS.length
  };
  
  timeLeft = 10; // Shorter timer for demo
  updateQuestionDisplay();
  updateTimerDisplay();
  
  // Hide results
  document.getElementById('results-display').style.display = 'none';
  document.getElementById('question-display').style.display = 'block';
  document.getElementById('answer-section').style.display = 'none';
  
  // Reset answered status
  players.forEach(p => p.answered = false);
  
  // Start demo timer
  if (demoTimer) clearInterval(demoTimer);
  
  // Bots will answer after random delay
  setTimeout(() => {
    simulateDemoAnswers(questionText);
  }, 3000);
  
  // Timer countdown
  demoTimer = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    
    if (timeLeft <= 0) {
      clearInterval(demoTimer);
      showDemoResults(questionText);
    }
  }, 1000);
}

function simulateDemoAnswers(questionText) {
  const answers = DEMO_ANSWERS[questionText];
  if (!answers) return;
  
  // Each bot answers with a different answer
  players.slice(1).forEach((player, index) => { // Skip admin
    if (index < answers.length) {
      setTimeout(() => {
        player.answered = true;
        updatePlayerAvatars();
      }, index * 500);
    }
  });
  
  // Admin answers too
  setTimeout(() => {
    players[0].answered = true;
    updatePlayerAvatars();
    
    // After all answered, show results
    setTimeout(() => {
      if (demoTimer) {
        clearInterval(demoTimer);
        showDemoResults(questionText);
      }
    }, 1000);
  }, players.length * 500);
}

function showDemoResults(questionText) {
  const answers = DEMO_ANSWERS[questionText];
  if (!answers) return;
  
  // Create results
  const demoResults = answers.map((answer, index) => {
    // Calculate how many bots chose this answer
    const count = Math.min(Math.max(1, Math.floor(Math.random() * 3) + 1), players.length - 1);
    const percentage = Math.round((count / (players.length - 1)) * 100);
    const points = percentage * 10;
    
    // Assign points to random players
    const playerIds = [];
    for (let i = 0; i < count; i++) {
      const randomIndex = Math.floor(Math.random() * (players.length - 1)) + 1;
      playerIds.push(players[randomIndex].id);
      players[randomIndex].score += points;
    }
    
    return {
      text: answer,
      count: count,
      percentage: percentage,
      points: points,
      playerIds: playerIds
    };
  });
  
  results = demoResults;
  updateResultsDisplay();
  updateLeaderboard();
  updatePlayerAvatars();
  
  // Hide question, show results
  document.getElementById('question-display').style.display = 'none';
  document.getElementById('results-display').style.display = 'block';
  document.getElementById('answer-section').style.display = 'none';
  
  // Show next button
  document.getElementById('next-question-btn').style.display = 'block';
  
  // Store for demo
  currentQuestion.results = demoResults;
}

function showDemoPodium() {
  // Sort players by score
  rankings = [...players].sort((a, b) => b.score - a.score);
  showPodium();
  updatePlayerAvatars();
  
  // Show demo message
  setTimeout(() => {
    const demoMsg = document.createElement('div');
    demoMsg.style.cssText = `
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border: 2px solid var(--gold);
      border-radius: 12px;
      background: rgba(15, 19, 32, 0.9);
      color: var(--gold);
      font: 900 14px/1 var(--mono);
      letter-spacing: .2em;
      text-transform: uppercase;
      z-index: 100;
      animation: slideIn 0.5s ease;
    `;
    demoMsg.textContent = '✨ MODE DEMO - Fin de la partie ✨';
    demoMsg.classList.add('slide-in');
    demoMsg.id = 'demo-message';
    document.getElementById('ui-overlay').appendChild(demoMsg);
    
    // Remove after 5 seconds
    setTimeout(() => {
      const msg = document.getElementById('demo-message');
      if (msg) msg.remove();
    }, 5000);
  }, 1000);
}

function showRoomLobby() {
  document.getElementById('main-menu').hidden = true;
  document.getElementById('join-form').hidden = true;
  document.getElementById('room-lobby').hidden = false;
  updatePlayersList();
  updateRoomCodeDisplay();
  
  // Initialize 3D room
  create3DRoom();
}

function updateRoomCodeDisplay() {
  const codeEl = document.getElementById('displayed-room-code');
  if (codeEl && roomCode) {
    if (isDemoMode) {
      codeEl.textContent = roomCode + ' (DEMO)';
    } else {
      codeEl.textContent = roomCode;
    }
  }
}

function updatePlayersList() {
  const listEl = document.getElementById('players-list');
  if (!listEl) return;
  
  listEl.innerHTML = '';
  players.forEach(player => {
    const card = document.createElement('div');
    card.className = 'player-card';
    card.innerHTML = `
      <div class="player-avatar" style="border-color:${player.color}"></div>
      <span class="player-name">${player.pseudo}</span>
      <span class="player-score">${player.score}</span>
    `;
    listEl.appendChild(card);
  });
}

function updateQuestionDisplay() {
  const numberEl = document.getElementById('question-number');
  const textEl = document.getElementById('question-text');
  
  if (currentQuestion) {
    numberEl.textContent = `Question ${currentQuestion.number}/${currentQuestion.total}`;
    textEl.textContent = currentQuestion.text;
  }
}

function updateTimerDisplay() {
  const timerEl = document.getElementById('timer-display');
  if (timerEl) {
    timerEl.textContent = timeLeft;
    timerEl.classList.toggle('timer-danger', timeLeft <= 5);
  }
}

function startTimer() {
  // Timer is managed by server, but we can have a local fallback
  if (window.timerInterval) clearInterval(window.timerInterval);
  
  window.timerInterval = setInterval(() => {
    if (timeLeft > 0) {
      timeLeft--;
      updateTimerDisplay();
    }
  }, 1000);
}

function updateResultsDisplay() {
  const listEl = document.getElementById('results-list');
  if (!listEl) return;
  
  listEl.innerHTML = '';
  results.forEach((result, index) => {
    const item = document.createElement('div');
    item.className = 'result-item';
    item.innerHTML = `
      <span class="result-rank">${index + 1}</span>
      <span class="result-text">${result.text}</span>
      <span class="result-count">${result.count} reponses (${result.percentage}%)</span>
    `;
    listEl.appendChild(item);
  });
}

function updateLeaderboard() {
  const listEl = document.getElementById('leaderboard-list');
  if (!listEl) return;
  
  listEl.innerHTML = '';
  players
    .sort((a, b) => b.score - a.score)
    .slice(0, 5)
    .forEach(player => {
      const item = document.createElement('div');
      item.className = 'leaderboard-item';
      item.innerHTML = `
        <div class="leaderboard-avatar" style="border-color:${player.color}"></div>
        <span class="leaderboard-name">${player.pseudo}</span>
        <span class="leaderboard-score">${player.score}</span>
      `;
      listEl.appendChild(item);
    });
}

function showPodium() {
  document.getElementById('results-display').style.display = 'none';
  document.getElementById('question-display').style.display = 'none';
  document.getElementById('leaderboard-display').style.display = 'none';
  document.getElementById('podium-display').style.display = 'block';
  
  const standsEl = document.getElementById('podium-stands');
  if (!standsEl) return;
  
  standsEl.innerHTML = '';
  
  // Add podium stands for top 3
  for (let i = 0; i < Math.min(3, rankings.length); i++) {
    const rank = rankings[i];
    const stand = document.createElement('div');
    stand.className = `podium-stand podium-${i + 1}`;
    stand.innerHTML = `
      <div class="podium-base"></div>
      <div class="podium-platform">
        <span class="podium-place">${i + 1}</span>
        <div class="podium-avatar" style="border-color:${rank.color}"></div>
        <span class="podium-name">${rank.pseudo}</span>
        <span class="podium-score">${rank.score}</span>
      </div>
    `;
    standsEl.appendChild(stand);
  }
}

// Global variables for 3D objects

  mainLight.shadow.camera.right = 50;

  mainLight.shadow.camera.bottom = -50;
  scene.add(mainLight);
  
  // Cyan neon light - left side
  const cyanLight = new THREE.PointLight(0x38e8ff, 3, 30);
  cyanLight.position.set(-8, 8, -5);
  cyanLight.castShadow = true;
  scene.add(cyanLight);

  const magentaLight = new THREE.PointLight(0xff3355, 3, 30);
  magentaLight.position.set(8, 8, -5);
  magentaLight.castShadow = true;
  scene.add(magentaLight);

  const greenLight = new THREE.PointLight(0x00ffa3, 2, 30);
  greenLight.position.set(0, 8, 8);
  greenLight.castShadow = true;
  scene.add(greenLight);
  
  // Blue accent light
  const blueLight = new THREE.PointLight(0x0033ff, 1.5, 25);
  blueLight.position.set(-6, 5, -8);

  // Purple accent light
  const purpleLight = new THREE.PointLight(0x8b5cf6, 1.5, 25);
  purpleLight.position.set(6, 5, -8);
  scene.add(purpleLight);

    }
  }, 1000);
}

function createGridFloor() {
  // Main floor - large dark metal surface
  const floorGeometry = new THREE.PlaneGeometry(100, 100);
  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0x1a1f2e,
    roughness: 0.4,
    metalness: 0.6,
    reflectivity: 0.5
  });
  
  const floor = new THREE.Mesh(floorGeometry, floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.05;
  floor.receiveShadow = true;
  scene.add(floor);
  roomObjects.push(floor);
  
  // Grid lines - more pronounced
  const gridGeometry = new THREE.BufferGeometry();
  const gridMaterial = new THREE.LineBasicMaterial({ 
    color: 0x2a3d5a, 
    transparent: true, 
    opacity: 0.5 
  });
  
  const lineCount = 25;
  const gridSize = 50;
  const lines = [];
  
  for (let i = -lineCount; i <= lineCount; i++) {
    const geometryH = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-gridSize, 0.01, i),
      new THREE.Vector3(gridSize, 0.01, i)
    ]);
    const lineH = new THREE.Line(geometryH, gridMaterial);
    lines.push(lineH);
    
    const geometryV = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(i, 0.01, -gridSize),
      new THREE.Vector3(i, 0.01, gridSize)
    ]);
    const lineV = new THREE.Line(geometryV, gridMaterial);
    lines.push(lineV);
  }
  
  lines.forEach(line => {
    scene.add(line);
    roomObjects.push(line);
  });
}

function createStars() {
  // Reduced stars for more focus on the room
  const geometry = new THREE.BufferGeometry();
  const material = new THREE.PointsMaterial({
    color: 0x38e8ff,
    size: 0.1,
    transparent: true,
    opacity: 0.6
  });
  
  const vertices = [];
  for (let i = 0; i < 500; i++) {
    const x = (Math.random() - 0.5) * 200;
    const y = Math.random() * 80 + 10;
    const z = (Math.random() - 0.5) * 200;
    vertices.push(x, y, z);
  }
  
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  const stars = new THREE.Points(geometry, material);
  scene.add(stars);
  roomObjects.push(stars);
}

function createParticles() {
  // Atmospheric particles for cyberpunk effect
  const particleCount = 100;
  const particlesGeometry = new THREE.BufferGeometry();
  const particlesMaterial = new THREE.PointsMaterial({
    color: 0x38e8ff,
    size: 0.15,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending
  });
  
  const particlePositions = [];
  for (let i = 0; i < particleCount; i++) {
    particlePositions.push(
      (Math.random() - 0.5) * 40,
      Math.random() * 10,
      (Math.random() - 0.5) * 40
    );
  }
  
  particlesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(particlePositions, 3));
  const particles = new THREE.Points(particlesGeometry, particlesMaterial);
  scene.add(particles);
  roomObjects.push(particles);
}

function createRealisticRoom() {
  // Room dimensions
  const roomWidth = 40;
  const roomDepth = 35;
  const roomHeight = 12;
  
  // Wall material - dark with slight texture
  const wallMaterial = new THREE.MeshStandardMaterial({
    color: 0x0d1117,
    roughness: 0.7,
    metalness: 0.3
  });
  
  // Floor material - reflective dark surface
  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0x161b26,
    roughness: 0.2,
    metalness: 0.8
  });
  
  // Back wall
  const backWall = new THREE.Mesh(
    new THREE.PlaneGeometry(roomWidth, roomHeight),
    wallMaterial
  );
  backWall.position.set(0, roomHeight/2, -roomDepth/2);
  backWall.receiveShadow = true;
  scene.add(backWall);
  roomObjects.push(backWall);
  
  // Left wall
  const leftWall = new THREE.Mesh(
    new THREE.PlaneGeometry(roomDepth, roomHeight),
    wallMaterial
  );
  leftWall.rotation.y = Math.PI / 2;
  leftWall.position.set(-roomWidth/2, roomHeight/2, 0);
  leftWall.receiveShadow = true;
  scene.add(leftWall);
  roomObjects.push(leftWall);
  
  // Right wall
  const rightWall = new THREE.Mesh(
    new THREE.PlaneGeometry(roomDepth, roomHeight),
    wallMaterial
  );
  rightWall.rotation.y = -Math.PI / 2;
  rightWall.position.set(roomWidth/2, roomHeight/2, 0);
  rightWall.receiveShadow = true;
  scene.add(rightWall);
  roomObjects.push(rightWall);
  
  // Front wall (partial, to see inside)
  const frontWall = new THREE.Mesh(
    new THREE.PlaneGeometry(roomWidth, roomHeight/2),
    wallMaterial
  );
  frontWall.position.set(0, roomHeight/4, roomDepth/2);
  frontWall.receiveShadow = true;
  scene.add(frontWall);
  roomObjects.push(frontWall);
  
  // Ceiling with panels
  createCeiling(roomWidth, roomDepth, roomHeight);
  
  // Create the floor
  createGridFloor();
  
  // Add neon lights to walls
  createNeonLights(roomWidth, roomDepth, roomHeight);
  
  // Add structural columns
  createColumns();
  
  // Add central stage/platform
  createCentralStage();
  
  // Add main screen
  createMainScreen();
  
  // Add leaderboard screen
  createLeaderboardScreen();
  
  // Add surveillance cameras
  createCameras(roomWidth, roomDepth, roomHeight);
  
  // Add decorative elements
  createDecorativeElements();
  
  // Add player pods
  createPlayerPods();
  
  // Add ambient effects
  createStars();
  createParticles();
}

function createCeiling(width, depth, height) {
  // Main ceiling
  const ceilingGeometry = new THREE.PlaneGeometry(width, depth);
  const ceilingMaterial = new THREE.MeshStandardMaterial({
    color: 0x080a0f,
    roughness: 0.5,
    metalness: 0.6
  });
  
  const ceiling = new THREE.Mesh(ceilingGeometry, ceilingMaterial);
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = height;
  ceiling.receiveShadow = true;
  scene.add(ceiling);
  roomObjects.push(ceiling);
  
  // Ceiling panels (recessed)
  for (let x = -width/2 + 5; x < width/2; x += 10) {
    for (let z = -depth/2 + 5; z < depth/2; z += 10) {
      const panelGeometry = new THREE.BoxGeometry(8.5, 0.2, 8.5);
      const panelMaterial = new THREE.MeshStandardMaterial({
        color: 0x1a1f2e,
        roughness: 0.4,
        metalness: 0.7
      });
      const panel = new THREE.Mesh(panelGeometry, panelMaterial);
      panel.position.set(x, height - 0.15, z);
      scene.add(panel);
      roomObjects.push(panel);
    }
  }
  
  // Ceiling lights
  for (let x = -width/2 + 8; x < width/2; x += 16) {
    for (let z = -depth/2 + 8; z < depth/2; z += 16) {
      const lightHousing = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.3, 0.4, 16),
        new THREE.MeshStandardMaterial({
          color: 0x2a2d3a,
          roughness: 0.5,
          metalness: 0.8
        })
      );
      lightHousing.position.set(x, height - 0.2, z);
      scene.add(lightHousing);
      roomObjects.push(lightHousing);
      
      // Light emitter
      const lightEmitter = new THREE.Mesh(
        new THREE.CircleGeometry(0.2, 16),
        new THREE.MeshBasicMaterial({
          color: 0x38e8ff,
          emissive: 0x38e8ff,
          emissiveIntensity: 2
        })
      );
      lightEmitter.position.set(x, height - 0.1, z);
      lightEmitter.rotation.x = -Math.PI / 2;
      scene.add(lightEmitter);
      roomObjects.push(lightEmitter);
      
      // Add point light
      const pointLight = new THREE.PointLight(0x38e8ff, 0.5, 15);
      pointLight.position.set(x, height - 0.1, z);
      scene.add(pointLight);
    }
  }
}

function createNeonLights(width, depth, height) {
  // Neon tubes along the walls
  const neonMaterial = new THREE.MeshBasicMaterial({
    color: 0x38e8ff,
    transparent: true,
    opacity: 0.9
  });
  
  // Horizontal neon tubes on back wall
  for (let y = 2; y < height; y += 4) {
    const tubeGeometry = new THREE.BoxGeometry(width - 2, 0.2, 0.2);
    const tube = new THREE.Mesh(tubeGeometry, neonMaterial);
    tube.position.set(0, y, -depth/2 + 0.15);
    scene.add(tube);
    roomObjects.push(tube);
    
    // Add glow effect
    const glowMaterial = new THREE.MeshBasicMaterial({
      color: 0x38e8ff,
      transparent: true,
      opacity: 0.3
    });
    const glowGeometry = new THREE.BoxGeometry(width - 1.5, 0.5, 0.5);
    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
    glow.position.set(0, y, -depth/2 + 0.15);
    scene.add(glow);
    roomObjects.push(glow);
  }
  
  // Vertical neon tubes on corners
  const corners = [
    {x: -width/2 + 0.15, z: -depth/2 + 0.15},
    {x: width/2 - 0.15, z: -depth/2 + 0.15},
    {x: -width/2 + 0.15, z: depth/2 - 0.15},
    {x: width/2 - 0.15, z: depth/2 - 0.15}
  ];
  
  corners.forEach(corner => {
    const tubeGeometry = new THREE.BoxGeometry(0.2, height, 0.2);
    const tube = new THREE.Mesh(tubeGeometry, neonMaterial);
    tube.position.set(corner.x, height/2, corner.z);
    scene.add(tube);
    roomObjects.push(tube);
  });
  
  // Magenta neon accents
  const magentaMaterial = new THREE.MeshBasicMaterial({
    color: 0xff3355,
    transparent: true,
    opacity: 0.9
  });
  
  // Magenta tubes on side walls
  const sideTubeGeometry = new THREE.BoxGeometry(0.2, depth - 1, 0.2);
  const leftTube = new THREE.Mesh(sideTubeGeometry, magentaMaterial);
  leftTube.position.set(-width/2 + 0.15, depth/2, 0);
  leftTube.rotation.y = Math.PI / 2;
  scene.add(leftTube);
  roomObjects.push(leftTube);
  
  const rightTube = new THREE.Mesh(sideTubeGeometry, magentaMaterial);
  rightTube.position.set(width/2 - 0.15, depth/2, 0);
  rightTube.rotation.y = Math.PI / 2;
  scene.add(rightTube);
  roomObjects.push(rightTube);
}

  const columnMaterial = new THREE.MeshStandardMaterial({

    {x: 8, z: -6},

  positions.forEach(pos => {
    // Column base
    const baseGeometry = new THREE.CylinderGeometry(1.2, 1.5, 0.5, 32);
    const base = new THREE.Mesh(baseGeometry, columnMaterial);
    base.position.set(pos.x, 0.25, pos.z);

    // Column shaft

    capital.position.set(pos.x, 10.75, pos.z);
    capital.castShadow = true;

    roomObjects.push(capital);
    
    // LED strip on column
    const ledMaterial = new THREE.MeshBasicMaterial({

    });

function createCameras(width, depth, height) {
  const cameraBodyMaterial = new THREE.MeshStandardMaterial({
    color: 0x1a1f2e,
    roughness: 0.5,
    metalness: 0.7
  });
  
  const cameraLensMaterial = new THREE.MeshBasicMaterial({
    color: 0x38e8ff,
    transparent: true,
    opacity: 0.8
  });
  
  // Camera positions
  const cameraPositions = [
    {x: -15, y: 10, z: -10},
    {x: 15, y: 10, z: -10},
    {x: -15, y: 10, z: 10},
    {x: 15, y: 10, z: 10}
  ];
  
  cameraPositions.forEach(pos => {
    // Camera mount
    const mountGeometry = new THREE.BoxGeometry(0.3, 0.8, 0.3);
    const mount = new THREE.Mesh(mountGeometry, cameraBodyMaterial);
    mount.position.set(pos.x, pos.y, pos.z);
    scene.add(mount);
    roomObjects.push(mount);
    
    // Camera body
    const bodyGeometry = new THREE.BoxGeometry(0.8, 0.6, 1.2);
    const body = new THREE.Mesh(bodyGeometry, cameraBodyMaterial);
    body.position.set(pos.x, pos.y, pos.z);
    scene.add(body);
    roomObjects.push(body);
    
    // Camera lens
    const lensGeometry = new THREE.CylinderGeometry(0.3, 0.2, 0.4, 16);
    const lens = new THREE.Mesh(lensGeometry, cameraLensMaterial);
    lens.position.set(pos.x, pos.y, pos.z + 0.7);
    lens.rotation.x = Math.PI / 2;
    scene.add(lens);
    roomObjects.push(lens);
    
    // Camera red light
    const redLightGeometry = new THREE.SphereGeometry(0.08, 16, 16);
    const redLightMaterial = new THREE.MeshBasicMaterial({
      color: 0xff3355,
      emissive: 0xff3355,
      emissiveIntensity: 2
    });
    const redLight = new THREE.Mesh(redLightGeometry, redLightMaterial);
    redLight.position.set(pos.x + 0.45, pos.y + 0.1, pos.z);
    scene.add(redLight);
    roomObjects.push(redLight);
    
    // Add blinking animation to red light
    redLight.userData = { originalIntensity: 2, blink: true };
  });
}

function createPlayerPods() {
  // Create positions for player avatars
  // Semi-circle around the central stage
  const radius = 12;
  const count = 8;
  const centerZ = 2;
  
  if (!room) room = {};
  room.pods = [];
  
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 1.5 - Math.PI/4; // 180 degree arc facing the screen
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius + centerZ;
    
    // Create a player platform/pod
    const baseGeometry = new THREE.CylinderGeometry(1, 1.2, 0.2, 32);
    const baseMaterial = new THREE.MeshStandardMaterial({
      color: 0x1a1f2e,
      roughness: 0.4,
      metalness: 0.6
    });
    const base = new THREE.Mesh(baseGeometry, baseMaterial);
    base.position.set(x, 0.1, z);
    base.castShadow = true;
    base.receiveShadow = true;
    scene.add(base);
    roomObjects.push(base);
    
    // Small neon ring around each pod
    const neonMaterial = new THREE.MeshBasicMaterial({
      color: 0x38e8ff,
      transparent: true,
      opacity: 0.6
    });
    const ringGeometry = new THREE.TorusGeometry(1.3, 0.05, 16, 100);
    const ring = new THREE.Mesh(ringGeometry, neonMaterial);
    ring.position.set(x, 0.1, z);
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);
    roomObjects.push(ring);
    
    // Chair for player
    const chairGeometry = new THREE.BoxGeometry(0.8, 1, 0.8);
    const chairMaterial = new THREE.MeshStandardMaterial({
      color: 0x2a2d3a,
      roughness: 0.5,
      metalness: 0.4
    });
    const chair = new THREE.Mesh(chairGeometry, chairMaterial);
    chair.position.set(x, 0.5, z);
    chair.castShadow = true;
    scene.add(chair);
    roomObjects.push(chair);
    
    // Chair back
    const backGeometry = new THREE.BoxGeometry(0.8, 0.8, 0.2);
    const back = new THREE.Mesh(backGeometry, chairMaterial);
    back.position.set(x, 1.25, z - 0.3);
    chair.add(back);
    
    // Store pod position for avatars
    room.pods.push({
      position: new THREE.Vector3(x, 0, z),
      base: base,
      chair: chair,
      ring: ring,
      avatar: null,
      nameTag: null
    });
  }
}

function updatePlayerAvatars() {
  if (!room || !room.pods) return;
  
  // Clear existing avatars
  room.pods.forEach(pod => {
    if (pod.avatar) {
      scene.remove(pod.avatar);
      pod.avatar = null;
    }
    if (pod.nameTag) {
      scene.remove(pod.nameTag);
      pod.nameTag = null;
    }
    if (pod.sittingAvatar) {
      scene.remove(pod.sittingAvatar);
      pod.sittingAvatar = null;
    }
  });
  
  // Create avatars for each player
  players.forEach((player, index) => {
    const pod = room.pods[index % room.pods.length];
    if (!pod) return;
    
    // Create humanoid avatar (simple robot-like figure)
    const playerColor = new THREE.Color(player.color || PLAYER_COLORS[index % PLAYER_COLORS.length]);
    
    // Body (torso)
    const bodyGeometry = new THREE.BoxGeometry(0.4, 0.6, 0.3);
    const bodyMaterial = new THREE.MeshStandardMaterial({
      color: playerColor,
      roughness: 0.4,
      metalness: 0.3
    });
    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    body.position.copy(pod.position);
    body.position.y = 1.5;
    body.castShadow = true;
    scene.add(body);
    pod.sittingAvatar = body;
    
    // Head
    const headGeometry = new THREE.SphereGeometry(0.25, 16, 16);
    const headMaterial = new THREE.MeshStandardMaterial({
      color: playerColor,
      roughness: 0.3,
      metalness: 0.4
    });
    const head = new THREE.Mesh(headGeometry, headMaterial);
    head.position.set(0, 0.95, 0);
    body.add(head);
    
    // Eyes (emissive)
    const eyeGeometry = new THREE.SphereGeometry(0.05, 8, 8);
    const eyeMaterial = new THREE.MeshBasicMaterial({
      color: 0x38e8ff,
      emissive: 0x38e8ff,
      emissiveIntensity: 1
    });
    const eyeL = new THREE.Mesh(eyeGeometry, eyeMaterial);
    eyeL.position.set(-0.08, 0.05, 0.15);
    head.add(eyeL);
    const eyeR = new THREE.Mesh(eyeGeometry, eyeMaterial);
    eyeR.position.set(0.08, 0.05, 0.15);
    head.add(eyeR);
    
    // Arms
    const armGeometry = new THREE.BoxGeometry(0.1, 0.3, 0.1);
    const armMaterial = new THREE.MeshStandardMaterial({
      color: playerColor,
      roughness: 0.4,
      metalness: 0.3
    });
    const armL = new THREE.Mesh(armGeometry, armMaterial);
    armL.position.set(-0.25, 0.15, 0);
    body.add(armL);
    const armR = new THREE.Mesh(armGeometry, armMaterial);
    armR.position.set(0.25, 0.15, 0);
    body.add(armR);
    
    // Add score indicator as floating text
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 128;
    const context = canvas.getContext('2d');
    context.fillStyle = 'rgba(15, 19, 32, 0.8)';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.font = 'Bold 16px Arial';
    context.fillStyle = '#eaf6ff';
    context.textAlign = 'center';
    context.fillText(player.pseudo, canvas.width / 2, canvas.height / 2 - 15);
    context.font = 'Bold 14px Arial';
    context.fillStyle = '#ffd166';
    context.fillText(`Score: ${player.score}`, canvas.width / 2, canvas.height / 2 + 5);
    context.font = 'Bold 12px Arial';
    context.fillStyle = player.color || PLAYER_COLORS[index % PLAYER_COLORS.length];
    context.fillText('Joueur', canvas.width / 2, canvas.height / 2 + 25);
    
    const texture = new THREE.CanvasTexture(canvas);
    const nameTagMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
    const nameTag = new THREE.Sprite(nameTagMaterial);
    nameTag.position.copy(pod.position);
    nameTag.position.y = 2.4;
    nameTag.scale.set(0.5, 0.25, 1);
    scene.add(nameTag);
    pod.nameTag = nameTag;
    
    // Add small glow under avatar
    const glowMaterial = new THREE.MeshBasicMaterial({
      color: playerColor,
      transparent: true,
      opacity: 0.3
    });
    const glowGeometry = new THREE.CircleGeometry(0.3, 16);
    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
    glow.position.set(0, -0.1, 0);
    glow.rotation.x = -Math.PI / 2;
    body.add(glow);
  });
}

function clearThreeJSScene() {
  // Remove all objects except basics
  while(scene.children.length > 0) {
    const obj = scene.children[0];
    if (obj.type === 'Mesh' || obj.type === 'Group' || obj.type === 'Points' || obj.type === 'Line') {
      scene.remove(obj);
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (obj.material.map) obj.material.map.dispose();
        obj.material.dispose();
      }
    } else {
      break;
    }
  }
  
  // Recreate basic elements
  createGridFloor();
  createStars();
  createHorizon();
  createWalls();
  
  room = {};
  playerAvatars = {};
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  
  const time = Date.now() * 0.001;
  
  // Pulsing effect for neon lights
  const cyanLights = scene.children.filter(child => 
    child instanceof THREE.PointLight && child.color.getHex() === 0x38e8ff
  );
  const magentaLights = scene.children.filter(child => 
    child instanceof THREE.PointLight && child.color.getHex() === 0xff3355
  );
  const greenLights = scene.children.filter(child => 
    child instanceof THREE.PointLight && child.color.getHex() === 0x00ffa3
  );
  const purpleLights = scene.children.filter(child => 
    child instanceof THREE.PointLight && child.color.getHex() === 0x8b5cf6
  );
  
  cyanLights.forEach(light => {
    light.intensity = 2 + Math.sin(time * 2 + light.position.x * 0.1) * 0.5;
  });
  
  magentaLights.forEach(light => {
    light.intensity = 2 + Math.sin(time * 1.5 + light.position.x * 0.1) * 0.5;
  });
  
  greenLights.forEach(light => {
    light.intensity = 1.5 + Math.sin(time * 1.8 + light.position.z * 0.1) * 0.3;
  });
  
  purpleLights.forEach(light => {
    light.intensity = 1.5 + Math.sin(time * 2.2 + light.position.x * 0.1) * 0.3;
  });
  
  // Blink camera red lights
  scene.children.forEach(child => {
    if (child.userData && child.userData.blink) {
      const blinkIntensity = Math.sin(time * 10) > 0.7 ? 2 : 0.5;
      child.material.emissiveIntensity = blinkIntensity;
    }
  });
  
  // Animate particles
  scene.children.forEach(child => {
    if (child instanceof THREE.Points) {
      const positions = child.geometry.attributes.position;
      for (let i = 0; i < positions.count; i++) {
        const i3 = i * 3;
        positions.array[i3 + 1] += Math.sin(time * 0.5 + i * 0.2) * 0.005;
      }
      positions.needsUpdate = true;
    }
  });
  
  // Slow camera orbit for better viewing
  if (!isDemoMode || demoQuestionIndex >= DEMO_QUESTIONS.length) {
    // Only orbit when not in active game
  }
  
  renderer.render(scene, camera);
}

// ============================================================
// MOUSE CONTROLS
// ============================================================

let mouseControls = {
  isDragging: false,
  previousMousePosition: { x: 0, y: 0 },
  targetCameraPosition: null,
  targetLookAt: null
};

function setupMouseControls() {
  const container = document.getElementById('three-container');
  
  container.addEventListener('mousedown', (event) => {
    if (event.button === 0 || event.button === 2) { // Left or right click
      mouseControls.isDragging = true;
      mouseControls.previousMousePosition = { x: event.clientX, y: event.clientY };
      container.style.cursor = 'grab';
    }
  });
  
  container.addEventListener('mousemove', (event) => {
    if (!mouseControls.isDragging) return;
    
    const deltaX = event.clientX - mouseControls.previousMousePosition.x;
    const deltaY = event.clientY - mouseControls.previousMousePosition.y;
    
    // Rotate camera around the scene
    const radius = camera.position.length();
    const currentPhi = Math.atan2(camera.position.z, camera.position.x);
    const currentTheta = Math.atan2(Math.sqrt(camera.position.x * camera.position.x + camera.position.z * camera.position.z), camera.position.y);
    
    let newPhi = currentPhi + (deltaX * 0.01);
    let newTheta = currentTheta + (deltaY * 0.01);
    
    // Limit vertical rotation
    newTheta = Math.max(0.3, Math.min(Math.PI - 0.3, newTheta));
    
    // Calculate new camera position
    const newX = radius * Math.cos(newPhi) * Math.sin(newTheta);
    const newZ = radius * Math.sin(newPhi) * Math.sin(newTheta);
    const newY = radius * Math.cos(newTheta);
    
    camera.position.set(newX, newY, newZ);
    camera.lookAt(0, 1.5, 0);
    
    mouseControls.previousMousePosition = { x: event.clientX, y: event.clientY };
  });
  
  container.addEventListener('mouseup', () => {
    mouseControls.isDragging = false;
    container.style.cursor = 'default';
  });
  
  container.addEventListener('wheel', (event) => {
    event.preventDefault();
    const delta = event.deltaY > 0 ? -1.5 : 1.5;
    const direction = camera.position.clone().sub(new THREE.Vector3(0, 1.5, 0)).normalize();
    camera.position.addScaledVector(direction, delta);
    
    // Clamp distance
    const distance = camera.position.length();
    if (distance < 8) camera.position.setLength(8);
    if (distance > 40) camera.position.setLength(40);
  });
  
  container.addEventListener('mouseleave', () => {
    mouseControls.isDragging = false;
    container.style.cursor = 'default';
  });
}
