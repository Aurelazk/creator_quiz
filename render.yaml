# Render Blueprint — serveur de jeu CREATOR (WebSocket + état des salles).
# Le site statique reste sur Vercel ; ce service ne sert que le jeu.
services:
  - type: web
    name: creator-quiz-game
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://creatorquiz-chi.vercel.app
      - key: ALLOWED_ORIGIN
        value: https://creatorquiz-chi.vercel.app
      - key: KV_REST_API_URL
        value: https://<ton-upstash>.upstash.io
      - key: KV_REST_API_TOKEN
        value: <ton-token>
      - key: LEADERBOARD_WRITE_TOKEN
        value: <secret-partage-render-vercel>
