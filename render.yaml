services:
  - type: web
    name: creator-quiz
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://creator-quiz.onrender.com
      - key: ALLOWED_ORIGIN
        value: https://creator-quiz.onrender.com
      - key: KV_REST_API_URL
        sync: false
      - key: KV_REST_API_TOKEN
        sync: false
