<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#111;color:#0f0;font:12px monospace;overflow:hidden}
#out{position:fixed;left:0;top:0;z-index:9;background:#000a;padding:6px;white-space:pre;max-height:100vh;overflow:auto}
</style></head><body><div id="out"></div>
<script src="../assets/vendor/three.min.js"></script>
<script src="../assets/vendor/GLTFLoader.js"></script>
<script src="../assets/vendor/DRACOLoader.js"></script>
<script>
const out=document.getElementById('out');
const log=(s)=>{out.textContent+=s+"\n";console.log(s);document.title="ready"};
const W=1280,H=720;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(W,H);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x223355);
const cam=new THREE.PerspectiveCamera(45,W/H,0.1,5000);
scene.add(new THREE.HemisphereLight(0xffffff,0x334455,1.1));
const d=new THREE.DirectionalLight(0xffffff,1.2);d.position.set(6,12,8);scene.add(d);
scene.add(new THREE.AxesHelper(5));
const loader=new THREE.GLTFLoader();
const draco=new THREE.DRACOLoader();draco.setDecoderPath('../assets/vendor/draco/');loader.setDRACOLoader(draco);
loader.load('../assets/models/scene.glb',(g)=>{
  const root=g.scene;scene.add(root);
  root.updateMatrixWorld(true);
  const all=new THREE.Box3().setFromObject(root);const sz=new THREE.Vector3(),ctr=new THREE.Vector3();
  all.getSize(sz);all.getCenter(ctr);
  log('WHOLE min '+all.min.toArray().map(n=>n.toFixed(2))+' max '+all.max.toArray().map(n=>n.toFixed(2)));
  log('size '+sz.toArray().map(n=>n.toFixed(2)));
  for(const c of root.children){
    const b=new THREE.Box3().setFromObject(c);const s=new THREE.Vector3();b.getSize(s);
    log(c.name+' | min '+b.min.toArray().map(n=>n.toFixed(2))+' | size '+s.toArray().map(n=>n.toFixed(2)));
  }
  const dist=Math.max(sz.x,sz.y)*1.6;
  const angles=[{n:'front',p:[ctr.x,ctr.y+sz.y*0.35,Math.max(all.max.z+dist,dist)]},
                {n:'side',p:[Math.max(all.max.x+dist,dist),ctr.y+sz.y*0.3,ctr.z]},
                {n:'top',p:[ctr.x+0.01,all.max.y+dist,ctr.z]}];
  window.__shots=angles;
  const a=angles[0];cam.position.set(...a.p);cam.lookAt(ctr);
  (function loop(){requestAnimationFrame(loop);renderer.render(scene,cam);})();
  setTimeout(()=>{renderer.render(scene,cam);const gl=renderer.getContext();const px=new Uint8Array(4);
    gl.readPixels(640,360,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);log('PIXEL '+Array.from(px));},1500);
  window.__setView=(i)=>{const q=angles[i];cam.position.set(...q.p);cam.lookAt(ctr);};
},undefined,(e)=>{log('ERR '+e);});
</script></body></html>
